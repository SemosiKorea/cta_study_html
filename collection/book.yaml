  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 체납과 체납액, 징수의 순위"
    statement: "체납액은 체납된 본세만 뜻하므로 가산세와 강제징수비는 포함하지 않는다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "체납된 국세에는 가산세가 포함되고 강제징수비도 체납액에 포함된다.\n비교 조건: 납부기한의 종류와 체납액의 구성 요소\n근거: 국세징수법 제2조 · 국세징수법 제3조 · 국세징수법 제4조 · 국세징수법 제5조"
    source: "국세징수법 법조문 회독 · 2026.11.1. 기준 · 국세징수법 제2조 https://www.law.go.kr/법령/국세징수법/제2조 / 국세징수법 제3조 https://www.law.go.kr/법령/국세징수법/제3조 / 국세징수법 제4조 https://www.law.go.kr/법령/국세징수법/제4조 / 국세징수법 제5조 https://www.law.go.kr/법령/국세징수법/제5조"
    referenceYear: 2026
    tags: ["국세징수법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 체납과 체납액, 징수의 순위"
    statement: "본세 100만 원, 가산세 10만 원, 강제징수비 5만 원을 징수할 때 강제징수비를 본세보다 먼저 충당한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제3조의 순위는 강제징수비·본세·가산세다.\n비교 조건: 납부기한의 종류와 체납액의 구성 요소\n근거: 국세징수법 제2조 · 국세징수법 제3조 · 국세징수법 제4조 · 국세징수법 제5조"
    source: "국세징수법 법조문 회독 · 2026.11.1. 기준 · 국세징수법 제2조 https://www.law.go.kr/법령/국세징수법/제2조 / 국세징수법 제3조 https://www.law.go.kr/법령/국세징수법/제3조 / 국세징수법 제4조 https://www.law.go.kr/법령/국세징수법/제4조 / 국세징수법 제5조 https://www.law.go.kr/법령/국세징수법/제5조"
