    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 실태확인·사실행위 위탁·납부방법"
    statement: "한국자산관리공사는 위탁받은 체납액 징수 관련 사실행위를 다른 회사에 다시 위탁할 수 없다."
    choices: ["O","X","?"]
