  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 실태확인·사실행위 위탁·납부방법"
    statement: "신용카드로 국세를 납부하면 카드대금을 결제계좌에서 출금한 날을 납부일로 본다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "국세납부대행기관의 승인일이다. 카드 이용대금의 후일 결제일과 다르다.\n비교 조건: 사실확인과 법적 집행, 승인일과 결제일\n근거: 국세징수법 제10조의2 · 국세징수법 제11조 · 국세징수법 제12조 · 국세징수법 제116조 · 국세징수법 시행령 제10조"
