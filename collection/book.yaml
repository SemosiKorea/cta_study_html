  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 제2편 납부기한 연장·고지 유예·납세담보 · 재난·사업손실·장부 도난의 연장 사유"
    statement: "납부고지 유예에는 고지 전부를 미루는 경우만 포함되고 세액을 나누어 고지하는 경우는 포함되지 않는다."
    choices: ["O","X","?"]
