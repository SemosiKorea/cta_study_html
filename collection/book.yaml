  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 납부고지의 내용·기한·상대방"
    statement: "제2차 납세의무자에게는 원래 납세자에게 보낸 고지서 사본만 주면 되고 그로부터 징수할 금액은 밝히지 않아도 된다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "제7조는 제2차 납세의무자등에게 별도의 고지사항과 책임 금액의 산출 근거를 요구한다.\n비교 조건: 원래 납세자인지 책임을 확장받는 자인지\n근거: 국세징수법 제6조 · 국세징수법 제7조 · 국세징수법 제8조"
    source: "국세징수법 법조문 회독 · 2026.11.1. 기준 · 국세징수법 제6조 https://www.law.go.kr/법령/국세징수법/제6조 / 국세징수법 제7조 https://www.law.go.kr/법령/국세징수법/제7조 / 국세징수법 제8조 https://www.law.go.kr/법령/국세징수법/제8조"
    referenceYear: 2026
    tags: ["국세징수법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 납부고지의 내용·기한·상대방"
    statement: "납부고지 유예기간이 끝난 경우 고지서는 그 종료일의 다음 날 발급한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제8조 단서가 유예 후 발급시기를 정한다.\n비교 조건: 원래 납세자인지 책임을 확장받는 자인지\n근거: 국세징수법 제6조 · 국세징수법 제7조 · 국세징수법 제8조"
    source: "국세징수법 법조문 회독 · 2026.11.1. 기준 · 국세징수법 제6조 https://www.law.go.kr/법령/국세징수법/제6조 / 국세징수법 제7조 https://www.law.go.kr/법령/국세징수법/제7조 / 국세징수법 제8조 https://www.law.go.kr/법령/국세징수법/제8조"
