    rationale: "독촉을 하는 날부터 20일 이내다. 발급 자체는 지정납부기한 경과 후 10일 이내가 원칙이다.\n비교 조건: 발급일·원래 기한·도달일을 구분\n근거: 국세징수법 제10조 · 국세징수법 제17조 · 국세징수법 시행령 제3조"
