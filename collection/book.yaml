  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 제2편 납부기한 연장·고지 유예·납세담보 · 재난·사업손실·장부 도난의 연장 사유"
    statement: "세무대리인이 해당 납세자의 장부를 도난당하여 납부가 곤란한 경우에도 시행령상 연장 사유에 해당할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "본인의 재산 도난만으로 한정하지 않는다.\n비교 조건: 연장할 대상과 곤란 사유\n근거: 국세징수법 제13조 · 국세징수법 제14조 · 국세징수법 시행령 제11조 · 국세징수법 시행령 제13조"
