    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 납부기한 전 징수와 단순한 사업손실"
    statement: "사업에 현저한 손실이 발생했다는 사실만으로 제9조의 납부기한 전 징수 사유에 해당한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "현저한 사업손실은 제13조 연장 사유다. 기한 전 징수의 열거 사유와 다르다.\n비교 조건: 확정 여부와 납기 단축·연장 사유의 구분\n근거: 국세징수법 제9조 · 국세징수법 제31조"
