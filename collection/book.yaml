    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 독촉과 송달 지연의 새 납부기한"
    statement: "독촉장의 납부기한은 지정납부기한이 지난 날부터 20일 이내로 정한다."
