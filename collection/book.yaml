  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 납부기한 전 징수와 단순한 사업손실"
    statement: "법인이 해산하여 이미 확정된 국세를 기한 전에 징수하려면 단축된 납부기한을 정하여 고지하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "제9조 제1항 제4호 및 제2항에 따른다.\n비교 조건: 확정 여부와 납기 단축·연장 사유의 구분\n근거: 국세징수법 제9조 · 국세징수법 제31조"
