    subject: "세법학개론"
    unit: "국세징수법 제1편 총칙·신고납부·납부고지·독촉 · 독촉과 송달 지연의 새 납부기한"
    statement: "통상 고지서가 지정납부기한이 지난 후 도착했다면 도달한 날부터 14일이 지난 날을 새 지정납부기한으로 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제17조 제1항의 기준은 도달일이다.\n비교 조건: 발급일·원래 기한·도달일을 구분\n근거: 국세징수법 제10조 · 국세징수법 제17조 · 국세징수법 시행령 제3조"
