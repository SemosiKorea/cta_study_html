    unit: "국세징수법 · 2023년 42번 ①"
    statement: "42. <국세징수법> 국세징수법령상 고액ㆍ상습체납자에 대하여 행할 수 있는 사항으로 옳지 않은 것은?\n\n판단할 선지 ①\n관할 세무서장은 체납 발생일부터 1년이 지난 국세의 합계액이 2억원 이상인 경우에 체납자의 수입물품에 대한 강제징수를 세관장에게 위탁할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "수입물품 강제징수의 세관장 위탁 문턱은 체납 발생일부터 1년 지난 국세의 합계액 2억 원 이상이다.\n국세징수법 제30조 https://www.law.go.kr/법령/국세징수법/제30조"
    source: "2023년 세무사 1차 42번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 42번 ②"
    statement: "42. <국세징수법> 국세징수법령상 고액ㆍ상습체납자에 대하여 행할 수 있는 사항으로 옳지 않은 것은?\n\n판단할 선지 ②\n국세청장은 체납 발생일부터 1년이 지난 국세의 합계액이 2억원 이상인 경우에 체납자의 인적사항 및 체납액 등을 공개할 수 있으나 체납된 국세와 관련하여 심판청구가 계속 중인 경우에는 공개할 수 없다."
    choices: ["O","X","?"]
