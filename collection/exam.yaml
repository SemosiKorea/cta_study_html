    rationale: "명단공개는 1년 경과·합계 2억 원 이상이 기본 문턱이나, 해당 체납 국세에 심판청구등이 계속 중이면 공개할 수 없다.\n국세징수법 제114조 https://www.law.go.kr/법령/국세징수법/제114조"
    source: "2023년 세무사 1차 42번 ② · 2026.11.1. 기준"
