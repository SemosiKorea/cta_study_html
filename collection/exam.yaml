schema: hoedok.cards/v1
cards:
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 45번 ①"
    statement: "45. <국세징수법> 국세징수법령상 납세담보에 관한 설명으로 옳은 것은?\n\n판단할 선지 ①\n양도성 예금증서는 납세담보로 제공할 수 있는 유가증권에 해당하지 않는다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "양도성 예금증서는 시행령이 정한 납세담보용 유가증권에 포함된다. “해당하지 않는다”를 “해당한다”로 바꾸어야 한다.\n국세징수법 제18조 https://www.law.go.kr/법령/국세징수법/제18조\n국세징수법 시행령 제18조 https://www.law.go.kr/법령/국세징수법시행령/제18조"
    source: "2022년 세무사 1차 45번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 45번 ②"
    statement: "45. <국세징수법> 국세징수법령상 납세담보에 관한 설명으로 옳은 것은?\n\n판단할 선지 ②\n납세담보로서 금전을 제공한 자는 그 금전으로 담보한 국세 및 강제징수비를 납부할 수 없다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "납세담보로 제공한 금전으로 그 담보한 국세 및 강제징수비를 납부할 수 있다. 문서로 납부를 신청하면 신청한 금액만큼 납부한 것으로 본다.\n국세징수법 제22조 https://www.law.go.kr/법령/국세징수법/제22조\n국세징수법 시행령 제22조 https://www.law.go.kr/법령/국세징수법시행령/제22조"
    source: "2022년 세무사 1차 45번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 45번 ③"
    statement: "45. <국세징수법> 국세징수법령상 납세담보에 관한 설명으로 옳은 것은?\n\n판단할 선지 ③\n납세보증보험증권은 보험기간이 납세담보를 필요로 하는 기간에 20일을 더한 기간이상인 것으로 한정한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "확정된 납부기한을 전제로 보험기간은 담보 필요기간에 30일을 더한 기간 이상이다. 선지의 20일이 틀렸다. 납부기한 미확정 국세에는 국세청장이 정하는 기간을 적용한다.\n국세징수법 제18조 https://www.law.go.kr/법령/국세징수법/제18조\n국세징수법 시행령 제18조 https://www.law.go.kr/법령/국세징수법시행령/제18조"
    source: "2022년 세무사 1차 45번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 45번 ④"
    statement: "45. <국세징수법> 국세징수법령상 납세담보에 관한 설명으로 옳은 것은?\n\n판단할 선지 ④\n납세담보를 토지로 제공하는 경우에는 담보할 국세의 100분의 110의 가액에 상당하는 담보를 제공할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "확정된 국세를 토지로 담보하면 120% 이상의 가액이 필요하다. 110%는 금전·납세보증보험증권·은행의 납세보증서에 적용하는 예외이다.\n국세징수법 제18조 https://www.law.go.kr/법령/국세징수법/제18조"
    source: "2022년 세무사 1차 45번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 45번 ⑤"
    statement: "45. <국세징수법> 국세징수법령상 납세담보에 관한 설명으로 옳은 것은?\n\n판단할 선지 ⑤\n납세담보를 현금화한 금전으로 징수해야 할 국세 및 강제징수비를 징수하고 남은 금전이 있는 경우 공매대금의 배분방법에 따라 배분한 후 납세자에게 지급한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "담보를 현금화하여 국세와 강제징수비를 징수한 뒤 남은 돈은 공매대금 배분방법에 따라 배분한 후 납세자에게 지급한다. 바로 전액을 반환하는 구조가 아니다.\n국세징수법 제22조 https://www.law.go.kr/법령/국세징수법/제22조\n국세징수법 시행령 제22조 https://www.law.go.kr/법령/국세징수법시행령/제22조"
    source: "2022년 세무사 1차 45번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 46번 ①"
    statement: "46. <국세징수법> 국세징수법상 공매의 준비에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ①\n공매보증에 있어 공매보증금액은 공매예정가격의 100분의 10 이상으로 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "공매보증금액의 법정 하한은 공매예정가격의 10%이다. “정확히 10%”가 아니라 “10% 이상”이다.\n국세징수법 제71조 https://www.law.go.kr/법령/국세징수법/제71조"
    source: "2022년 세무사 1차 46번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 46번 ②"
    statement: "46. <국세징수법> 국세징수법상 공매의 준비에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ②\n공매보증은 금전, 국공채, 증권시장에 상장된 증권,「보험업법」에 따른 보험회사가 발행한 보증보험증권의 어느 하나에 해당하는 것으로 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "공매보증은 금전·국공채·상장증권·보험회사의 보증보험증권 중 하나로 한다. 납세담보의 종류와 공매보증의 종류를 구별한다.\n국세징수법 제71조 https://www.law.go.kr/법령/국세징수법/제71조"
    source: "2022년 세무사 1차 46번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 46번 ③"
    statement: "46. <국세징수법> 국세징수법상 공매의 준비에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ③\n관할 세무서장은 공매재산에 압류와 관계되는 국세보다 우선하는 제한물권 등이 있는 경우 제한물권 등을 매수인에게 인수하게 하거나 매수대금으로 그 제한물권 등에 의하여 담보된 채권을 변제하는 데 충분하다고 인정된 경우가 아니면 그 재산을 공매하지 못한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "우선하는 제한물권 등이 있으면 매수인에게 인수시키거나 매수대금으로 그 담보채권을 변제하기 충분하다고 인정되어야 공매할 수 있다.\n국세징수법 제78조 https://www.law.go.kr/법령/국세징수법/제78조"
    source: "2022년 세무사 1차 46번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 46번 ④"
    statement: "46. <국세징수법> 국세징수법상 공매의 준비에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ④\n체납자는 제3자의 명의나 계산으로 압류재산을 매수할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "체납자는 자기 명의뿐 아니라 제3자의 명의나 계산으로도 압류재산을 매수하지 못한다. 세무공무원과 평가전문가도 같은 제한을 받는다.\n국세징수법 제80조 https://www.law.go.kr/법령/국세징수법/제80조"
    source: "2022년 세무사 1차 46번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 46번 ⑤"
    statement: "46. <국세징수법> 국세징수법상 공매의 준비에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ⑤\n관할 세무서장은 거짓 명의로 매수신청을 한 사실이 있는 자에 대해서는 그 사실이 있은 후 2년간 공매장소 출입을 제한하거나 입찰에 참가시키지 아니할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "거짓 명의로 매수신청을 한 사실이 있으면 그 사실 후 2년간 공매장소 출입 제한 또는 입찰 참가 제한을 할 수 있다.\n국세징수법 제81조 https://www.law.go.kr/법령/국세징수법/제81조"
    source: "2022년 세무사 1차 46번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 47번 ①"
    statement: "47. <국세징수법> 국세징수법상 강제징수에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ①\n관할 세무서장은 재판상의 가압류 또는 가처분 재산이 강제징수 대상인 경우에도 국세징수법에 따른 강제징수를 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "재판상 가압류·가처분이 되어 있어도 국세징수법에 따른 강제징수를 한다. 사법상 보전처분만으로 강제징수가 금지되지 않는다.\n국세징수법 제26조 https://www.law.go.kr/법령/국세징수법/제26조"
    source: "2022년 세무사 1차 47번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 47번 ②"
    statement: "47. <국세징수법> 국세징수법상 강제징수에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ②\n체납자의 재산에 대하여 강제징수를 시작한 후 체납자인 법인이 합병으로 소멸된 경우에도 그 재산에 대한 강제징수는 계속 진행하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "강제징수를 시작한 뒤 법인이 합병으로 소멸해도 해당 재산의 강제징수는 계속 진행하여야 한다. 시작 전·후를 구별한다.\n국세징수법 제27조 https://www.law.go.kr/법령/국세징수법/제27조"
    source: "2022년 세무사 1차 47번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 47번 ③"
    statement: "47. <국세징수법> 국세징수법상 강제징수에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ③\n체납자 또는 제3자가 압류재산의 사용 또는 수익을 하는 경우 그 재산의 매각으로 인하여 권리를 이전하기 전까지 이미 거두어들인 천연과실에 대해서는 압류의 효력이 미치지 아니한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "압류 효력은 원칙적으로 천연과실과 법정과실에도 미친다. 다만 체납자 또는 제3자가 사용·수익하며 권리 이전 전 이미 거둔 천연과실에는 미치지 않는다.\n국세징수법 제44조 https://www.law.go.kr/법령/국세징수법/제44조"
    source: "2022년 세무사 1차 47번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 47번 ④"
    statement: "47. <국세징수법> 국세징수법상 강제징수에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ④\n급료, 임금, 봉급, 세비, 퇴직연금 또는 그 밖에 계속적 거래관계에서 발생하는 이와 유사한 채권에 대한 압류의 효력은 체납액을 한도로 하여 압류 후에 발생할 채권에도 미친다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "급료 등 계속적 거래관계에서 발생하는 채권은 체납액을 한도로 압류 후 발생할 채권에도 압류 효력이 미친다.\n국세징수법 제54조 https://www.law.go.kr/법령/국세징수법/제54조"
    source: "2022년 세무사 1차 47번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2022","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2022년 47번 ⑤"
    statement: "47. <국세징수법> 국세징수법상 강제징수에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ⑤\n관할 세무서장은 체납자가 국가 또는 지방자치단체의 재산을 매수한 경우 소유권 이전 전에는 그 재산에 관한 체납자의 국가 또는 지방자치단체에 대한 권리를 압류할 수 없다."
    choices: ["O","X","?"]
    answer: "X"
