  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 45번 ③"
    statement: "45. <국세징수법> 국세징수법상 압류한 재산을 수의계약으로 매각할 수 있는 경우가 아닌 것은?\n판단 대상: 다음 경우는 압류재산을 수의계약으로 매각할 수 있는 경우에 해당한다.\n각 선지가 “압류재산을 수의계약으로 매각할 수 있는 법정 사유”에 해당하는지를 O·X로 판단한다. 원문은 그중 해당하지 않는 경우를 고르는 문항이다.\n\n판단할 선지 ③\n부패ㆍ변질 또는 감량되기 쉬운 재산으로서 속히 매각하지 아니하면 그 재산가액이 줄어들 우려가 있는 경우"
    choices: ["O","X","?"]
    answer: "O"
    rationale: "부패·변질·감량되기 쉬워 신속히 팔지 않으면 재산가액이 줄어들 우려가 있는 경우 수의계약으로 매각할 수 있다.\n국세징수법 제67조 https://www.law.go.kr/법령/국세징수법/제67조"
    source: "2023년 세무사 1차 45번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
