    unit: "국세징수법 · 2023년 42번 ⑤"
    statement: "42. <국세징수법> 국세징수법령상 고액ㆍ상습체납자에 대하여 행할 수 있는 사항으로 옳지 않은 것은?\n\n판단할 선지 ⑤\n국세청장은 정당한 사유 없이 5천만원 이상의 국세를 체납한 자 중 명단이 공개된 고액ㆍ상습체납자로서 관할 세무서장이 압류ㆍ공매, 담보 제공, 보증인의 납세보증서 등으로 조세채권을 확보할 수 없고, 강제징수를 회피할 우려가 있다고 인정하는 사람에 대하여 법무부장관에게 출국금지를 요청하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "5천만 원 이상 체납한 공개 대상 고액·상습체납자가 법정 유형에 해당하고, 조세채권 확보가 안 되며 강제징수 회피 우려가 인정되면 법무부장관에게 출국금지를 요청하여야 한다. 금액만 충족한다고 자동 요청하는 것은 아니다.\n국세징수법 제113조 https://www.law.go.kr/법령/국세징수법/제113조\n국세징수법 시행령 제103조 https://www.law.go.kr/법령/국세징수법시행령/제103조"
    source: "2023년 세무사 1차 42번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 45번 ①"
    statement: "45. <국세징수법> 국세징수법상 압류한 재산을 수의계약으로 매각할 수 있는 경우가 아닌 것은?\n판단 대상: 다음 경우는 압류재산을 수의계약으로 매각할 수 있는 경우에 해당한다.\n각 선지가 “압류재산을 수의계약으로 매각할 수 있는 법정 사유”에 해당하는지를 O·X로 판단한다. 원문은 그중 해당하지 않는 경우를 고르는 문항이다.\n\n판단할 선지 ①\n공매가 공익을 위하여 적절하지 아니한 경우"
    choices: ["O","X","?"]
    answer: "O"
    rationale: "공매가 공익을 위하여 적절하지 않은 경우는 수의계약 사유이다.\n국세징수법 제67조 https://www.law.go.kr/법령/국세징수법/제67조"
    source: "2023년 세무사 1차 45번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 45번 ②"
    statement: "45. <국세징수법> 국세징수법상 압류한 재산을 수의계약으로 매각할 수 있는 경우가 아닌 것은?\n판단 대상: 다음 경우는 압류재산을 수의계약으로 매각할 수 있는 경우에 해당한다.\n각 선지가 “압류재산을 수의계약으로 매각할 수 있는 법정 사유”에 해당하는지를 O·X로 판단한다. 원문은 그중 해당하지 않는 경우를 고르는 문항이다.\n\n판단할 선지 ②\n제1회 공매 후 1년간 5회 이상 공매하여도 매각되지 아니한 경우"
    choices: ["O","X","?"]
