    rationale: "감치는 검사의 청구에 따른 법원의 결정으로 30일 범위에서 가능하며, 집행 중 체납 국세를 납부하면 감치집행을 종료하여야 한다.\n국세징수법 제115조 https://www.law.go.kr/법령/국세징수법/제115조"
