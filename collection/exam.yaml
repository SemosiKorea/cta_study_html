  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 42번 ④"
    statement: "42. <국세징수법> 국세징수법령상 고액ㆍ상습체납자에 대하여 행할 수 있는 사항으로 옳지 않은 것은?\n\n판단할 선지 ④\n법원의 결정으로 30일의 범위에서 체납된 국세가 납부될 때까지 체납자를 감치(監置)에 처할 수 있으며 감치의 집행 중에 체납된 국세를 납부한 경우 감치집행을 종료하여야 한다."
