    unit: "국세징수법 · 2023년 42번 ③"
    statement: "42. <국세징수법> 국세징수법령상 고액ㆍ상습체납자에 대하여 행할 수 있는 사항으로 옳지 않은 것은?\n\n판단할 선지 ③\n국세청장은 체납 발생일부터 1년이 지난 국세의 합계액이 2억원 이상인 경우에 체납자의 주소 또는 거소를 관할하는 지방검찰청 또는 지청의 검사에게 체납자의 감치(監置)를 신청할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "1년 경과·2억 원만으로 감치를 신청할 수 없다. 3회 이상 체납, 각 1년 경과, 합계 2억 원과 납부능력·정당한 사유 없음·국세정보위원회 의결을 모두 충족해야 한다. 또한 기준일 조문은 2026.10.2.부터 “지방공소청 또는 지청의 검사”로 정비되어 원문의 기관명과 다르다.\n국세징수법 제115조 https://www.law.go.kr/법령/국세징수법/제115조"
