  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 45번 ④"
    statement: "45. <국세징수법> 국세징수법상 압류한 재산을 수의계약으로 매각할 수 있는 경우가 아닌 것은?\n판단 대상: 다음 경우는 압류재산을 수의계약으로 매각할 수 있는 경우에 해당한다.\n각 선지가 “압류재산을 수의계약으로 매각할 수 있는 법정 사유”에 해당하는지를 O·X로 판단한다. 원문은 그중 해당하지 않는 경우를 고르는 문항이다.\n\n판단할 선지 ④\n압류한 재산의 추산가격이 1천만원 미만인 경우"
    choices: ["O","X","?"]
    answer: "O"
    rationale: "압류재산의 추산가격이 1천만 원 미만이면 수의계약으로 매각할 수 있다. 정확히 1천만 원이면 이 호의 금액 요건을 충족하지 않는다.\n국세징수법 제67조 https://www.law.go.kr/법령/국세징수법/제67조"
    source: "2023년 세무사 1차 45번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 45번 ⑤"
    statement: "45. <국세징수법> 국세징수법상 압류한 재산을 수의계약으로 매각할 수 있는 경우가 아닌 것은?\n판단 대상: 다음 경우는 압류재산을 수의계약으로 매각할 수 있는 경우에 해당한다.\n각 선지가 “압류재산을 수의계약으로 매각할 수 있는 법정 사유”에 해당하는지를 O·X로 판단한다. 원문은 그중 해당하지 않는 경우를 고르는 문항이다.\n\n판단할 선지 ⑤\n수의계약으로 매각하지 아니하면 매각대금이 체납된 세액 이하가 될 것으로 예상되는 경우"
    choices: ["O","X","?"]
    answer: "X"
    rationale: "기준은 매각대금이 체납 세액 이하인지가 아니라 강제징수비 이하가 될 것으로 예상되는지이다. 단순히 세금 전액을 회수하지 못한다는 사정만으로 이 사유가 되지는 않는다.\n국세징수법 제67조 https://www.law.go.kr/법령/국세징수법/제67조"
    source: "2023년 세무사 1차 45번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 46번 ①"
    statement: "46. <국세징수법> 국세징수법상 압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ①\n납부기한 전 징수에 따라 납부고지를 받고 단축된 기한까지 국세를 완납하지 아니한 경우에는 독촉없이 압류한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "납부기한 전 징수의 단축기한까지 완납하지 않으면 압류한다. 이 경우 독촉을 생략할 수 있어 통상적인 독촉절차를 먼저 거칠 필요가 없다.\n국세징수법 제9조 https://www.law.go.kr/법령/국세징수법/제9조\n국세징수법 제10조 https://www.law.go.kr/법령/국세징수법/제10조\n국세징수법 제31조 https://www.law.go.kr/법령/국세징수법/제31조\n국세징수법 시행령 제3조 https://www.law.go.kr/법령/국세징수법시행령/제3조"
    source: "2023년 세무사 1차 46번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 46번 ②"
    statement: "46. <국세징수법> 국세징수법상 압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ②\n채권 압류의 효력은 채권 압류 통지서가 체납자에게 송달된 때에 발생한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "채권 압류 효력은 통지서가 제3채무자에게 송달된 때 발생한다. 체납자에게도 통지해야 하지만 체납자 송달은 효력 발생 기준이 아니다.\n국세징수법 제51조 https://www.law.go.kr/법령/국세징수법/제51조\n국세징수법 제52조 https://www.law.go.kr/법령/국세징수법/제52조"
    source: "2023년 세무사 1차 46번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 46번 ③"
    statement: "46. <국세징수법> 국세징수법상 압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ③\n체납자 또는 제3자가 압류재산의 사용 또는 수익을 하는 경우 그 재산의 매각으로 인하여 권리를 이전하기 전까지 이미 거두어들인 천연과실에 대해서는 압류의 효력이 미치지 아니한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "압류재산 사용·수익자가 매각으로 권리가 이전되기 전에 이미 거둔 천연과실에는 압류 효력이 미치지 않는다.\n국세징수법 제44조 https://www.law.go.kr/법령/국세징수법/제44조"
    source: "2023년 세무사 1차 46번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 46번 ④"
    statement: "46. <국세징수법> 국세징수법상 압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ④\n세무공무원은 제3자가 제3자의 주거에 체납자의 재산을 감춘 혐의가 있다고 인정되는 경우 제3자의 주거를 수색할 수 있고, 해당 주거의 폐쇄된 문ㆍ금고를 직접 열 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "제3자의 주거 등에 체납자 재산을 감춘 혐의가 인정되면 수색할 수 있으며 폐쇄된 문·금고 등을 열게 하거나 직접 열 수 있다. 수색시간·참여자 등의 절차 제한은 별도로 지킨다.\n국세징수법 제35조 https://www.law.go.kr/법령/국세징수법/제35조\n국세징수법 제37조 https://www.law.go.kr/법령/국세징수법/제37조"
    source: "2023년 세무사 1차 46번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 46번 ⑤"
    statement: "46. <국세징수법> 국세징수법상 압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ⑤\n관할 세무서장은 체납자가 국가의 재산을 매수한 경우 소유권 이전 전이라도 그 재산에 관한 체납자의 국가에 대한 권리를 압류한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "국가재산 매수자의 소유권이 아직 이전되지 않았더라도 국가에 대한 해당 재산상 권리를 압류한다.\n국세징수법 제56조 https://www.law.go.kr/법령/국세징수법/제56조"
    source: "2023년 세무사 1차 46번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 47번 ①"
    statement: "47. <국세징수법> 국세징수법령상 납부기한의 연장과 납부고지의 유예에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ①\n납세자가 납부기한의 만료일 10일 전까지 납부기한 연장 신청을 하였으나 관할 세무서장이 그 신청일부터 10일 이내에 승인 여부를 통지하지 아니한 경우에는 신청일부터 10일이 되는 날에 그 신청을 승인한 것으로 본다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "기한 만료일 10일 전까지 신청했는데 신청일부터 10일 이내에 승인 여부 통지가 없으면 신청일부터 10일 되는 날 승인한 것으로 본다. 모든 늦은 신청에 적용하는 간주 규정은 아니다.\n국세징수법 제13조 https://www.law.go.kr/법령/국세징수법/제13조"
    source: "2023년 세무사 1차 47번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 47번 ②"
    statement: "47. <국세징수법> 국세징수법령상 납부기한의 연장과 납부고지의 유예에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ②\n납세자가 도난으로 재산에 심한 손실을 입은 경우는 납부기한의 연장사유에 해당하나 「세무사법」에 따라 납세자의 장부 작성을 대행하는 세무사가 해당 납세자의 장부를 도난당한 경우는 해당하지 아니한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "납세자의 재산 도난뿐 아니라 장부 작성을 대행하는 세무사가 해당 장부를 도난당한 경우도 시행령의 납부기한 연장 사유에 포함된다.\n국세징수법 제13조 https://www.law.go.kr/법령/국세징수법/제13조\n국세징수법 시행령 제11조 https://www.law.go.kr/법령/국세징수법시행령/제11조"
    source: "2023년 세무사 1차 47번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 47번 ③"
    statement: "47. <국세징수법> 국세징수법령상 납부기한의 연장과 납부고지의 유예에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ③\n관할 세무서장은 납부고지의 유예를 신청받은 경우 납부고지 예정인 국세의 납부하여야 할 기한의 만료일까지 납세자에게 납부고지 유예의 승인 여부를 통지하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "납부고지 유예 신청의 승인 여부는 납부고지 예정 국세의 납부하여야 할 기한 만료일까지 통지하여야 한다.\n국세징수법 제14조 https://www.law.go.kr/법령/국세징수법/제14조"
    source: "2023년 세무사 1차 47번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 47번 ④"
    statement: "47. <국세징수법> 국세징수법령상 납부기한의 연장과 납부고지의 유예에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ④\n관할 세무서장은 납부기한의 연장을 하는 경우 그 연장과 관계되는 금액에 상당하는 납세담보의 제공을 요구할 수 있으나 납세자가 재난 또는 도난으로 재산에 심한 손실을 입은 경우에는 그러하지 아니하다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "담보 요구는 원칙적으로 가능하지만 재난·도난으로 재산에 심한 손실을 입은 경우는 시행령상 담보제공 예외이다.\n국세징수법 제13조 https://www.law.go.kr/법령/국세징수법/제13조\n국세징수법 제15조 https://www.law.go.kr/법령/국세징수법/제15조\n국세징수법 시행령 제16조 https://www.law.go.kr/법령/국세징수법시행령/제16조"
    source: "2023년 세무사 1차 47번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2023년 47번 ⑤"
    statement: "47. <국세징수법> 국세징수법령상 납부기한의 연장과 납부고지의 유예에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ⑤\n관할 세무서장은 납부고지의 유예를 한 후 해당 납세자인 법인의 해산으로 그 유예한 기한까지 유예와 관계되는 국세의 전액을 징수할 수 없다고 인정되는 경우 그 납부고지의 유예를 취소하고 유예와 관계되는 국세를 한꺼번에 징수할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법인 해산은 납부기한 전 징수 사유이다. 그 사유로 유예기한까지 전액 징수가 불가능하다고 인정되면 유예를 취소하고 한꺼번에 징수할 수 있다.\n국세징수법 제9조 https://www.law.go.kr/법령/국세징수법/제9조\n국세징수법 제16조 https://www.law.go.kr/법령/국세징수법/제16조"
    source: "2023년 세무사 1차 47번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2023","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 45번 ㄱ"
    statement: "45. <국세징수법> 국세징수법령상 납부고지, 독촉 등에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㄱ\n관할 세무서장은 납세자로부터 국세를 징수하려는 경우 납부고지를 하는 날부터 60일 이내의 범위로 납부하여야 할 기한을 적은 납부고지서를 납세자에게 발급하여야 한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "납부고지는 고지하는 날부터 30일 이내의 범위에서 납부기한을 정한다. 60일이 아니다.\n국세징수법 제6조 https://www.law.go.kr/법령/국세징수법/제6조"
    source: "2024년 세무사 1차 45번 ㄱ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 45번 ㄴ"
    statement: "45. <국세징수법> 국세징수법령상 납부고지, 독촉 등에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㄴ\n납부고지서의 송달이 지연되어 도달한 날부터 14일 이내에 지정납부기한이 도래하는 경우 당초의 지정납부기한의 마지막 날부터 14일이 지난 날을 새로운 지정납부기한으로 한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "송달 지연 시 새 기한은 “도달한 날부터 14일이 지난 날”이다. 당초 지정납부기한의 마지막 날을 기산점으로 삼지 않는다.\n국세징수법 제17조 https://www.law.go.kr/법령/국세징수법/제17조"
    source: "2024년 세무사 1차 45번 ㄴ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 45번 ㄷ"
    statement: "45. <국세징수법> 국세징수법령상 납부고지, 독촉 등에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㄷ\n관할 세무서장은 이미 납세의무가 확정된 국세를 납부기한 전에 징수하는 경우 당초의 납부기한보다 단축된 기한을 정하여 납세자에게 납부고지를 하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "납부기한 전 징수는 이미 납세의무가 확정된 국세가 대상이며, 당초 기한보다 단축한 기한을 정해 납부고지하여야 한다.\n국세징수법 제9조 https://www.law.go.kr/법령/국세징수법/제9조"
    source: "2024년 세무사 1차 45번 ㄷ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 45번 ㄹ"
    statement: "45. <국세징수법> 국세징수법령상 납부고지, 독촉 등에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㄹ\n관할 세무서장은 납세자가 국세를 지정납부기한까지 완납하지 아니하여 독촉장을 발급하는 경우, 독촉을 하는 날부터 20일 이내의 범위에서 기한을 정하여 발급한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "독촉장의 납부기한은 독촉하는 날부터 20일 이내의 범위에서 정한다. 지정납부기한 경과 후 10일 이내 독촉장을 발급한다는 별도 기한과 구별한다.\n국세징수법 제10조 https://www.law.go.kr/법령/국세징수법/제10조"
    source: "2024년 세무사 1차 45번 ㄹ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 45번 ㅁ"
    statement: "45. <국세징수법> 국세징수법령상 납부고지, 독촉 등에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㅁ\n관할 세무서장이 세액을 분할하여 납부고지하는 것은 납부고지의 유예에 포함된다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "납부고지 유예에는 세액을 분할하여 납부고지하는 경우도 포함된다. 이미 고지한 세액의 납부기한 연장과 구분한다.\n국세징수법 제14조 https://www.law.go.kr/법령/국세징수법/제14조"
    source: "2024년 세무사 1차 45번 ㅁ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 46번 ㄱ"
    statement: "46. <국세징수법> 국세징수법령상 압류에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㄱ\n관할 세무서장은 「특정 금융거래정보의 보고 및 이용 등에 관한 법률」에 따른 가상자산사업자 등 제3자가 보관하고 있는 체납자의 가상자산을 압류하려는 경우 그 제3자에게 대통령령으로 정하는 바에 따라 해당 가상자산의 이전을 문서로 요구할 수 있고, 체납자에게 통지할 필요는 없다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "제3자 보관 가상자산의 이전을 문서로 요구할 수 있지만 그 경우 체납자에게 그 사실을 통지하여야 한다. 제3자에 대한 요구만으로 통지를 생략할 수 없다.\n국세징수법 제55조 https://www.law.go.kr/법령/국세징수법/제55조\n국세징수법 시행령 제43조의2 https://www.law.go.kr/법령/국세징수법시행령/제43조의2"
    source: "2024년 세무사 1차 46번 ㄱ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 46번 ㄴ"
    statement: "46. <국세징수법> 국세징수법령상 압류에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㄴ\n압류 후 재산가격이 변동하여 체납액 전액을 현저히 초과한 경우는 압류를 즉시 해제하여야 하는 사유에 해당한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "재산가격 변동으로 체납액 전액을 현저히 초과한 때는 압류를 해제할 수 있는 재량적 사유이다. 즉시 해제하여야 하는 필요적 사유와 구별한다.\n국세징수법 제57조 https://www.law.go.kr/법령/국세징수법/제57조"
    source: "2024년 세무사 1차 46번 ㄴ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 46번 ㄷ"
    statement: "46. <국세징수법> 국세징수법령상 압류에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㄷ\n국세에 대하여 우선권을 가진 저당권자등이 세무서장으로부터 압류 통지를 받고 그 권리를 행사하려는 경우 통지를 받은 날부터 10일 이내에 그 사실을 세무서장에게 신고하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "우선권 있는 저당권자등은 압류 통지를 받고 권리를 행사하려면 통지받은 날부터 10일 이내에 세무서장에게 그 사실을 신고하여야 한다.\n국세징수법 제40조 https://www.law.go.kr/법령/국세징수법/제40조"
    source: "2024년 세무사 1차 46번 ㄷ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 46번 ㄹ"
    statement: "46. <국세징수법> 국세징수법령상 압류에 관한 설명으로 옳은 것을 모두 고른 것은?\n\n판단할 선지 ㄹ\n「부동산등기법」에 따라 등기된 부동산에 대한 압류의 효력은 해당 압류재산의 소유권이 이전되기 전에 「국세기본법」에 따른 법정기일이 도래한 국세의 체납액에 대해서도 미친다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "등기된 부동산 압류의 효력은 해당 압류재산의 소유권이 이전되기 전에 법정기일이 도래한 국세의 체납액에도 미친다. 단순히 압류 당시 체납액에만 한정되지 않는다.\n국세징수법 제46조 https://www.law.go.kr/법령/국세징수법/제46조"
    source: "2024년 세무사 1차 46번 ㄹ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 47번 ①"
    statement: "47. <국세징수법> 국세징수법령상 공매에 관한 설명으로 옳은 것은?\n\n판단할 선지 ①\n공매의 매수신청인은 문서로 매수신청을 해야 한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "공매 중 경쟁입찰은 문서로 신청하지만 경매는 구두 등의 방법으로 신청가격을 순차로 올리는 방식이다. 공매 전체를 문서 신청으로 한정한 문장이 틀렸다.\n국세징수법 제65조 https://www.law.go.kr/법령/국세징수법/제65조"
    source: "2024년 세무사 1차 47번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 47번 ②"
    statement: "47. <국세징수법> 국세징수법령상 공매에 관한 설명으로 옳은 것은?\n\n판단할 선지 ②\n세무공무원은 제3자의 계산으로 압류재산을 매수할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "세무공무원은 자기 또는 제3자의 명의나 계산으로 압류재산을 매수하지 못한다.\n국세징수법 제80조 https://www.law.go.kr/법령/국세징수법/제80조"
    source: "2024년 세무사 1차 47번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 47번 ③"
    statement: "47. <국세징수법> 국세징수법령상 공매에 관한 설명으로 옳은 것은?\n\n판단할 선지 ③\n공매재산에 설정된 모든 질권ㆍ저당권 및 가등기담보권은 매수인이 인수한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "공매재산에 설정된 모든 질권·저당권·가등기담보권은 매각으로 소멸한다. 매수인이 모두 인수하는 것이 아니다.\n국세징수법 제92조 https://www.law.go.kr/법령/국세징수법/제92조"
    source: "2024년 세무사 1차 47번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 47번 ④"
    statement: "47. <국세징수법> 국세징수법령상 공매에 관한 설명으로 옳은 것은?\n\n판단할 선지 ④\n관할 세무서장은 최고가 매수신청인이 다른 법령에 따라 갖추어야 하는 자격을 갖추지 못한 경우에는 매각결정기일을 1회에 한정하여 당초 매각결정기일부터 10일 이내의 범위에서 연기할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "매수 자격을 갖추지 못했으면 매각결정기일을 한 번만 당초 매각결정기일부터 10일 이내에서 연기할 수 있다.\n국세징수법 제84조 https://www.law.go.kr/법령/국세징수법/제84조"
    source: "2024년 세무사 1차 47번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 48번 ①"
    statement: "48. <국세징수법> 국세징수법령상 납세증명서 등 제도에 관한 설명으로 옳은 것은?\n\n판단할 선지 ①\n관할 세무서장은 지급명세서 등 금융거래에 관한 정보를 체납자의 재산조회와 강제징수를 위하여 사용할 수 없다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "세무서장은 지급명세서 등 금융거래 정보를 체납자의 재산조회와 강제징수를 위하여 사용할 수 있다.\n국세징수법 제111조 https://www.law.go.kr/법령/국세징수법/제111조"
    source: "2024년 세무사 1차 48번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 48번 ②"
    statement: "48. <국세징수법> 국세징수법령상 납세증명서 등 제도에 관한 설명으로 옳은 것은?\n\n판단할 선지 ②\n법원의 결정으로 감치에 처하여진 체납자는 동일한 체납 사실로 인하여 다시 감치될 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "감치에 처해진 체납자는 동일한 체납 사실로 다시 감치되지 않는다. 다른 체납 사실과 동일 사실을 구분한다.\n국세징수법 제115조 https://www.law.go.kr/법령/국세징수법/제115조"
    source: "2024년 세무사 1차 48번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 48번 ③"
    statement: "48. <국세징수법> 국세징수법령상 납세증명서 등 제도에 관한 설명으로 옳은 것은?\n\n판단할 선지 ③\n상가건물에 대해 보증금을 2천만원으로 하는 임대차계약을 체결한 임차인은 임대차 기간이 시작하는 날까지 임대인의 동의 없이 임대인의 미납국세 등의 열람을 관할 세무서장에게 신청할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "계약 체결 후 임대차 개시일까지 보증금이 1천만 원을 초과하는 임차인은 임대인 동의 없이 미납국세 등을 열람 신청할 수 있다. 2천만 원 계약은 금액 요건을 충족한다.\n국세징수법 제109조 https://www.law.go.kr/법령/국세징수법/제109조\n국세징수법 시행령 제97조 https://www.law.go.kr/법령/국세징수법시행령/제97조"
    source: "2024년 세무사 1차 48번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 48번 ④"
    statement: "48. <국세징수법> 국세징수법령상 납세증명서 등 제도에 관한 설명으로 옳은 것은?\n\n판단할 선지 ④\n관할 세무서장은 허가등을 받아 사업을 경영하는 자가 해당 사업과 관련된 부가가치세를 2회 체납했고 그 체납된 금액의 합계액이 2천만원인 경우 해당 주무관청에 사업의 정지 또는 허가등의 취소를 요구할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "사업 정지·허가 취소 요구는 관련 소득세·법인세·부가가치세를 3회 이상 체납하고 그 합계가 500만 원 이상인 경우이다. 2천만 원이어도 2회라면 횟수가 부족하다.\n국세징수법 제112조 https://www.law.go.kr/법령/국세징수법/제112조"
    source: "2024년 세무사 1차 48번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2024년 48번 ⑤"
    statement: "48. <국세징수법> 국세징수법령상 납세증명서 등 제도에 관한 설명으로 옳은 것은?\n\n판단할 선지 ⑤\n국세청장은 체납 발생일부터 1년이 지난 국세의 합계액이 1억원인 경우 체납자의 인적사항 및 체납액 등을 공개할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "명단공개의 금액 문턱은 체납 발생일부터 1년이 지난 국세 합계 2억 원 이상이다. 1억 원은 부족하다.\n국세징수법 제114조 https://www.law.go.kr/법령/국세징수법/제114조"
    source: "2024년 세무사 1차 48번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2024","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 45번 ①"
    statement: "45. <국세징수법> 국세징수법령상 세무공무원의 재산 압류의 효력에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ①\n체납자가 압류재산의 사용 또는 수익을 하는 경우 그 재산의 매각으로 인하여 권리를 이전하기 전까지 이미 거두어들인 천연과실에 대해서 압류의 효력이 미친다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "체납자나 제3자가 사용·수익하며 권리 이전 전 이미 거둔 천연과실에는 압류 효력이 미치지 않는다. 일반적인 과실 효력 확장의 예외이다.\n국세징수법 제44조 https://www.law.go.kr/법령/국세징수법/제44조"
    source: "2025년 세무사 1차 45번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 45번 ②"
    statement: "45. <국세징수법> 국세징수법령상 세무공무원의 재산 압류의 효력에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ②\n부동산에 대한 압류의 효력은 해당 압류재산의 소유권이 이전되기 전에 ｢국세기본법｣ 제35조에 따른 법정기일이 도래한 국세의 체납액에 대해서도 미친다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "부동산 압류 효력은 그 재산의 소유권 이전 전에 법정기일이 도래한 국세의 체납액에도 확장된다.\n국세징수법 제46조 https://www.law.go.kr/법령/국세징수법/제46조"
    source: "2025년 세무사 1차 45번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 45번 ③"
    statement: "45. <국세징수법> 국세징수법령상 세무공무원의 재산 압류의 효력에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ③\n세무공무원이 재산을 압류한 경우 체납자는 압류한 재산에 관하여 양도, 제한물권의 설정, 채권의 영수, 그 밖의 처분을 할 수 없다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "압류 후 체납자는 양도·제한물권 설정·채권 영수 등 압류재산의 처분을 할 수 없다.\n국세징수법 제43조 https://www.law.go.kr/법령/국세징수법/제43조"
    source: "2025년 세무사 1차 45번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 45번 ④"
    statement: "45. <국세징수법> 국세징수법령상 세무공무원의 재산 압류의 효력에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ④\n동산 또는 유가증권의 압류는 세무공무원이 점유함으로써 하고, 압류의 효력은 세무공무원이 점유한 때에 발생한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "동산·유가증권은 세무공무원의 점유로 압류하며 효력도 점유한 때 발생한다. 부동산 등기와 효력 발생 기준이 다르다.\n국세징수법 제48조 https://www.law.go.kr/법령/국세징수법/제48조"
    source: "2025년 세무사 1차 45번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 45번 ⑤"
    statement: "45. <국세징수법> 국세징수법령상 세무공무원의 재산 압류의 효력에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ⑤\n체납자가 ｢자본시장과 금융투자업에 관한 법률｣에 따른 예탁자인 경우 예탁유가증권 지분에 대한 압류의 효력은 그 압류 통지서가 예탁결제원에 송달된 때에 발생한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "체납자가 예탁자이면 예탁결제원에 압류 통지서가 송달된 때 효력이 발생한다. 체납자가 투자자인 경우의 송달 대상은 예탁자이다.\n국세징수법 제56조의2 https://www.law.go.kr/법령/국세징수법/제56조의2"
    source: "2025년 세무사 1차 45번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 46번 ①"
    statement: "46. <국세징수법> 국세징수법령상 교부청구 및 참가압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ①\n체납자에 대하여 ｢민사집행법｣에 따른 강제집행 및 담보권 실행 등을 위한 경매가 시작된 경우 관할 세무서장은 집행법원, 집행공무원 등에 대하여 그 집행절차의 배당ㆍ배분 요구의 종기(終期)까지 체납액의 교부를 청구하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법원의 강제집행·담보권 실행 경매 등이 시작되면 집행절차의 배당·배분 요구 종기까지 체납액 교부를 청구하여야 한다.\n국세징수법 제59조 https://www.law.go.kr/법령/국세징수법/제59조"
    source: "2025년 세무사 1차 46번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 46번 ②"
    statement: "46. <국세징수법> 국세징수법령상 교부청구 및 참가압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ②\n관할 세무서장은 납부나 그 밖의 사유로 교부를 청구한 체납액의 납부의무가 소멸된 경우 그 교부청구를 해제하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "납부 등으로 교부청구한 체납액의 납부의무가 소멸되면 교부청구를 해제하여야 한다.\n국세징수법 제60조 https://www.law.go.kr/법령/국세징수법/제60조"
    source: "2025년 세무사 1차 46번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 46번 ③"
    statement: "46. <국세징수법> 국세징수법령상 교부청구 및 참가압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ③\n관할 세무서장은 압류하려는 재산이 이미 다른 기관에 압류되어 있는 경우 참가압류 통지서를 그 재산을 이미 압류한 기관에 송달함으로써 교부청구를 갈음하고 그 압류에 참가할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "이미 다른 기관이 압류한 재산이면 그 기관에 참가압류 통지서를 송달하여 교부청구를 갈음하고 압류에 참가할 수 있다. 등기·등록 재산은 참가압류의 등기·등록도 촉탁한다.\n국세징수법 제61조 https://www.law.go.kr/법령/국세징수법/제61조"
    source: "2025년 세무사 1차 46번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 46번 ④"
    statement: "46. <국세징수법> 국세징수법령상 교부청구 및 참가압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ④\n참가압류를 한 후에 선행압류기관이 권리의 변동에 등기가 필요한 재산에 대한 압류를 해제한 경우 그 참가압류는 압류통지서가 선행압류기관에 송달된 때 압류의 효력을 갖는다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "등기·등록이 필요한 재산은 참가압류의 등기·등록 완료 시점으로 소급한다. 선행기관 통지서 송달 시점은 등기·등록이 필요 없는 재산에 적용한다.\n국세징수법 제62조 https://www.law.go.kr/법령/국세징수법/제62조"
    source: "2025년 세무사 1차 46번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 46번 ⑤"
    statement: "46. <국세징수법> 국세징수법령상 교부청구 및 참가압류에 관한 설명으로 옳지 않은 것은?\n\n판단할 선지 ⑤\n참가압류를 한 후에 선행압류기관이 동산에 대한 압류를 해제한 경우로서 그 동산을 제3자가 보관하고 있는 경우 선행압류기관은 제3자가 발행한 해당 보관증을 참가압류를 한 관할 세무서장에게 인도함으로써 재산을 직접 인도하는 것에 갈음할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "선행기관이 압류 해제한 동산을 제3자가 보관한다면 그 제3자가 발행한 보관증 인도로 직접 재산 인도를 갈음할 수 있다.\n국세징수법 제62조 https://www.law.go.kr/법령/국세징수법/제62조"
    source: "2025년 세무사 1차 46번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 47번 ①"
    statement: "47. <국세징수법> 국세징수법령상 관할 세무서장이 납부기한 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있는 경우로 옳지 않은 것은?\n각 선지가 “이미 납세의무가 확정된 국세를 납부기한 전에 징수할 수 있는 사유”에 해당하는지를 판단한다.\n\n판단할 선지 ①\n국세, 지방세 또는 공과금의 체납으로 강제징수 또는 체납처분이 시작된 경우"
    choices: ["O","X","?"]
    answer: "O"
    rationale: "국세·지방세·공과금의 체납으로 강제징수 또는 체납처분이 시작되면 이미 확정된 국세를 기한 전에 징수할 수 있다.\n국세징수법 제9조 https://www.law.go.kr/법령/국세징수법/제9조"
    source: "2025년 세무사 1차 47번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 47번 ②"
    statement: "47. <국세징수법> 국세징수법령상 관할 세무서장이 납부기한 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있는 경우로 옳지 않은 것은?\n각 선지가 “이미 납세의무가 확정된 국세를 납부기한 전에 징수할 수 있는 사유”에 해당하는지를 판단한다.\n\n판단할 선지 ②\n｢민사집행법｣에 따른 강제집행 및 담보권 실행 등을 위한 경매가 시작된 경우"
    choices: ["O","X","?"]
    answer: "O"
    rationale: "민사집행법상 강제집행·담보권 실행 경매가 시작된 경우는 납부기한 전 징수 사유이다.\n국세징수법 제9조 https://www.law.go.kr/법령/국세징수법/제9조"
    source: "2025년 세무사 1차 47번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 47번 ③"
    statement: "47. <국세징수법> 국세징수법령상 관할 세무서장이 납부기한 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있는 경우로 옳지 않은 것은?\n각 선지가 “이미 납세의무가 확정된 국세를 납부기한 전에 징수할 수 있는 사유”에 해당하는지를 판단한다.\n\n판단할 선지 ③\n국세를 포탈(逋脫)하려는 행위가 있다고 인정되는 경우"
    choices: ["O","X","?"]
    answer: "O"
    rationale: "국세 포탈 행위가 있다고 인정되는 경우는 납부기한 전 징수 사유이다.\n국세징수법 제9조 https://www.law.go.kr/법령/국세징수법/제9조"
    source: "2025년 세무사 1차 47번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 47번 ④"
    statement: "47. <국세징수법> 국세징수법령상 관할 세무서장이 납부기한 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있는 경우로 옳지 않은 것은?\n각 선지가 “이미 납세의무가 확정된 국세를 납부기한 전에 징수할 수 있는 사유”에 해당하는지를 판단한다.\n\n판단할 선지 ④\n납세관리인을 정하지 아니하고 국내에 주소 또는 거소를 두지 아니하게 된 경우"
    choices: ["O","X","?"]
    answer: "O"
    rationale: "납세관리인을 정하지 않고 국내 주소·거소를 두지 않게 된 경우는 납부기한 전 징수 사유이다.\n국세징수법 제9조 https://www.law.go.kr/법령/국세징수법/제9조"
    source: "2025년 세무사 1차 47번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 47번 ⑤"
    statement: "47. <국세징수법> 국세징수법령상 관할 세무서장이 납부기한 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있는 경우로 옳지 않은 것은?\n각 선지가 “이미 납세의무가 확정된 국세를 납부기한 전에 징수할 수 있는 사유”에 해당하는지를 판단한다.\n\n판단할 선지 ⑤\n납세자가 경영하는 사업에 현저한 손실이 발생하거나 부도의 우려가 있는 경우"
    choices: ["O","X","?"]
    answer: "X"
    rationale: "사업의 현저한 손실·부도 우려는 납부기한 연장 사유이다. 그것만으로 제9조의 납부기한 전 징수 사유가 되지는 않는다.\n국세징수법 제9조 https://www.law.go.kr/법령/국세징수법/제9조\n국세징수법 제13조 https://www.law.go.kr/법령/국세징수법/제13조"
    source: "2025년 세무사 1차 47번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 48번 ①"
    statement: "48. <국세징수법> 국세징수법령상 관할 세무서장의 강제징수 권한에 관한 설명으로 옳은 것은?\n\n판단할 선지 ①\n관할 세무서장은 납세자가 국세의 징수를 피하기 위하여 한 재산의 처분에 대하여 사해행위(詐害行爲)의 취소 및 원상회복을 위한 자력집행(自力執行)을 할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "사해행위 취소·원상회복은 민법 제406조·제407조를 준용하여 법원에 청구하여야 한다. 세무서장이 자체적으로 취소·원상회복하는 자력집행 권한은 아니다.\n국세징수법 제25조 https://www.law.go.kr/법령/국세징수법/제25조"
    source: "2025년 세무사 1차 48번 ① · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 48번 ②"
    statement: "48. <국세징수법> 국세징수법령상 관할 세무서장의 강제징수 권한에 관한 설명으로 옳은 것은?\n\n판단할 선지 ②\n관할 세무서장이 압류한 재산에 대한 제3자의 소유권 주장 및 반환청구가 부당하다는 뜻을 통지한 후, 그 통지를 받은 제3자가 체납자를 상대로 소유권에 관한 소송을 제기하여 승소 판결을 받고 그 사실을 증명한 경우 관할 세무서장은 압류를 즉시 해제하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "부당하다는 통지를 받은 제3자가 체납자를 상대로 소유권 소송에서 승소하고 이를 증명하면 세무서장은 압류를 즉시 해제하여야 한다.\n국세징수법 제28조 https://www.law.go.kr/법령/국세징수법/제28조"
    source: "2025년 세무사 1차 48번 ② · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 48번 ③"
    statement: "48. <국세징수법> 국세징수법령상 관할 세무서장의 강제징수 권한에 관한 설명으로 옳은 것은?\n\n판단할 선지 ③\n관할 세무서장은 재판상의 가압류 또는 가처분 재산이 강제징수 대상인 경우에는 ｢국세징수법｣에 따른 강제징수를 할 수 없다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "재판상 가압류·가처분이 있더라도 국세징수법에 따른 강제징수를 한다.\n국세징수법 제26조 https://www.law.go.kr/법령/국세징수법/제26조"
    source: "2025년 세무사 1차 48번 ③ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 48번 ④"
    statement: "48. <국세징수법> 국세징수법령상 관할 세무서장의 강제징수 권한에 관한 설명으로 옳은 것은?\n\n판단할 선지 ④\n체납자의 재산에 대하여 강제징수를 시작한 후 체납자인 법인이 합병으로 소멸된 경우에는 그 재산에 대한 강제징수는 중단하여야 한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "강제징수 시작 후 체납법인이 합병으로 소멸하여도 해당 재산의 강제징수는 계속 진행하여야 한다.\n국세징수법 제27조 https://www.law.go.kr/법령/국세징수법/제27조"
    source: "2025년 세무사 1차 48번 ④ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세징수법 · 2025년 48번 ⑤"
    statement: "48. <국세징수법> 국세징수법령상 관할 세무서장의 강제징수 권한에 관한 설명으로 옳은 것은?\n\n판단할 선지 ⑤\n관할 세무서장은 체납 발생일부터 1년이 지난 국세의 합계액이 1억원 이상인 경우 체납자의 수입물품에 대한 강제징수를 세관장에게 위탁할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "세관장 위탁 문턱은 체납 발생일부터 1년 지난 국세 합계 2억 원 이상이다. 선지의 1억 원 이상이 틀렸다.\n국세징수법 제30조 https://www.law.go.kr/법령/국세징수법/제30조"
    source: "2025년 세무사 1차 48번 ⑤ · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["국세징수법","기출","2025","선지별OX"]
