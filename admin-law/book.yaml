    trap: "제21조는 허가결정에 즉시항고, 제14조제1항의 피고경정은 신청을 각하한 결정에 즉시항고라는 차이도 비교해 두세요."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part04.html#u04"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","4장"]
