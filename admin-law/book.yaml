  - type: "ox"
    subject: "행정소송법"
    unit: "4장 · 관할과 이송: 알맞은 법원 찾기"
    statement: "취소소송의 제1심 관할법원은 원칙적으로 피고 소재지를 관할하는 행정법원이다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제9조제1항의 원칙입니다. 제2항·제3항과 특별법의 추가 규정은 별도로 확인합니다.\n근거: 행정소송법 제7조 · 행정소송법 제7조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0007&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제9조 · 행정소송법 제9조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0009&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제10조 · 행정소송법 제10조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0010&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제5조 · 행정소송규칙 제5조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0005&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "제1심 관할법원과 상급심을 혼동하지 않습니다. 또한 소송이 계속 중이라는 말은 그 법원에서 사건 절차가 진행 중이라는 뜻입니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part04.html#u01"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","4장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "4장 · 관할과 이송: 알맞은 법원 찾기"
    statement: "토지 수용에 관한 취소소송은 부동산 소재지 관할 행정법원에 제기할 수 없다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "법 제9조제3항은 그 부동산 또는 장소의 소재지를 관할하는 행정법원에도 제기할 수 있도록 합니다.\n근거: 행정소송법 제7조 · 행정소송법 제7조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0007&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제9조 · 행정소송법 제9조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0009&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제10조 · 행정소송법 제10조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0010&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제5조 · 행정소송규칙 제5조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0005&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "제1심 관할법원과 상급심을 혼동하지 않습니다. 또한 소송이 계속 중이라는 말은 그 법원에서 사건 절차가 진행 중이라는 뜻입니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part04.html#u01"
