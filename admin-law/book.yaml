  - type: "ox"
    subject: "행정소송법"
    unit: "8장 · 부작위위법확인: 대답해야 하는데 침묵할 때"
    statement: "부작위위법확인소송은 처분 신청을 한 사람 중 확인을 구할 법률상 이익이 있는 사람만 제기할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제36조의 원고적격 요건입니다.\n근거: 행정소송법 제2조 · 제1항제2호: 부작위의 정의 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제36조 · 신청인과 법률상 이익 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0036&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제38조 · 제2항: 부작위위법확인의 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0038&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제17조 · 소송 중 뒤늦게 처분한 경우의 각하와 비용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0017&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제18조 · 제2항: 부작위위법확인의 규칙 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0018&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "법 제38조의 준용표와 실제 기간 계산을 구별하세요. 조문에 제20조가 있다는 이유만으로 지속 중인 침묵에 임의의 처분일을 만들어 90일을 세면 안 됩니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part08.html#u02"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","8장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "8장 · 부작위위법확인: 대답해야 하는데 침묵할 때"
    statement: "명시적인 거부처분을 받았어도 신청인이 원하는 허가가 없으면 언제나 부작위에 해당한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "거부도 처분입니다. 응답하지 않는 부작위와 거부처분의 위법은 구별해야 합니다.\n근거: 행정소송법 제2조 · 제1항제2호: 부작위의 정의 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제36조 · 신청인과 법률상 이익 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0036&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제38조 · 제2항: 부작위위법확인의 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0038&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제17조 · 소송 중 뒤늦게 처분한 경우의 각하와 비용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0017&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제18조 · 제2항: 부작위위법확인의 규칙 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0018&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "법 제38조의 준용표와 실제 기간 계산을 구별하세요. 조문에 제20조가 있다는 이유만으로 지속 중인 침묵에 임의의 처분일을 만들어 90일을 세면 안 됩니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part08.html#u02"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","8장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "8장 · 당사자소송: 공법상 돈과 지위를 직접 다투기"
    statement: "당사자소송의 피고는 원칙적으로 국가·공공단체 그 밖의 권리주체이다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제39조의 규정입니다. 처분청을 피고로 하는 취소소송과 구별합니다.\n근거: 행정소송법 제39조 · 국가·공공단체 등 권리주체가 피고 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제40조 · 관할과 관계 행정청 소재지 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0040&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제41조 · 법령에 정한 제소기간의 불변기간성 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0041&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제42조 · 항고소송으로의 변경 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0042&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제44조 · 당사자소송의 준용 목록 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0044&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제19조 · 손실보상·확정된 공법상 권리·공법상 계약 등 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0019&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제20조 · 당사자소송에 준용하는 규칙 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0020&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "‘세금과 관련 = 모두 항고소송’, ‘국가에 돈 청구 = 모두 당사자소송’이라는 공식은 모두 위험합니다. 환급청구의 법적 근거와 권리 확정 구조를 살펴보세요."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part08.html#u03"
    referenceYear: 2026
