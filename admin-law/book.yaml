    subject: "행정소송법"
    unit: "4장 · 소의 변경: 소송 중 길을 고칠 때"
    statement: "제22조의 처분변경에 따른 청구 변경 신청은 처분 변경이 있음을 안 날부터 90일 이내에 해야 한다."
