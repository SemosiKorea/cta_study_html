    choices: ["O","X","?"]
    answer: "X"
    rationale: "제38조제1항의 무효등확인 준용 목록에는 제34조가 없습니다. 부작위위법확인에는 준용됩니다.\n근거: 행정소송법 제34조 · 제1심 수소법원의 간접강제 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0034&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제38조 · 제2항: 부작위위법확인소송에 제34조 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0038&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제33조 · 간접강제에 준용되는 재판 효력 규정 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0033&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "‘제1심·신청·재처분’ 세 말을 함께 기억하세요. 간접강제를 행정청에 대한 모든 판결의 보편적인 집행방법으로 넓히지 않습니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part07.html#u03"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","7장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "7장 · 제3자의 재심과 소송비용"
    statement: "제3자 재심은 확정판결이 있음을 안 날부터 30일 이내이면서 판결 확정일부터 1년 이내에 제기해야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제31조제2항·제3항의 두 불변기간을 모두 지켜야 합니다. 국외 특례는 별도입니다.\n근거: 행정소송법 제31조 · 제3자 재심의 요건·기간 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0031&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제5조 · 국외에서의 재심청구 기간 특례 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0005&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제32조 · 특정 경우의 피고 비용 부담 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0032&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제33조 · 소송비용 재판의 국가·공공단체에 대한 효력 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0033&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "제3자 재심의 30일은 처분을 안 날이 아니라 ‘확정판결이 있음을 안 날’부터입니다. 취소소송 제소기간 90일과 바꾸어 외우지 마세요."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part07.html#u04"
