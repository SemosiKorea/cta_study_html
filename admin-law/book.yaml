    rationale: "법 제16조제2항의 의견 청취 의무입니다.\n근거: 행정소송법 제15조 · 행정소송법 제15조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0015&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제16조 · 행정소송법 제16조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0016&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제17조 · 행정소송법 제17조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0017&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제7조 · 행정소송규칙 제7조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0007&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "“미리 의견을 들어야 한다”를 “반드시 동의를 받아야 한다”로 바꾸지 않습니다. 의견 청취와 동의는 다른 요건입니다."
