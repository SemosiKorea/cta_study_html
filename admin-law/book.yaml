    subject: "행정소송법"
    unit: "8장 · 무효등확인: 그 처분은 효력이 있나요"
    statement: "취소소송 제소기간이 지나면 단순 취소사유도 당연히 무효사유가 된다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "기간 경과는 하자의 성질을 바꾸지 않습니다. 무효 여부는 별도의 실체적 기준으로 판단합니다.\n근거: 행정소송법 제35조 · 법률상 이익과 무효등확인의 원고적격 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0035&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제37조 · 취소소송·당사자소송으로의 변경 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0037&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제38조 · 제1항: 무효등확인에 준용하는 규정 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0038&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제16조 · 기간 내 무효확인소송에서 취소 청구 여부 석명 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0016&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제18조 · 제1항: 무효등확인의 규칙 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0018&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "제소기간 없음과 언제나 승소는 다릅니다. 확인의 법률상 이익, 무효사유의 주장·증명 등은 여전히 필요합니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part08.html#u01"
    referenceYear: 2026
