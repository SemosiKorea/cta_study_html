    subject: "행정소송법"
    unit: "4장 · 행정심판: 반드시 거쳐야 하는 경유지일까"
    statement: "취소소송은 법령상 행정심판을 청구할 수 있는 경우에도 원칙적으로 이를 거치지 않고 제기할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제18조제1항 본문입니다. 다른 법률이 필요적 전심절차를 정한 경우는 단서에 따라 별도로 봅니다.\n근거: 행정소송법 제18조 · 행정소송법 제18조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0018&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "“심판을 청구할 수 있다”와 “심판의 재결을 거쳐야 한다”는 강도가 다릅니다."
