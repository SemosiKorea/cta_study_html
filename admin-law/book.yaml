    rationale: "법 제12조 후단은 기간 경과·집행 등으로 효과가 소멸한 경우에도 이를 인정합니다.\n근거: 행정소송법 제12조 · 제12조 후단 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0012&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
