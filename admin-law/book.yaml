  - type: "ox"
    subject: "행정소송법"
    unit: "7장 · 제3자의 재심과 소송비용"
    statement: "사정판결로 원고의 청구가 기각되면 소송비용은 법 제32조에 따라 원고가 부담한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "제32조는 이 경우 소송비용을 피고의 부담으로 정합니다.\n근거: 행정소송법 제31조 · 제3자 재심의 요건·기간 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0031&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제5조 · 국외에서의 재심청구 기간 특례 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0005&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제32조 · 특정 경우의 피고 비용 부담 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0032&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제33조 · 소송비용 재판의 국가·공공단체에 대한 효력 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0033&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "제3자 재심의 30일은 처분을 안 날이 아니라 ‘확정판결이 있음을 안 날’부터입니다. 취소소송 제소기간 90일과 바꾸어 외우지 마세요."
