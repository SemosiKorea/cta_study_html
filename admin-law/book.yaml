  - type: "ox"
    subject: "행정소송법"
    unit: "8장 · 당사자소송: 공법상 돈과 지위를 직접 다투기"
    statement: "2026년 11월 기준으로 국가 상대 당사자소송의 가집행선고를 금지하는 행정소송법 제43조가 그대로 시행 중이다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "그 조항은 2022년 위헌결정을 거쳐 2026년 5월 12일 삭제됐습니다. 옛 기출의 법 상태와 현재를 구별해야 합니다.\n근거: 행정소송법 제39조 · 국가·공공단체 등 권리주체가 피고 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제40조 · 관할과 관계 행정청 소재지 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0040&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제41조 · 법령에 정한 제소기간의 불변기간성 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0041&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제42조 · 항고소송으로의 변경 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0042&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제44조 · 당사자소송의 준용 목록 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0044&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제19조 · 손실보상·확정된 공법상 권리·공법상 계약 등 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0019&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제20조 · 당사자소송에 준용하는 규칙 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0020&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "‘세금과 관련 = 모두 항고소송’, ‘국가에 돈 청구 = 모두 당사자소송’이라는 공식은 모두 위험합니다. 환급청구의 법적 근거와 권리 확정 구조를 살펴보세요."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part08.html#u03"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","8장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "8장 · 민중소송과 기관소송: 법이 열어 준 특별한 문"
    statement: "민중소송과 기관소송은 법률이 정한 경우에 법률이 정한 자만 제기할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제45조의 법정주의입니다.\n근거: 행정소송법 제3조 · 민중소송·기관소송의 정의와 헌법재판소 관장사항 제외 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0003&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제45조 · 법률이 정한 경우에 법률이 정한 자만 제기 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0045&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제46조 · 구하는 내용에 따른 취소·확인·당사자소송 규정 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "감사원의 모든 행위가 소송 대상이 아니라고 일반화하지 마세요. 아래 판례는 특정 징계요구와 재심의결정의 처분성, 기관소송 근거의 유무에 관한 판단입니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part08.html#u04"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","8장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "8장 · 민중소송과 기관소송: 법이 열어 준 특별한 문"
    statement: "기관 사이의 분쟁이라면 개별 법률의 근거 없이도 행정소송법 제45조만으로 기관소송을 제기할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "제45조는 모든 기관 분쟁을 허용하는 포괄적 제소권 규정이 아닙니다. 개별 법률상 허용이 필요합니다.\n근거: 행정소송법 제3조 · 민중소송·기관소송의 정의와 헌법재판소 관장사항 제외 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0003&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제45조 · 법률이 정한 경우에 법률이 정한 자만 제기 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0045&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제46조 · 구하는 내용에 따른 취소·확인·당사자소송 규정 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "감사원의 모든 행위가 소송 대상이 아니라고 일반화하지 마세요. 아래 판례는 특정 징계요구와 재심의결정의 처분성, 기관소송 근거의 유무에 관한 판단입니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part08.html#u04"
