    unit: "4장 · 소의 변경: 소송 중 길을 고칠 때"
    statement: "제21조의 소의 변경은 청구의 기초에 변경이 없는 한 사실심 변론종결시까지 원고의 신청으로 허가할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제21조제1항의 요건입니다. 법원이 변경을 상당하다고 인정해야 합니다.\n근거: 행정소송법 제21조 · 행정소송법 제21조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0021&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제22조 · 행정소송법 제22조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0022&lsiSeq=285913&urlMode=lsScJoRltInfoR"
