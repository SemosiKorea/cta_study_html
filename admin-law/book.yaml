    statement: "처분의 효력 유무가 민사소송의 선결문제가 된 경우 수소법원은 처분청에 그 사실을 통지하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제11조제2항은 통지 의무를 규정합니다.\n근거: 행정소송법 제11조 · 행정소송법 제11조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0011&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제17조 · 행정소송법 제17조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0017&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제25조 · 행정소송법 제25조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0025&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제26조 · 행정소송법 제26조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0026&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제33조 · 행정소송법 제33조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0033&lsiSeq=285913&urlMode=lsScJoRltInfoR"
