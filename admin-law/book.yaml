    statement: "행정심판을 거친 경우 제20조제1항 단서의 90일은 항상 재결이 있은 날부터 시작한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "해당 단서의 기산점은 재결서 정본을 송달받은 날입니다. 재결일은 제2항 단서의 1년과 구별합니다.\n근거: 행정소송법 제20조 · 행정소송법 제20조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0020&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제5조 · 행정소송법 제5조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0005&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "“안 날”을 “있은 날”로, “재결서 정본 송달일”을 “재결일”로 바꾼 선지가 자주 함정이 됩니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part04.html#u03"
