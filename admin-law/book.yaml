    subject: "행정소송법"
    unit: "4장 · 제소기간: 서로 다른 두 시계를 함께 보기"
    statement: "법 제20조제1항의 90일은 불변기간이다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "제20조제3항은 제1항의 기간을 불변기간으로 정합니다.\n근거: 행정소송법 제20조 · 행정소송법 제20조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0020&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제5조 · 행정소송법 제5조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0005&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
