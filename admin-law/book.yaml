    subject: "행정소송법"
    unit: "3장 · 피고와 피고경정: 답해야 할 상대를 정확히"
    statement: "피고를 잘못 지정하여 경정이 허가되면 새 피고에 대한 제소일은 항상 경정결정일이다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "법 제14조제4항에 따라 처음 소를 제기한 때에 제기된 것으로 봅니다.\n근거: 행정소송법 제13조 · 행정소송법 제13조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0013&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제14조 · 행정소송법 제14조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0014&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제6조 · 행정소송규칙 제6조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0006&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "“피고경정”이라는 말만 보고 신청과 직권을 한 가지로 외우지 마세요. 어떤 이유로 피고를 고치는지 먼저 봅니다."
