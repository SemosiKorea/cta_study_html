    unit: "3장 · 소송참가: 결과에 영향을 받는 사람도 듣기"
    statement: "법원이 제3자를 참가시키는 결정을 하려면 미리 당사자와 제3자의 의견을 들어야 한다."
    choices: ["O","X","?"]
