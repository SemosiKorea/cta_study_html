    rationale: "관할과 신청 요건이 제34조제1항에 명시되어 있습니다.\n근거: 행정소송법 제34조 · 제1심 수소법원의 간접강제 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0034&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제38조 · 제2항: 부작위위법확인소송에 제34조 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0038&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제33조 · 간접강제에 준용되는 재판 효력 규정 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0033&lsiSeq=285913&urlMode=lsScJoRltInfoR"
