    unit: "3장 · 소의 이익: 기간이 끝나도 해결할 일이 남았을까"
    statement: "처분의 집행이 끝난 뒤에도 취소로 회복되는 법률상 이익이 있으면 취소소송을 제기할 수 있다."
    choices: ["O","X","?"]
