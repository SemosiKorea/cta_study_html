    correction: ""
    trap: "법 제12조의 전단과 후단을 같은 질문으로 외우지 마세요. 사람의 자격과 판결의 현재 필요를 나누어 생각합니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part03.html#u02"
    referenceYear: 2026
