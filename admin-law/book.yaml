schema: hoedok.cards/v1
cards:
  - type: "ox"
    subject: "행정소송법"
    unit: "1장 · 행정소송은 행정의 결정을 점검하는 법원의 절차"
    statement: "행정소송법상 행정청에는 법령에 따라 행정권한을 위탁받은 사인이 포함될 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제2조제2항은 위임·위탁받은 행정기관, 공공단체와 그 기관, 사인을 포함합니다.\n근거: 행정소송법 제1조 · 행정소송법 제1조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0001&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제2조 · 제2조제2항 · 행정청의 범위 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "행정청과 계약했다는 사정만으로 항고소송이라고 고르지 않습니다. 행위의 공법적 성질과 원하는 해결을 함께 봅니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part01.html#u01"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","1장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "1장 · 행정소송은 행정의 결정을 점검하는 법원의 절차"
    statement: "행정소송법의 목적은 위법한 처분의 취소에만 한정된다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "법 제1조는 공권력 행사·불행사로 인한 권리·이익의 구제와 공법상 권리관계 또는 법적용에 관한 다툼의 해결도 정합니다.\n근거: 행정소송법 제1조 · 행정소송법 제1조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0001&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제2조 · 제2조제2항 · 행정청의 범위 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "행정청과 계약했다는 사정만으로 항고소송이라고 고르지 않습니다. 행위의 공법적 성질과 원하는 해결을 함께 봅니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part01.html#u01"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","1장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "1장 · 네 가지 소송, 네 가지 질문"
    statement: "당사자소송은 그 법률관계의 한쪽 당사자를 피고로 하는 소송이다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제3조제2호의 정의입니다. 처분청이 언제나 피고인 것은 아닙니다.\n근거: 행정소송법 제3조 · 행정소송법 제3조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0003&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제45조 · 행정소송법 제45조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0045&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "민중소송의 “자기 이익과 관계없음”을 “모든 국민이 언제나 가능”으로 바꾸면 틀립니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part01.html#u02"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","1장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "1장 · 네 가지 소송, 네 가지 질문"
    statement: "민중소송은 공익을 위한 것이므로 법률에 근거가 없어도 제기할 수 있다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "법 제45조에 따라 법률이 정한 경우에 법률이 정한 자만 제기할 수 있습니다.\n근거: 행정소송법 제3조 · 행정소송법 제3조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0003&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제45조 · 행정소송법 제45조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0045&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "민중소송의 “자기 이익과 관계없음”을 “모든 국민이 언제나 가능”으로 바꾸면 틀립니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part01.html#u02"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","1장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "1장 · 항고소송의 세 갈래와 판결의 세 가지 결론"
    statement: "부작위위법확인소송은 행정청의 부작위가 위법하다는 확인을 구하는 소송이다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제4조제3호의 정의입니다. 법원이 곧바로 원하는 허가를 내준다는 뜻은 아닙니다.\n근거: 행정소송법 제4조 · 행정소송법 제4조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0004&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제12조 · 행정소송법 제12조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0012&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제20조 · 행정소송법 제20조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0020&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "“패소”라는 말 하나로 각하와 기각을 섞지 마세요. 사정판결처럼 위법하지만 기각되는 특별한 경우는 뒤에서 따로 구별합니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part01.html#u03"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","1장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "1장 · 항고소송의 세 갈래와 판결의 세 가지 결론"
    statement: "무효등확인소송은 처분의 존재 여부를 확인하는 경우를 포함하지 않는다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "법 제4조제2호는 효력 유무뿐 아니라 존재 여부도 포함합니다.\n근거: 행정소송법 제4조 · 행정소송법 제4조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0004&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제12조 · 행정소송법 제12조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0012&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제20조 · 행정소송법 제20조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0020&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "“패소”라는 말 하나로 각하와 기각을 섞지 마세요. 사정판결처럼 위법하지만 기각되는 특별한 경우는 뒤에서 따로 구별합니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part01.html#u03"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","1장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "1장 · 법률·규칙·판례를 읽는 순서"
    statement: "행정소송법에 특별한 규정이 없는 사항에는 법원조직법·민사소송법·민사집행법의 규정을 준용한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제8조제2항에 열거된 세 법률입니다.\n근거: 행정소송법 제8조 · 행정소송법 제8조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0008&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제6조 · 행정소송법 제6조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0006&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제1조 · 행정소송규칙 제1조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0001&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제2조 · 행정소송규칙 제2조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제4조 · 행정소송규칙 제4조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0004&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "대법원규칙인 행정소송규칙과 행정청 내부 업무지침인 행정규칙을 같은 말로 생각하지 않습니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part01.html#u04"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","1장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "1장 · 법률·규칙·판례를 읽는 순서"
    statement: "행정소송에 관한 대법원판결로 명령·규칙의 위헌·위법이 확정되면 법 제6조상 관보 게재의 주체는 대법원이다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "대법원은 행정안전부장관에게 통보하고, 그 통보를 받은 장관이 지체 없이 관보에 게재합니다.\n근거: 행정소송법 제8조 · 행정소송법 제8조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0008&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제6조 · 행정소송법 제6조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0006&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송규칙 제1조 · 행정소송규칙 제1조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0001&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제2조 · 행정소송규칙 제2조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송규칙 제4조 · 행정소송규칙 제4조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0004&lsiSeq=260689&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "대법원규칙인 행정소송규칙과 행정청 내부 업무지침인 행정규칙을 같은 말로 생각하지 않습니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part01.html#u04"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","1장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "2장 · 처분성: 이름보다 법적 효과를 보기"
    statement: "행정소송법상 “처분등”에는 행정심판에 대한 재결도 포함된다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제2조제1항제1호는 처분 및 행정심판에 대한 재결을 포함합니다. 재결취소소송의 허용 범위는 법 제19조에서 별도로 제한됩니다.\n근거: 행정소송법 제2조 · 제2조제1항제1호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제19조 · 행정소송법 제19조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0019&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "처분성이 부정된다고 그 행위가 언제나 적법하다는 뜻은 아닙니다. 그 행위를 해당 항고소송의 대상으로 삼을 수 있는지의 문제입니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part02.html#u01"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","2장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "2장 · 처분성: 이름보다 법적 효과를 보기"
    statement: "행정청의 모든 내부 검토·요청은 행정청이 한 일이므로 곧바로 취소소송의 대상이 된다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "법 제2조·제19조상 처분등인지 판단해야 합니다. 2014두5637 사건의 징계요구처럼 내부 중간 단계로 처분성이 부정되는 경우가 있습니다.\n근거: 행정소송법 제2조 · 제2조제1항제1호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제19조 · 행정소송법 제19조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0019&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "처분성이 부정된다고 그 행위가 언제나 적법하다는 뜻은 아닙니다. 그 행위를 해당 항고소송의 대상으로 삼을 수 있는지의 문제입니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part02.html#u01"
    referenceYear: 2026
    tags: ["행정소송법","첫학습","조문회독","2장"]
  - type: "ox"
    subject: "행정소송법"
    unit: "2장 · 거부와 부작위: “안 됩니다”와 “아무 답도 없음”"
    statement: "부작위가 되려면 당사자의 신청에 대하여 일정한 처분을 해야 할 법률상 의무가 있어야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제2조제1항제2호는 신청·상당한 기간·법률상 처분의무·불행위를 요구합니다.\n근거: 행정소송법 제2조 · 제2조제1항제1호·제2호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0002&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제4조 · 행정소송법 제4조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0004&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "거부처분이 이미 있으면 이를 그대로 “계속된 무응답”이라고 부르지 않습니다. 내부 입국금지결정과 외부의 사증발급 거부처럼 행위를 나누어 보세요."
