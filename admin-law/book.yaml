    rationale: "행정소송규칙 제15조가 정한 권한입니다.\n근거: 행정소송규칙 제15조 · 법원의 직권에 의한 조정권고 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0015&lsiSeq=260689&urlMode=lsScJoRltInfoR\n행정소송법 제8조 · 제2항: 민사소송법 등 준용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0008&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제32조 · 처분 취소·변경으로 청구가 각하·기각될 때의 소송비용 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0032&lsiSeq=285913&urlMode=lsScJoRltInfoR"
