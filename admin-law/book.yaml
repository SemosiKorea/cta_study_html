    rationale: "법 제12조는 처분등의 취소를 구할 법률상 이익을 요구합니다. 일반적 관심만으로 충분하지 않습니다.\n근거: 행정소송법 제12조 · 제12조 전단 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0012&lsiSeq=285913&urlMode=lsScJoRltInfoR"
    correction: ""
    trap: "원고적격이 인정된다는 것은 소송의 문을 통과한다는 뜻입니다. 허가가 위법하다는 본안 결론까지 자동으로 정해지는 것은 아닙니다."
    source: "행정소송법 처음 회독 · 학습용 창작 OX · https://semosikorea.github.io/cta_study_html/admin-law/part03.html#u01"
