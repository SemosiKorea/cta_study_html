    rationale: "법 제30조제1항의 규정입니다.\n근거: 행정소송법 제29조 · 취소판결 등의 제3자효 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0029&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제30조 · 취소판결의 기속력 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0030&lsiSeq=285913&urlMode=lsScJoRltInfoR\n행정소송법 제8조 · 민사소송법 준용과 기판력의 이해 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0008&lsiSeq=285913&urlMode=lsScJoRltInfoR"
