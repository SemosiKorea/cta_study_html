  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 국세·납세자·특수관계인의 범위"
    statement: "4촌 혈족은 포함하지만 사실혼 배우자는 언제나 특수관계인에서 제외한다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "시행령은 배우자에 사실상의 혼인관계에 있는 자를 포함한다.\n비교 조건: 납세의무자와 납세자, 친족관계와 지배관계를 구별한다.\n근거: 국세기본법 제2조(정의) · 국세기본법 제3조(세법 등과의 관계) · 국세기본법 시행령 제1조의2(특수관계인의 범위)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제2조(정의) https://www.law.go.kr/법령/국세기본법/제2조 / 국세기본법 제3조(세법 등과의 관계) https://www.law.go.kr/법령/국세기본법/제3조 / 국세기본법 시행령 제1조의2(특수관계인의 범위) https://www.law.go.kr/법령/국세기본법시행령/제1조의2"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 국세·납세자·특수관계인의 범위"
    statement: "원천징수의무자는 자기의 소득세를 내는 사람이 아니어도 국세기본법상 납세자에 포함된다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "납세자 정의에는 세법에 따라 국세를 징수하여 납부할 의무를 지는 자도 포함된다.\n비교 조건: 납세의무자와 납세자, 친족관계와 지배관계를 구별한다.\n근거: 국세기본법 제2조(정의) · 국세기본법 제3조(세법 등과의 관계) · 국세기본법 시행령 제1조의2(특수관계인의 범위)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제2조(정의) https://www.law.go.kr/법령/국세기본법/제2조 / 국세기본법 제3조(세법 등과의 관계) https://www.law.go.kr/법령/국세기본법/제3조 / 국세기본법 시행령 제1조의2(특수관계인의 범위) https://www.law.go.kr/법령/국세기본법시행령/제1조의2"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 기한 말일의 휴일·통신장애"
    statement: "국세정보통신망이 월요일에 복구되어 그날부터 신고 가능해졌다면 반드시 그 월요일이 장애 특례의 신고기한이다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "복구되어 신고할 수 있게 된 날의 다음 날이다.\n비교 조건: 휴일의 다음 날과 장애 복구일의 다음 날을 구별한다.\n근거: 국세기본법 제4조(기간의 계산) · 국세기본법 제5조(기한의 특례) · 국세기본법 시행령 제1조의3(전자신고의 특례 등)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제4조(기간의 계산) https://www.law.go.kr/법령/국세기본법/제4조 / 국세기본법 제5조(기한의 특례) https://www.law.go.kr/법령/국세기본법/제5조 / 국세기본법 시행령 제1조의3(전자신고의 특례 등) https://www.law.go.kr/법령/국세기본법시행령/제1조의3"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 기한 말일의 휴일·통신장애"
    statement: "법정신고기한이 일요일이면 휴일 특례에 따라 다음 날을 신고기한으로 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "법 제5조의 기한 특례다. 다음 날도 법정 휴일이면 다시 확인한다.\n비교 조건: 휴일의 다음 날과 장애 복구일의 다음 날을 구별한다.\n근거: 국세기본법 제4조(기간의 계산) · 국세기본법 제5조(기한의 특례) · 국세기본법 시행령 제1조의3(전자신고의 특례 등)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제4조(기간의 계산) https://www.law.go.kr/법령/국세기본법/제4조 / 국세기본법 제5조(기한의 특례) https://www.law.go.kr/법령/국세기본법/제5조 / 국세기본법 시행령 제1조의3(전자신고의 특례 등) https://www.law.go.kr/법령/국세기본법시행령/제1조의3"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 우편·전자신고와 기한연장"
    statement: "신고기한 내 우편날짜도장이 찍힌 신고서가 기한 후 도달하여도 우편신고 특례를 적용할 수 있다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "제5조의2는 도달일이 아니라 우편날짜도장일을 기준으로 한다.\n비교 조건: 우편의 발송 기준과 전자의 전송 완료 기준을 구별한다.\n근거: 국세기본법 제5조의2(우편신고 및 전자신고) · 국세기본법 제6조(천재 등으로 인한 기한의 연장) · 국세기본법 시행령 제2조(기한연장의 사유) · 국세기본법 시행령 제3조(기한연장의 신청) · 국세기본법 시행규칙 제1조(전자신고등의 방법ㆍ절차 등)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제5조의2(우편신고 및 전자신고) https://www.law.go.kr/법령/국세기본법/제5조의2 / 국세기본법 제6조(천재 등으로 인한 기한의 연장) https://www.law.go.kr/법령/국세기본법/제6조 / 국세기본법 시행령 제2조(기한연장의 사유) https://www.law.go.kr/법령/국세기본법시행령/제2조 / 국세기본법 시행령 제3조(기한연장의 신청) https://www.law.go.kr/법령/국세기본법시행령/제3조 / 국세기본법 시행규칙 제1조(전자신고등의 방법ㆍ절차 등) https://www.law.go.kr/법령/국세기본법시행규칙/제1조"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 우편·전자신고와 기한연장"
    statement: "전자신고 버튼을 누른 때를 증명하면 국세청장에게 실제 전송되지 않았어도 신고가 완료된다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "전자신고는 국세청장에게 전송된 때가 기준이다.\n비교 조건: 우편의 발송 기준과 전자의 전송 완료 기준을 구별한다.\n근거: 국세기본법 제5조의2(우편신고 및 전자신고) · 국세기본법 제6조(천재 등으로 인한 기한의 연장) · 국세기본법 시행령 제2조(기한연장의 사유) · 국세기본법 시행령 제3조(기한연장의 신청) · 국세기본법 시행규칙 제1조(전자신고등의 방법ㆍ절차 등)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제5조의2(우편신고 및 전자신고) https://www.law.go.kr/법령/국세기본법/제5조의2 / 국세기본법 제6조(천재 등으로 인한 기한의 연장) https://www.law.go.kr/법령/국세기본법/제6조 / 국세기본법 시행령 제2조(기한연장의 사유) https://www.law.go.kr/법령/국세기본법시행령/제2조 / 국세기본법 시행령 제3조(기한연장의 신청) https://www.law.go.kr/법령/국세기본법시행령/제3조 / 국세기본법 시행규칙 제1조(전자신고등의 방법ㆍ절차 등) https://www.law.go.kr/법령/국세기본법시행규칙/제1조"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 송달 장소·수령인·등기우편"
    statement: "연대납세의무자가 세 명이면 납부고지서는 대표자 한 사람뿐 아니라 모두에게 각각 송달하여야 한다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "제8조제2항 단서가 고지·독촉을 별도로 규정한다.\n비교 조건: 서류 종류와 본인 부재·거부·수감 사유를 나누어 판단한다.\n근거: 국세기본법 제8조(서류의 송달) · 국세기본법 제9조(송달받을 장소의 신고) · 국세기본법 제10조(서류 송달의 방법) · 국세기본법 시행령 제5조의2(일반우편 송달의 범위)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제8조(서류의 송달) https://www.law.go.kr/법령/국세기본법/제8조 / 국세기본법 제9조(송달받을 장소의 신고) https://www.law.go.kr/법령/국세기본법/제9조 / 국세기본법 제10조(서류 송달의 방법) https://www.law.go.kr/법령/국세기본법/제10조 / 국세기본법 시행령 제5조의2(일반우편 송달의 범위) https://www.law.go.kr/법령/국세기본법시행령/제5조의2"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 송달 장소·수령인·등기우편"
    statement: "등기우편의 수신인이 외출 중이면 사리를 판별할 수 있는 동거인에게도 서류를 줄 수 없다."
    choices: ["O","X","?"]
    answer: "X"
    rationale: "법 제10조제4항은 본인 부재 시 보충송달을 허용한다.\n비교 조건: 서류 종류와 본인 부재·거부·수감 사유를 나누어 판단한다.\n근거: 국세기본법 제8조(서류의 송달) · 국세기본법 제9조(송달받을 장소의 신고) · 국세기본법 제10조(서류 송달의 방법) · 국세기본법 시행령 제5조의2(일반우편 송달의 범위)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제8조(서류의 송달) https://www.law.go.kr/법령/국세기본법/제8조 / 국세기본법 제9조(송달받을 장소의 신고) https://www.law.go.kr/법령/국세기본법/제9조 / 국세기본법 제10조(서류 송달의 방법) https://www.law.go.kr/법령/국세기본법/제10조 / 국세기본법 시행령 제5조의2(일반우편 송달의 범위) https://www.law.go.kr/법령/국세기본법시행령/제5조의2"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 전자송달·공시송달의 효력"
    statement: "납세자가 전자송달된 문서를 뒤늦게 열어 보았어도 국세정보통신망에 적법하게 저장된 때를 도달시점으로 본다."
    choices: ["O","X","?"]
    answer: "O"
    rationale: "열람일과 저장일을 구별한다.\n비교 조건: 도달·저장·열람과 공고 후 경과기간을 구별한다.\n근거: 국세기본법 제10조(서류 송달의 방법) · 국세기본법 제11조(공시송달) · 국세기본법 제12조(송달의 효력 발생) · 국세기본법 시행령 제7조의2(공시송달)"
    source: "국세기본법 법조문 회독 · 2026.11.1. 기준 · 국세기본법 제10조(서류 송달의 방법) https://www.law.go.kr/법령/국세기본법/제10조 / 국세기본법 제11조(공시송달) https://www.law.go.kr/법령/국세기본법/제11조 / 국세기본법 제12조(송달의 효력 발생) https://www.law.go.kr/법령/국세기본법/제12조 / 국세기본법 시행령 제7조의2(공시송달) https://www.law.go.kr/법령/국세기본법시행령/제7조의2"
    referenceYear: 2026
    tags: ["국세기본법","법조문회독","조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "국세기본법 제1편 총칙 · 전자송달·공시송달의 효력"
    statement: "공시송달은 국세정보통신망에만 공고해도 다른 방법 없이 언제나 완성된다."
