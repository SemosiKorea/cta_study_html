schema: hoedok.cards/v1
cards:
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제1장 소득세의 의의 및 과세체계"
    statement: "개인이 한 해에 받은 퇴직소득은 근로소득과 합산하여 종합소득세 기본세율을 적용한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "퇴직소득은 분류과세 대상이다. 근로소득은 종합소득 계산에 넣고, 퇴직소득은 별도 과세표준과 산출세액을 구한다."
    source: "2026 소득세 · 제1장 소득세의 의의 및 과세체계 · 교재 2쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제1장 소득세의 의의 및 과세체계"
    statement: "일반 근로자인 갑이 퇴직하면서 마지막 달 급여 300만원과 세법상 퇴직소득 2,000만원을 받았다. 회사가 두 금액에서 모두 원천징수했다면 두 소득 모두 분리과세로 끝난다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "급여는 종합소득인 근로소득이고, 퇴직소득은 별도의 과세표준으로 계산하는 분류과세 대상입니다. 원천징수 여부만으로 계산 방식을 정할 수 없습니다."
    source: "2026 소득세 · 제1편 총설 · 교재 4쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제2장 납세의무 및 과세소득의 범위"
    statement: "국내에 주소가 있는 사람도 국내에 183일 거주한 날부터 소득세법상 거주자가 된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "국내 주소와 183일 이상 거소는 선택 요건이다. 이미 국내에 생활의 근거인 주소가 있으면 183일이 지나야만 거주자가 되는 것은 아니다."
    source: "2026 소득세 · 제2장 납세의무 및 과세소득의 범위 · 교재 7쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제2장 납세의무 및 과세소득의 범위"
    statement: "외국인 거주자 갑은 과세기간 종료일 전 10년 중 국내 주소·거소 기간이 합계 5년이다. 해외에서 발생한 과세대상 이자 300만원을 현지 계좌로 받고 그중 100만원만 국내로 송금했다. 이 이자 중 국내 과세범위에 드는 금액은 100만원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "5년 이하에는 정확히 5년도 포함됩니다. 외국에서 지급받았으므로 국내로 송금한 100만원만 해당합니다. 국내 거주기간 합계가 5년을 초과했다면 일반 거주자 원칙에 따라 300만원 전부가 대상입니다."
    source: "2026 소득세 · 제1편 총설 · 교재 13쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제3장 과세기간 및 납세지"
    statement: "개인사업자가 9월 30일에 사업을 폐업하면 그 사람의 소득세 과세기간도 9월 30일에 끝난다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "폐업 자체는 개인의 과세기간 종료 사유가 아니다. 통상 12월 31일까지이며 사망·국외 주소이전 출국은 법정 예외다."
    source: "2026 소득세 · 제3장 과세기간 및 납세지 · 교재 18쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제3장 과세기간 및 납세지"
    statement: "서울에 주소가 있는 거주자 갑이 대전에서 혼자 사업한다. 납세지 지정을 받지 않고 주소만 부산으로 옮겼다. 별도 신고를 갈음하는 절차도 없다면 변경일부터 15일 이내에 부산 주소지 관할 세무서장에게 납세지 변경을 신고한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "본인 사업소득의 납세지는 원칙적으로 주소지입니다. 변경 신고는 변경 후 관할인 부산에 합니다. 대전 사업장을 납세지로 지정받으려면 별도의 신청·지정 절차를 확인해야 합니다."
    source: "2026 소득세 · 제1편 총설 · 교재 22쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제1장 이자소득"
    statement: "금전을 빌려주면서 지출한 대출중개수수료는 개인의 비영업대금 이익에서 필요경비로 뺀다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "비영업대금 이익은 이자소득이다. 이자소득금액은 원칙적으로 총수입금액이므로 사업소득처럼 비용을 대응해 빼지 않는다."
    source: "2026 소득세 · 제1장 이자소득 · 교재 24쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제1장 이자소득"
    statement: "갑이 개인적으로 빌려준 돈의 이자지급 약정일은 2027년 1월 5일이다. 채무자가 2026년 12월 28일에 이자를 전부 지급했다면 2026년 이자소득이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "비영업대금의 이익은 약정일이 원칙이지만 약정일 전에 실제 지급받으면 실제 지급일을 적용합니다. 돈을 받지 않았다면 원칙적으로 약정일이 기준입니다."
    source: "2026 소득세 · 제2편 · 교재 49쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제2장 배당소득"
    statement: "거주자의 외국법인 현금배당이 종합과세되면 2026년 배당금의 10%를 가산한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "국외 배당이 종합과세될 수는 있어도 외국법인의 배당은 국내 법인세와의 이중과세 조정을 위한 배당가산 대상이 아니다."
    source: "2026 소득세 · 제2장 배당소득 · 교재 56쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제2장 배당소득"
    statement: "취득가액 600만원인 주식을 소각하고 현금 900만원을 받았다. 다른 조정사항이 없다면 의제배당은 900만원이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "의제배당은 소각대가에서 그 주식을 취득하기 위해 든 금액을 뺀 300만원입니다. 대가 전부와 투자원본의 반환을 구분하세요."
    source: "2026 소득세 · 제2편 · 교재 69쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제3장 사업소득"
    statement: "2026년에는 부부 합산 2주택자의 주택 보증금에 대해 간주임대료가 발생할 수 없다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "각각 기준시가 12억원을 초과하는 고가주택 2채를 보유하고 해당 보증금 합계가 12억원을 초과하면 2026년부터 간주임대료 과세가 가능하다."
    source: "2026 소득세 · 제3장 사업소득 · 교재 91쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제3장 사업소득"
    statement: "12월에 판매를 위탁한 상품을 수탁자가 다음 해 1월에 팔았다. 일반 위탁판매라면 12월에 발송했다는 사실로 당해 연도 사업수입이 확정된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "위탁판매는 수탁자가 판매한 날이 기준이므로 다음 해 1월입니다. 사업자가 매수인에게 직접 인도한 경우의 기준을 가져오면 안 됩니다."
    source: "2026 소득세 · 제2편 · 교재 119쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제4장 근로소득"
    statement: "상용근로자가 7월에 입사해 6개월 근무했다면 연간 총급여로 계산한 근로소득공제액의 절반만 공제한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "근로기간이 1년 미만이어도 실제 총급여로 산출한 근로소득공제를 월할하지 않는다."
    source: "2026 소득세 · 제4장 근로소득 · 교재 126쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제4장 근로소득"
    statement: "갑이 한 해에 두 직장에서 상용근로 급여를 받았다. 직장별로 총급여를 나눈 뒤 각각 근로소득공제표를 적용해 두 공제액을 합산한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "그 사람의 연간 과세대상 급여를 합해 근로소득공제표를 한 번 적용합니다. 원천징수를 두 회사가 각각 했다는 사실은 연간 계산 단위를 바꾸지 않습니다."
    source: "2026 소득세 · 제2편 · 교재 155쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제5장 연금소득"
    statement: "개인이 과거에 세액공제를 받지 않은 연금저축 납입원금을 인출하면 반드시 연금소득세를 낸다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "공제를 받지 않은 납입원금은 확인 절차를 거쳐 과세제외한다. 공제받은 원금·운용수익인지부터 구분한다."
    source: "2026 소득세 · 제5장 연금소득 · 교재 163쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제5장 연금소득"
    statement: "갑이 과거 세액공제를 받지 않은 것으로 확인된 개인납입액 100만원만 연금계좌에서 인출했다. 그 인출액은 과세대상 연금소득에서 제외한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "확인된 미공제 납입액은 과세제외 재원입니다. 같은 계좌에 있어도 공제받은 납입액이나 운용수익은 인출 방식에 따라 과세가 달라집니다."
    source: "2026 소득세 · 제2편 · 교재 179쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제6장 기타소득"
    statement: "원천징수된 선택대상 기타소득의 연간 총수입금액이 300만원을 넘으면 반드시 종합과세된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "연 300만원의 판정 대상은 경비 차감 후 기타소득금액이다. 총수입금액이 300만원을 넘어도 소득금액이 300만원 이하라면 선택할 수 있다."
    source: "2026 소득세 · 제6장 기타소득 · 교재 181쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제6장 기타소득"
    statement: "일시적인 강연 대가 200만원에 대응하는 필요경비 140만원을 입증했다. 법정 필요경비율 60%가 적용되는 강연이라도 기타소득금액은 60만원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "법정 필요경비 120만원보다 실제 경비 140만원이 크므로 실제 경비를 뺍니다. 입증한 경비가 90만원이었다면 법정 경비 120만원을 빼 소득금액은 80만원입니다."
    source: "2026 소득세 · 제2편 · 교재 195쪽"
    referenceYear: 2026
    tags: ["소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제3편 제1장 필요경비의 계산"
    statement: "꽃집을 운영하는 민서는 가족만 거주하는 아파트의 관리비를 꽃집 계좌에서 냈다. 이 관리비는 꽃집의 필요경비에 넣을 수 있다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "어느 계좌로 냈는지보다 어디에 썼는지를 본다. 꽃집 영업에 사용한 점포의 관리비는 사업 관련 비용이지만, 가족의 주거비는 가사 관련 경비다. 소득세법 제27조·제33조, 교재 206·220쪽."
    source: "2026 소득세 · 제1장 필요경비의 계산 · 교재 206쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제3편 제1장 필요경비의 계산"
    statement: "개인사업자 갑이 자신의 계좌로 매월 300만원을 이체하고 직원 급여와 같은 계정에 기록했다. 그중 본인 몫도 사업소득 필요경비로 공제된다."
    choices: ["O", "X", "?"]
    answer: "X"
