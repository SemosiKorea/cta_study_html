schema: hoedok.cards/v1
cards:
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제1장 소득세의 의의 및 과세체계"
    statement: "개인이 한 해에 받은 퇴직소득은 근로소득과 합산하여 종합소득세 기본세율을 적용한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "퇴직소득은 분류과세 대상이다. 근로소득은 종합소득 계산에 넣고, 퇴직소득은 별도 과세표준과 산출세액을 구한다."
    source: "2026 소득세 · 제1장 소득세의 의의 및 과세체계 · 교재 2쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제2장 납세의무 및 과세소득의 범위"
    statement: "국내에 주소가 있는 사람도 국내에 183일 거주한 날부터 소득세법상 거주자가 된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "국내 주소와 183일 이상 거소는 선택 요건이다. 이미 국내에 생활의 근거인 주소가 있으면 183일이 지나야만 거주자가 되는 것은 아니다."
    source: "2026 소득세 · 제2장 납세의무 및 과세소득의 범위 · 교재 7쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제3장 과세기간 및 납세지"
    statement: "개인사업자가 9월 30일에 사업을 폐업하면 그 사람의 소득세 과세기간도 9월 30일에 끝난다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "폐업 자체는 개인의 과세기간 종료 사유가 아니다. 통상 12월 31일까지이며 사망·국외 주소이전 출국은 법정 예외다."
    source: "2026 소득세 · 제3장 과세기간 및 납세지 · 교재 18쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제1장 이자소득"
    statement: "금전을 빌려주면서 지출한 대출중개수수료는 개인의 비영업대금 이익에서 필요경비로 뺀다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "비영업대금 이익은 이자소득이다. 이자소득금액은 원칙적으로 총수입금액이므로 사업소득처럼 비용을 대응해 빼지 않는다."
    source: "2026 소득세 · 제1장 이자소득 · 교재 24쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제2장 배당소득"
    statement: "거주자의 외국법인 현금배당이 종합과세되면 2026년 배당금의 10%를 가산한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "국외 배당이 종합과세될 수는 있어도 외국법인의 배당은 국내 법인세와의 이중과세 조정을 위한 배당가산 대상이 아니다."
    source: "2026 소득세 · 제2장 배당소득 · 교재 56쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제3장 사업소득"
    statement: "2026년에는 부부 합산 2주택자의 주택 보증금에 대해 간주임대료가 발생할 수 없다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "각각 기준시가 12억원을 초과하는 고가주택 2채를 보유하고 해당 보증금 합계가 12억원을 초과하면 2026년부터 간주임대료 과세가 가능하다."
    source: "2026 소득세 · 제3장 사업소득 · 교재 91쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제4장 근로소득"
    statement: "상용근로자가 7월에 입사해 6개월 근무했다면 연간 총급여로 계산한 근로소득공제액의 절반만 공제한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "근로기간이 1년 미만이어도 실제 총급여로 산출한 근로소득공제를 월할하지 않는다."
    source: "2026 소득세 · 제4장 근로소득 · 교재 126쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제5장 연금소득"
    statement: "개인이 과거에 세액공제를 받지 않은 연금저축 납입원금을 인출하면 반드시 연금소득세를 낸다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "공제를 받지 않은 납입원금은 확인 절차를 거쳐 과세제외한다. 공제받은 원금·운용수익인지부터 구분한다."
    source: "2026 소득세 · 제5장 연금소득 · 교재 163쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제6장 기타소득"
    statement: "원천징수된 선택대상 기타소득의 연간 총수입금액이 300만원을 넘으면 반드시 종합과세된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "연 300만원의 판정 대상은 경비 차감 후 기타소득금액이다. 총수입금액이 300만원을 넘어도 소득금액이 300만원 이하라면 선택할 수 있다."
    source: "2026 소득세 · 제6장 기타소득 · 교재 181쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제3편 제1장 필요경비의 계산"
    statement: "꽃집을 운영하는 민서는 가족만 거주하는 아파트의 관리비를 꽃집 계좌에서 냈다. 이 관리비는 꽃집의 필요경비에 넣을 수 있다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "어느 계좌로 냈는지보다 어디에 썼는지를 본다. 꽃집 영업에 사용한 점포의 관리비는 사업 관련 비용이지만, 가족의 주거비는 가사 관련 경비다. 소득세법 제27조·제33조, 교재 206·220쪽."
    source: "2026 소득세 · 제1장 필요경비의 계산 · 교재 206쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제3편 제2장 충당금의 필요경비 계산"
    statement: "대손충당금의 필요경비 산입한도는 기말 적격채권 잔액의 1%와 대손실적률 적용액 중 작은 금액이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "두 금액 중 큰 금액이 세법상 한도다. 세무상 인정액을 구할 때는 실제 장부에 설정한 금액도 확인한다."
    source: "2026 소득세 · 제2장 충당금의 필요경비 계산 · 교재 233쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제3편 제3장 재고자산 및 외화자산⋅부채의 평가"
    statement: "의류 소매점을 처음 연 지훈은 기한까지 재고자산 평가방법을 신고하지 않았다. 세무서가 기말 의류 재고를 평가할 때에는 선입선출법을 적용한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "일반 상품은 평가방법을 처음부터 신고하지 않으면 선입선출법을 쓴다. 재고가 매매 목적으로 보유한 부동산이라면 개별법을 적용한다. 소득세법 시행령 제95조, 교재 250~251쪽."
    source: "2026 소득세 · 제3장 재고자산 및 외화자산⋅부채의 평가 · 교재 249쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제3편 제4장 감가상각비"
    statement: "사업용 토지도 매년 정액법으로 감가상각한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "토지는 원칙적으로 감가상각 대상 자산이 아니다. 건축물과 부속토지를 함께 샀다면 취득가액을 먼저 구분한다."
    source: "2026 소득세 · 제4장 감가상각비 · 교재 255쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제3편 제5장 기부금의 필요경비 계산"
    statement: "문구점 주인이 단골 거래처 한 곳과 거래를 계속할 목적으로 명절 선물을 무상 제공했다. 대금을 받지 않았으므로 이 지출은 기부금이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "무상 제공이라도 사업상 거래를 유지할 목적으로 특정 거래처에 준 선물은 기업업무추진비에 해당한다. 기부금으로 보려면 사업과 직접 관계없이 지출했는지를 확인한다. 소득세법 제34조·제35조, 교재 276쪽."
    source: "2026 소득세 · 제5장 기부금의 필요경비 계산 · 교재 276쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제3편 제6장 기업업무추진비의 필요경비 계산"
    statement: "거래처 경조사에 지출한 기업업무추진비는 일반 접대와 같이 건당 3만원을 초과하면 법정 적격증빙이 필요하다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "해당 기준은 일반 지출 3만원 초과, 경조금 20만원 초과로 다르다. 증빙과 별도로 연간 한도를 적용한다."
    source: "2026 소득세 · 제6장 기업업무추진비의 필요경비 계산 · 교재 292쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제4편 제1장 부당행위계산 및 시가산정"
    statement: "개인사업자인 현우가 친동생에게 점포를 빌려주고, 같은 조건의 주변 점포와 동일한 시가의 임대료를 받았다. 세 부담이 줄지 않아도 형제간 거래라는 이유만으로 임대소득을 다시 계산할 수 있다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "특수관계인 여부와 조세 부담의 부당한 감소를 함께 판단한다. 시가로 임대해 세 부담이 줄지 않았다면 부인 요건을 충족하지 않는다. 소득세법 제41조, 교재 302~305쪽."
    source: "2026 소득세 · 제1장 부당행위계산 및 시가산정 · 교재 302쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제4편 제2장 공동사업 합산과세"
    statement: "특수관계인끼리 공동사업을 하면 실제 분배약정에 관계없이 모든 이익을 주된 공동사업자에게 합산한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "정상적인 공동사업은 약정 손익분배비율로 분배한다. 허위 분배비율 등 법정 합산 요건이 있는지 별도로 확인한다."
    source: "2026 소득세 · 제2장 공동사업 합산과세 · 교재 308쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제4편 제3장 결손금과 이월결손금 공제"
    statement: "비주거용 상가 임대업에서 생긴 결손금은 같은 해 근로소득에서 바로 뺄 수 있다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "비주거용 부동산임대업의 결손은 원칙적으로 그 임대업 소득 범위에서 공제한다. 주거용 건물 임대업은 별도 예외다."
    source: "2026 소득세 · 제3장 결손금과 이월결손금 공제 · 교재 328쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제4편 제4장 기타 소득금액계산의 특례"
    statement: "가게를 운영하던 아버지가 그해 6월 사망했고, 딸에게도 자신의 사업소득이 있다. 딸이 아버지의 세금을 납부하는 경우에도 사망 전 아버지의 사업소득은 딸의 사업소득과 구분해 세액을 계산한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "상속인이 세금을 납부하는 것과 소득을 합산하는 것은 별개의 문제다. 아버지의 소득으로 산출한 세액과 딸 자신의 소득세를 각각 계산한다. 소득세법 제44조, 교재 343쪽."
    source: "2026 소득세 · 제4장 기타 소득금액계산의 특례 · 교재 343쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제5편 제1장 소득세법상 소득공제"
    statement: "연간 소득금액 100만원 이하인 장애인 부양가족도 법정 기본공제 나이 기준을 반드시 충족해야 한다."
