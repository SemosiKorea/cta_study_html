  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제6장 기타소득"
    statement: "공제할 수 있는 기타소득 필요경비의 최대액은?\n\n모두 비사업성인 개별 거래다. 주택입주지체상금 수입 600만원(실제 경비 400만원), 고용관계 없는 일시적 강연료 300만원(100만원). 강연은 소득세법 제21조 제1항 제15~17호에는 해당하지 않는다.\n사진 원작자로서 받은 창작 대가 1,000만원(실제 700만원), 생존 중인 국내 원작자의 회화 양도 가액 8,000만원(실제 2,000만원).\n\n계산 후 판단　정률 필요경비보다 실제 적격 경비가 더 크면 이 문항의 창작대가는 실제 경비를 쓴다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "입주지체상금 경비는 max(실제 400, 600×80%)＝480만원. 일반적인 위약금에 모두 80%를 적용하는 것은 아니다.\n일시 강연료는 max(100, 300×60%)＝180만원. 창작 대가는 max(700, 1,000×60%)＝700만원.\n양도일 현재 생존해 있는 국내 원작자의 회화는 서화·골동품 양도 기타소득 대상에서 제외하므로 실제 경비 2,000만원도 합산하지 않는다. 합계 480＋180＋700＝1,360만원.\n13,600,000원 · ②"
    source: "세무사 1차 2023년 56번 · 기타소득의 필요경비와 과세대상 제외 · 2026.11.1. 기준 · 소득세 교재 188~191·195~197쪽. 소득세법 제21조·제37조, 시행령 제41조·제87조."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2023기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제6편 제2장 금융소득 종합과세"
    statement: "거주자의 금융소득과 사업소득을 반영한 종합소득 산출세액은?\n\n은행예금 이자 3,000만원, 비실명 이자 400만원, 온라인투자연계금융업자를 거치지 않은 비영업대금 이익 1,200만원, 외국법인 배당 500만원.\n사업소득금액 4,000만원, 종합소득공제 900만원. 기본세율은 1,400만원 이하 6%, 1,400만원 초과~5,000만원 15%, 5,000만원 초과~8,800만원 24%다.\n\n계산 후 판단　비영업대금 이익에는 비교산출세액을 구할 때 이 사례의 25% 세율을 반영한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "세액 계산에 포함하는 금융소득은 3,000＋1,200＋500＝4,700만원. 비실명 이자는 분리과세, 외국법인 배당은 가산 없이 합산한다. 다른 소득의 과세표준은 4,000−900＝3,100만원.\n일반산출세액은 2,000×14%＋(4,700−2,000＋3,100)에 대한 기본세율 세액＝280＋624＋(5,800−5,000)×24%＝1,096만원.\n비교산출세액은 (3,000＋500)×14%＋1,200×25%＋[84＋(3,100−1,400)×15%]＝490＋300＋339＝1,129만원. 두 금액 중 큰 금액을 택한다.\n11,290,000원 · ②"
    source: "세무사 1차 2023년 57번 · 금융소득 비교과세 · 2026.11.1. 기준 · 소득세 교재 478~487쪽. 소득세법 제14조·제55조·제62조·제129조."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2023기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제2장 배당소득"
    statement: "종합과세할 배당소득금액은?\n\n비상장 내국법인 금전배당 1,500만원, 법인세법상 배당처분 400만원, 소각일부터 2년 이내 자기주식소각이익을 자본금에 전입해 받은 신주 액면 800만원.\n외국법인 배당 300만원, 감자 의제배당 600만원, 출자공동사업자 배당 200만원, 주식 포괄적 교환차익의 자본금 전입으로 받은 신주 액면 100만원.\n제시액은 세전이며 원천징수는 적법하다. 자료 외의 배당가산 배제·분리과세 사유는 없다.\n\n계산 후 판단　출자공동사업자 배당은 종합소득에 합산하지만 금융소득 2,000만원 초과를 판정하는 금액에서는 뺀다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "포괄적 주식교환차익의 자본전입 100만원은 의제배당에서 제외한다. 나머지 배당 수입 합계는 3,800만원이다.\n출자공동사업자 배당 200만원은 당연 종합과세하되 2,000만원 기준 판정에서는 제외한다. 판정 대상 3,600만원 중 초과액은 1,600만원이다.\n배당가산 대상은 1,500＋400＋600＝2,500만원. 외국 배당과 자기주식소각이익 자본전입 배당에는 가산하지 않는다. 가산액 min(2,500,1,600)×10%＝160만원. 최종 3,800＋160＝3,960만원.\n39,600,000원 · 현행 금액에 해당하는 원래 보기가 없다."
    source: "세무사 1차 2023년 59번 · 배당 유형별 배당가산과 기준금액 · 2026.11.1. 기준 · 소득세 교재 55~57·70~73·79~81·482~486쪽. 소득세법 제14조·제17조, 시행령 제27조 제3항."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2023기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제6편 제3장 세액계산의 특례"
    statement: "분리과세를 선택한 경우 주택임대 사업소득금액은 얼마인가?\n\n거주자가 보유한 국내 임대주택은 세 채다. A는 요건을 충족한 등록임대주택. 보증금 3억5,000만원, 월 100만원(12개월), 기준시가 3억원, 전용 50㎡.\nB는 미등록. 보증금 3억원, 월세 없음(12개월), 기준시가 2억5,000만원, 전용 45㎡. C도 미등록. 보증금 2억5,000만원, 월 80만원(3~12월), 기준시가 1억8,000만원, 전용 40㎡.\n월세는 매월 말 수령. 주택임대 외 종합소득금액은 1,800만원. 원문은 정기예금이자율 3.5%, 연 366일을 제시한다.\n\n계산 후 판단　소형주택 C의 보증금 간주임대료를 배제하더라도 C에서 실제 수령한 월세는 합산한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "2026년 귀속에서 C는 면적 40㎡ 이하이고 기준시가 2억원 이하라서 보증금 간주임대료의 주택 수에서 제외한다. 남은 주택은 두 채로 일반 3주택 요건에 미달하고 고가주택 2채 요건도 충족하지 않는다. 따라서 보증금 간주임대료는 0원이다.\n월세는 C도 포함한다. 등록 A는 100×12＝1,200만원, 미등록 C는 80×10＝800만원. 합계 2,000만원이므로 분리과세 선택이 가능하다.\n필요경비를 빼면 1,200×(1−60%)＋800×(1−50%)＝880만원. 다른 종합소득 1,800만원이 2,000만원 이하이므로 공제액은 400×1,200/2,000＋200×800/2,000＝320만원. 사업소득금액 880−320＝560만원.\n5,600,000원 · ②"
    source: "세무사 1차 2024년 51번 · 등록·미등록 주택 혼합 분리과세 · 2026.11.1. 기준 · 소득세 교재 101~103·109~110·494~496쪽. 소득세법 제12조·제14조·제25조·제64조의2, 시행령 제53조·제122조의2."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2024기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제5장 연금소득"
    statement: "인출액 중 연금소득에 대한 국세 원천징수세액은? 기타소득에 대한 세액은 묻지 않는다.\n\n인출연도에 60세인 거주자가 2017.10.1. 연금저축계좌에 가입해 2023.9.30.까지 6년간 납입했다. 납입액 합계 5,000만원 중 세액공제를 받지 않은 납입액이 550만원이다.\n2024.1.1. 연금개시 신청, 평가액 7,000만원(운용수익 2,000만원). 해당 연도에 1,800만원을 인출했다. 원문 연도 간격·나이를 유지해 현행 규정을 적용한다.\n종신형이 아니고 의료목적·천재지변 등 부득이한 인출도 아니다. 계좌는 일반 요건을 충족한다.\n\n계산 후 판단　이 연금의 수령연차는 실제 연금개시 신청일이 속한 2024년을 무조건 1년차로 산정한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "만 55세와 가입 후 5년을 최초로 함께 충족한 해는 2022년이다. 실제 신청한 2024년은 연금수령 3년차다.\n연금수령한도 7,000÷(11−3)×120%＝1,050만원. 인출액 중 먼저 나가는 세액공제받지 않은 원금 550만원은 과세하지 않는다.\n한도 안 과세 연금소득은 1,050−550＝500만원. 60세이고 종신형이 아니므로 500×5%＝25만원. 한도초과 1,800−1,050＝750만원은 연금외수령 기타소득이므로 질문의 연금소득 원천세에서는 제외한다.\n250,000원 · ①"
    source: "세무사 1차 2024년 52번 · 연금수령연차·한도·인출 순서 · 2026.11.1. 기준 · 소득세 교재 164~168·175~178·690쪽. 소득세법 제20조의3·제21조·제129조, 시행령 제40조의2·제40조의3."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2024기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제6편 제1장 세액의 계산"
    statement: "거주자가 직접 지출한 비용의 의료비세액공제액은?\n\n본인(40세, 총급여 6,000만원) 시력보정용 안경 100만원·건강증진 약품 200만원. 배우자(38세, 사업소득금액 5,000만원) 적격 난임시술 400만원·치료비 100만원.\n부친(67세, 이자 1,000만원) 치료비 100만원·보청기 100만원. 모친(64세, 무소득) 치료비 400만원·요양 목적 한약 300만원. 자녀(5세, 무소득) 치료 목적 약품 300만원.\n본인은 일용근로자가 아니다. 근로자가 직접 부담했으며 실손보험금 보전은 없다. 장애·중증질환·미숙아 등 별도 요건은 없다.\n\n계산 후 판단　64세 모친의 일반 치료비는 이 자료에서 65세 이상자 무한도 공제 항목에 넣는다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "보통 의료비는 배우자 치료비 100＋모친 400＋요양한약 300＝800만원. 총급여 3%인 180만원을 먼저 빼면 620만원(700만원 한도 이내). 의료비는 부양가족 소득 요건을 따지지 않는다.\n한도 없는 일반 공제율 항목은 본인 안경 min(100,50)＋65세 이상 부친 (100＋100)＋6세 이하 자녀 300＝550만원. 건강증진 목적 약품 200만원은 제외한다.\n의료비 공제 (620＋550)×15%＋난임시술비 400×30%＝175.5＋120＝295.5만원.\n2,955,000원 · ⑤"
    source: "세무사 1차 2024년 53번 · 의료비 공제의 대상·한도·공제율 · 2026.11.1. 기준 · 소득세 교재 407~408쪽. 소득세법 제59조의4 제2항, 시행령 제118조의5."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2024기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제2장 배당소득"
    statement: "종합소득에 합산되는 이자 및 배당소득금액의 합계는?\n\n예금이자 500만원. 국내 공모투자신탁의 직접 취득 자산 거래로 생긴 환매이익 1,200만원(회사채 양도차손 300만원, 코스닥상장주식 양도차익 1,000만원, 비상장주식 양도차익 500만원).\n장내 KOSPI200 선물 이익 1,000만원, 법령상 파생결합사채 이익 600만원, 유가증권시장 상장 내국법인의 현금배당 1,500만원.\n2018년 가입하여 원문 2024년에 만기 도래한 일반 저축성보험(종신형 아님). 만기보험금 5,000만원, 총 납입 4,000만원. 계약기간을 유지한다. 세전 금액이며 상장회사 배당 분리과세 특례를 신청하지 않은 경우다.\n\n계산 후 판단　장내 KOSPI200 선물과 법령상 파생결합사채에서 난 이익을 모두 배당소득으로 더한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "이자는 예금 500＋보험차익(5,000−4,000)＝1,500만원. 가입 후 만기까지 10년 미만인 일반 저축성보험은 장기 비과세 요건을 충족하지 않는다.\n공모투자신탁은 국내 코스닥상장주식 양도차익 1,000만원을 빼고 비상장주식 500−회사채 차손 300＝200만원을 배당으로 잡는다. 장내 KOSPI200 선물 이익은 양도소득으로 금융소득 합산에서 제외한다.\n배당 수입 200＋파생결합사채 600＋현금배당 1,500＝2,300만원. 금융소득 3,800만원 중 2,000만원 초과분 1,800만원과 가산대상 1,500만원 중 작은 금액×10%＝150만원. 최종 3,800＋150＝3,950만원.\n39,500,000원 · ③"
    source: "세무사 1차 2024년 54번 · 집합투자·파생상품·보험의 금융소득 · 2026.11.1. 기준 · 소득세 교재 25~30·55~63·79~81쪽. 소득세법 제16조·제17조·제94조, 시행령 제25조·제26조의2·제26조의3."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2024기출"]
