  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제2장 배당소득"
    statement: "종합소득에 합산할 이자소득금액과 배당소득금액의 합계는?\n\n거주자가 받은 세전 금액이다. 국내 상장법인 현금배당 800만원, 국채 공개시장 통합발행의 매각가와 액면가 차이 600만원.\n국내 정기예금 이자 300만원, 외국법인 발행 채권 이자 700만원, 비영업대금 이익 500만원, 법인과세 신탁재산 배당 300만원.\n원천징수는 적법하다. 상장법인 현금배당에는 별도 분리과세 특례를 신청하지 않은 일반적인 경우로 계산한다.\n\n계산 후 판단　법인과세 신탁재산에서 받은 배당금도 반드시 배당가산의 대상이 된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "과세 이자는 300＋700＋500＝1,500만원. 국채 통합발행 차액은 이자·할인액에서 제외한다.\n배당 800＋300＝1,100만원을 더하면 이자·배당 수입은 2,600만원이다. 법인과세 신탁재산의 배당은 배당가산 대상에서 제외한다.\n가산액은 min(대상 배당 800, 기준금액 초과분 2,600−2,000)×10%＝60만원. 합산액은 2,600＋60＝2,660만원.\n26,600,000원 · 현행 금액에 해당하는 원래 보기가 없다."
    source: "세무사 1차 2022년 51번 · 금융거래별 과세와 배당가산 · 2026.11.1. 기준 · 소득세 교재 24~26·56·79~81·482~486쪽. 소득세법 제14조·제16조·제17조, 시행령 제22조의2."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제4장 근로소득"
    statement: "중소기업 경리과장의 현행 총급여액은? 직무발명보상금 지급법인과의 관계가 결론을 바꾸는지도 판단하라.\n\n기본급·상여 5,000만원, 시간외근무수당 800만원, 회사 소유 사택 무상제공이익 500만원.\n현물 식사 없이 월 식사대 20만원씩 12개월, 8세 자녀 보육수당 월 10만원씩 12개월, 발명진흥법상 직무발명보상금 800만원.\n임원이 아닌 경리과장이 회사 주식 2%를 보유했다. 다른 주주의 지분, 지배주주 및 친족 등 관계는 제시되지 않았다.\n\n계산 후 판단　임원이 아닌 경리과장의 사택 비과세 여부가 본인 지분 2%만으로 바뀐다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "임원이 아닌 종업원이 받은 사택이익 500만원은 비과세. 식사를 받지 않은 달의 식사대는 월 20만원까지 비과세이므로 연 240만원 전액을 뺀다.\n경리과장은 생산직 등 연장근로 비과세 대상 직종에 해당하지 않는다. 보육수당은 과세기간 개시일 기준 6세 이하 자녀 요건을 적용하므로 8세 자녀분은 전액 과세한다.\n지배주주등 또는 그와 법정 친족·경영지배 관계가 있는 자가 아니면 직무발명보상금의 연 700만원까지 비과세. 총급여 5,000＋800＋120＋(800−700)＝6,020만원.\n지배주주등 해당 여부는 2%라는 본인 지분만으로 확정할 수 없다. 해당 특수관계인이면 800만원 전액 과세되어 5,000＋800＋120＋800＝6,720만원.\n일반 종업원 60,200,000원. 직무발명보상금 비과세에서 제외되는 특수관계인이면 67,200,000원. 두 금액 모두 원래 보기에 없다."
    source: "세무사 1차 2022년 53번 · 총급여에서 제외하는 근로소득 · 2026.11.1. 기준 · 소득세 교재 130·138~142쪽. 소득세법 제12조 제3호·제20조, 시행령 제17조의3·제17조의4. 법인세법 시행령 제43조 제7항."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제6편 제1장 세액의 계산"
    statement: "보험료세액공제와 교육비세액공제를 합하면 얼마인가?\n\n일용근로자가 아닌 본인(43세, 총급여 5,000만원)이 아래 지출을 부담했다. 가족은 문제에서 정한 기본공제대상자다.\n본인 건강보험료 200만원, 본인을 피보험자로 한 일반보장성보험료 50만원. 40세 배우자(총급여 400만원)의 대학원 등록금 1,200만원, 65세 모친(이자 500만원)의 대학 등록금 1,000만원.\n고교생 아들(18세) 교복 100만원·사설 영어학원 300만원. 중학생 장애인 딸(15세)의 방과후 특별활동비 200만원·딸이 수익자인 장애인전용보장성보험료 300만원. 자녀 소득 없음.\n\n계산 후 판단　한 사람이 일반보장성과 장애인전용 보장성보험료를 냈다면 두 보험료에 별도 한도를 적용한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "건강보험료는 소득공제 항목이다. 일반보장성보험료 min(50,100)×12%＝6만원, 장애인전용 min(300,100)×15%＝15만원.\n배우자의 대학원 등록금은 배우자 교육비 대상에서 제외한다. 직계존속의 일반 대학 등록금도 제외한다. 고교생의 사설 영어학원비는 공제대상이 아니다.\n고교 교복은 학생당 50만원 한도, 중학교 방과후 특별활동비 200만원은 대상이다. 교육비 공제는 (50＋200)×15%＝37.5만원. 합계 6＋15＋37.5＝58.5만원.\n585,000원 · ②"
    source: "세무사 1차 2022년 54번 · 보험료·교육비 세액공제 · 2026.11.1. 기준 · 소득세 교재 405~406·409~411쪽. 소득세법 제52조·제59조의4, 시행령 제118조의4·제118조의6."
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제2장 납세의무 및 과세소득의 범위"
    statement: "국내 거소 183일 기준으로 거주자가 되는 비거주자는 그 기간이 183일이 되는 날에 거주자가 된다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "국내 거소일수는 한 과세기간 중 183일 이상인지, 또는 두 과세기간에 걸쳐 계속하여 183일 이상인지를 본다. 국내 주소를 두거나 주소가 있는 것으로 보는 요건을 먼저 충족하면 해당 사유 발생일에 전환한다."
    source: "세무사 1차 2022년 55번 · 거주자 전환·납세지·신탁 · 2026.11.1. 기준 · 소득세 교재 9~15·20~22쪽. 소득세법 제1조의2·제2조의3·제6조·제10조, 시행령 제2조의2·제4조·제4조의2. · ①"
    referenceYear: 2026
    tags: ["소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제2장 납세의무 및 과세소득의 범위"
    statement: "비거주자의 납세지가 바뀌면 원칙적으로 변경일부터 15일 이내에 변경 후 관할 세무서장에게 신고한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "기한은 변경일부터 15일, 신고할 관서는 새 납세지 관할이다. 법정 전입신고 등으로 갈음되는 경우가 있다."
    source: "세무사 1차 2022년 55번 · 거주자 전환·납세지·신탁 · 2026.11.1. 기준 · 소득세 교재 9~15·20~22쪽. 소득세법 제1조의2·제2조의3·제6조·제10조, 시행령 제2조의2·제4조·제4조의2. · ②"
    referenceYear: 2026
    tags: ["소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제2장 납세의무 및 과세소득의 범위"
    statement: "거주자의 사업소득에 대한 소득세 납세지는 원칙적으로 주된 사업장 소재지다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "개인 거주자의 소득세 납세지는 주소지, 주소가 없으면 거소지다. 사업장 소재지로 지정되는 경우를 원칙과 구별한다."
    source: "세무사 1차 2022년 55번 · 거주자 전환·납세지·신탁 · 2026.11.1. 기준 · 소득세 교재 9~15·20~22쪽. 소득세법 제1조의2·제2조의3·제6조·제10조, 시행령 제2조의2·제4조·제4조의2. · ③"
    referenceYear: 2026
    tags: ["소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제2장 납세의무 및 과세소득의 범위"
    statement: "신탁재산 귀속소득의 수익자가 특별히 정해지지 않았다면 위탁자에게 소득이 귀속되는 것으로 본다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "수익자 불특정만으로 위탁자에게 귀속시키던 근거가 삭제됐다. 현행 위탁자 과세는 위탁자가 해지권 등으로 신탁재산을 실질 지배·통제하고 원본 수익자가 위탁자, 수익의 수익자가 배우자나 같은 주소·거소에서 생계를 같이하는 직계존비속(배우자 쪽 포함)인 경우다."
    source: "세무사 1차 2022년 55번 · 거주자 전환·납세지·신탁 · 2026.11.1. 기준 · 소득세 교재 9~15·20~22쪽. 소득세법 제1조의2·제2조의3·제6조·제10조, 시행령 제2조의2·제4조·제4조의2. · ④"
    referenceYear: 2026
    tags: ["소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제1편 제2장 납세의무 및 과세소득의 범위"
    statement: "거소일수 계산에서 일반적인 국내 체류 기간은 입국한 날의 다음 날부터 출국일까지다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "초일인 입국일은 제외하고 출국일을 포함한다. 명백히 일시적인 출국에는 별도 규정이 적용된다."
    source: "세무사 1차 2022년 55번 · 거주자 전환·납세지·신탁 · 2026.11.1. 기준 · 소득세 교재 9~15·20~22쪽. 소득세법 제1조의2·제2조의3·제6조·제10조, 시행령 제2조의2·제4조·제4조의2. · ⑤"
    referenceYear: 2026
    tags: ["소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제7편 제2장 종합소득 과세표준 확정신고"
    statement: "적법하게 연말정산된 공적연금소득만 있는 거주자도 반드시 종합소득 확정신고를 한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "공적연금소득만 있고 연말정산 등 요건을 갖추면 확정신고를 생략할 수 있다. 원천징수의무자가 정산을 하지 않은 경우 등은 별도로 판정한다."
    source: "세무사 1차 2022년 57번 · 확정신고·출국·분납 · 2026.11.1. 기준 · 소득세 교재 514·520~528·534~536쪽. 소득세법 제70조·제70조의2·제73조·제74조·제77조, 시행령 제133조의5·제140조. · ①"
    referenceYear: 2026
    tags: ["소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제7편 제2장 종합소득 과세표준 확정신고"
    statement: "확정신고 의무자가 국외로 주소·거소를 이전하려고 출국하면 출국일이 속하는 과세기간분은 출국일 전날까지 신고한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "주소·거소 이전을 위한 출국에는 출국 특례기한을 적용한다. 단기 여행은 이 규정의 출국에 해당하지 않는다."
    source: "세무사 1차 2022년 57번 · 확정신고·출국·분납 · 2026.11.1. 기준 · 소득세 교재 514·520~528·534~536쪽. 소득세법 제70조·제70조의2·제73조·제74조·제77조, 시행령 제133조의5·제140조. · ②"
    referenceYear: 2026
    tags: ["소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제7편 제2장 종합소득 과세표준 확정신고"
    statement: "종합소득금액이 있는 일반 거주자는 소득공제 후 과세표준이 없으면 확정신고 의무가 없다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "과세표준이 없거나 결손금이 있는 경우도 신고 규정 적용 대상이다. 확정신고 생략 대상인지는 별개로 판단한다."
    source: "세무사 1차 2022년 57번 · 확정신고·출국·분납 · 2026.11.1. 기준 · 소득세 교재 514·520~528·534~536쪽. 소득세법 제70조·제70조의2·제73조·제74조·제77조, 시행령 제133조의5·제140조. · ③"
    referenceYear: 2026
    tags: ["소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제7편 제2장 종합소득 과세표준 확정신고"
    statement: "세무사 자신이 성실신고확인대상사업자이면 자신의 사업소득에 대한 확인서를 직접 작성·제출할 수 있다."
