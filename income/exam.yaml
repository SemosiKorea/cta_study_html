    source: "세무사 1차 2023년 54번 · 기타소득의 유형과 전환 · 2026.11.1. 기준 · 소득세 교재 185~192·195~197쪽. 소득세법 제21조·제37조, 시행령 제41조·제87조. · ⑤"
