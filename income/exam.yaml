    source: "세무사 1차 2023년 53번 · 미지급 소득별 원천징수 시기 · 2026.11.1. 기준 · 소득세 교재 78·687~689쪽. 소득세법 제131조·제135조·제145조의2·제147조, 시행령 제46조·제191조. · ⑤"
