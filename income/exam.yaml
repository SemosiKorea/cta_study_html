  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제2장 배당소득"
    statement: "제조업을 하는 거주자의 종합소득금액에 합산할 금융소득금액을 계산하라.\n\n금액 단위 만원. 외상매출금 지급기일 연장이자 700 중 300은 소비대차로 전환한 매출금에서 발생했다. 파생결합사채(ELB) 분배금은 450이다.\n비상장 A사 주식발행초과금 자본전입 무상주 800 중 자기주식 미배정으로 지분율이 높아진 부분은 350이다. 비상장 B사 자기주식처분이익 자본전입 무상주는 1,000이다.\n비상장 C사의 직전 사업연도 이익에 대해 배당으로 소득처분한 금액은 1,750이다. 결산확정일은 해당 과세기간 3월 15일이다. 금액은 원천징수 전이다.\n\n계산 후 판단　가산 대상 배당 전액에 10%를 곱해 더한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "소비대차로 바뀐 300만 이자소득이다. 나머지 400은 제조업의 사업소득이다. ELB 분배금 450은 배당소득이다.\nA사는 주식발행초과금 전입 자체를 제외하고 자기주식 미배정분 350만 의제배당한다. B사의 1,000과 결산확정일이 해당 연도인 인정배당 1,750을 더한다.\n가산 전 3,850 = 300 + 450 + 350 + 1,000 + 1,750. 가산대상 배당은 B·C 합계 2,750이다. min(2,750, 3,850 − 2,000) × 10% = 185. 합산액은 4,035만원이다.\n40,350,000원 · ③"
    source: "세무사 1차 2025년 51번 · 금융소득 종합과세와 배당가산 · 2026.11.1. 기준 · 소득세법 제14조·제16조·제17조, 시행령 제45조·제46조 · 교재 31, 60, 62, 71~82쪽"
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2025기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제2편 제6장 기타소득"
    statement: "종합과세할 기타소득금액과 기납부세액으로 뺄 기타소득 원천징수세액을 각각 구하라.\n\n금액 단위 만원. 산업재산권 대여료 400, 뇌물 3,000 중 법원 판결로 몰수된 금액 2,000. 주택매매 위약금 250 중 계약금을 위약금으로 대체한 금액 200.\n주택입주 지체상금 800. 연금계좌 연금외수령액 300. 특수관계가 없는 직원의 직무발명보상금은 2월 재직 중 600, 10월 퇴직 후 400. 입증된 필요경비는 없고 원천징수는 적법했다.\n\n계산 후 판단　위약금으로 대체된 계약금도 종합과세 기타소득금액에 들어간다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "산업재산권 400 × (1 − 60%) = 160. 뇌물은 몰수분을 빼고 1,000을 합산하되 원천징수에서는 제외한다.\n주택매매 위약금 250은 모두 합산하고, 계약금 대체분을 뺀 50만 원천징수한다. 주택입주 지체상금은 800 × (1 − 80%) = 160이다.\n연금외수령액은 분리과세한다. 직무발명보상금 연 700 비과세 한도에서 재직 중 600이 먼저 쓰여 퇴직 후 400 중 300이 과세된다.\n종합과세 160 + 1,000 + 250 + 160 + 300 = 1,870만원. 원천징수 (160 + 50 + 160 + 300) × 20% = 134만원.\n기타소득금액 18,700,000원 · 기납부세액 1,340,000원 · ④"
    source: "세무사 1차 2025년 52번 · 기타소득과 원천징수세액 · 2026.11.1. 기준 · 소득세법 제12조·제14조·제21조·제127조·제129조, 시행령 제87조 · 교재 182~204쪽"
    referenceYear: 2026
    tags: ["소득세", "기출계산", "2025기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "소득세 제9편 제1장 퇴직소득의 의의 및 범위"
    statement: "사례의 근무일자를 유지하고 현행 산식으로 임원퇴직소득 한도와 퇴직소득금액을 계산하라.\n\n2011.1.20. 입사, 2025.2.20. 퇴직. 회사 지급 퇴직금 4억 5,000만원, 위로금 1,400만원. 국민연금법상 과세 일시금 2,000만원.\n2019년 말 기준 3년 평균 총급여 9,600만원, 퇴직일 기준 3년 평균 1억 2,000만원. 2011년 말 퇴직을 가정한 정관 위임 규정상 퇴직급여는 3,500만원. 근로소득을 최소화하는 방법을 고른다.\n\n계산 후 판단　국민연금 과세 일시금은 회사가 지급한 임원퇴직급여 한도 계산에 넣는다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "2012~2019년분은 9,600만원 × 1/10 × 96/12 × 3 = 2억 3,040만원. 2020년 이후분은 1억 2,000만원 × 1/10 × 62/12 × 2 = 1억 2,400만원. 한도 합계 3억 5,440만원.\n회사 지급액 4억 6,400만원의 2011년 이전분을 근무기간으로 안분하면 3,500만원 미만이다(2011년분 12개월, 전체 14년 초과). 규정에 따른 3,500만원을 선택한다.\n근로소득으로 옮기는 초과액은 4억 6,400만 − 3,500만 − 3억 5,440만 = 7,460만원. 퇴직소득은 3억 5,440만 + 3,500만 + 공적연금 일시금 2,000만 = 4억 940만원.\n한도 354,400,000원 · 퇴직소득금액 409,400,000원 · ⑤"
