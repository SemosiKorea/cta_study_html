cards:
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제1장 양도소득세 납세의무"
    statement: "국외로 주소·거소를 이전하려고 출국하는 거주자는 출국 당일부터 비거주자가 된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "국외 이전을 위한 출국은 그 다음 날이 비거주자로 바뀌는 날이다."
    source: "2026 양도소득세 · 제1장 양도소득세 납세의무 · 교재 4쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "도시개발법상 환지로 지목이 바뀌면 청산금을 받지 않아도 그 환지 전체를 양도로 본다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "법정 환지로 인해 지목이 바뀐 부분은 양도가 아니다. 권리면적 감소 대가로 청산금을 받는 부분은 별도로 양도를 판단한다."
    source: "2026 양도소득세 · 제2장 양도소득세 과세원인 · 교재 18쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제3장 양도소득세 과세대상 자산"
    statement: "상가 임차인 민수는 영업권이나 시설 권리금 없이, 등기하지 않은 부동산임차권만 유상으로 넘겼다. 이 권리는 양도소득세 과세대상인 부동산임차권에 해당한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "소득세법이 부동산에 관한 권리로 열거한 임차권에는 등기가 필요하다. 같은 임차권이라도 등기 후 양도했다면 이 요건을 충족한다."
    source: "2026 양도소득세 · 제3장 양도소득세 과세대상 자산 · 교재 42쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제4장 취득 또는 양도의 시기"
    statement: "통상적인 토지 매매에서 6월 10일 소유권이전등기를 접수하고 6월 17일 잔금을 모두 받았다. 이 거래의 양도일은 6월 10일이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "잔금 청산 전에 등기를 접수했으므로 접수일을 쓴다. 반대로 잔금을 먼저 받고 그 뒤에 등기했다면 확인된 잔금 청산일을 적용한다."
    source: "2026 양도소득세 · 제4장 취득 또는 양도의 시기 · 교재 72쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제1장 기준시가 개요"
    statement: "특수관계가 없는 두 사람이 시가대로 토지를 거래했고 취득·양도의 실제 금액도 계약서와 계좌내역으로 확인된다. 양도인은 세금이 더 적다는 이유로 양쪽 모두 기준시가를 선택할 수 있다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "실제 거래가액이 확인되는 이 거래는 그 금액으로 차익을 계산한다. 실가를 확인하기 어려워 법정 추계요건을 충족하는 경우 등과 구분한다."
    source: "2026 양도소득세 · 제1장 기준시가 개요 · 교재 90쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제2장 토지의 기준시가"
    statement: "10년 전에 산 일반 토지 100㎡를 판다. 양도일 현재 적용되는 개별공시지가는 ㎡당 40만원으로 취득 당시와 다르고, 별도 배율은 없다. 45만원으로 오른 가격은 양도 후 고시됐다. 양도일 기준시가는 4,000만원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "양도일에 이미 고시된 단가를 적용하므로 100㎡ × 40만원이다. 새 가격이 양도일 전에 고시됐다면 적용 단가가 45만원으로 바뀐다."
    source: "2026 양도소득세 · 제2장 토지의 기준시가 · 교재 93쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제3장 건물의 기준시가"
    statement: "일반건물 기준시가의 신축가격·구조 등 지수로 산출한 금액에는 부수토지가 포함된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "그 산식은 일반건물 부분만 평가한다. 부수토지를 별도로 평가하고, 일괄고시 주택·일부 상가는 통합 공시가를 쓴다."
    source: "2026 양도소득세 · 제3장 건물의 기준시가 · 교재 104쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제4장 주택(개별·공동)의 기준시가"
    statement: "단독주택 한 채와 그 부수토지 전부를 함께 판다. 양도일 현재 개별주택가격이 4억원이고 부수토지 개별공시지가가 1억원이면, 주택 전체의 기준시가는 5억원이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "공시된 개별주택가격 4억원에 토지 값이 포함되어 있다. 부수토지의 개별공시지가를 다시 더하면 한 번 더 계산하게 된다."
    source: "2026 양도소득세 · 제4장 주택(개별·공동)의 기준시가 · 교재 122쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제5장 오피스텔 및 상업용 건물의 기준시가"
    statement: "한 건물 안에서 상가를 구분소유한 지연은 자기 호가 국세청의 토지·건물 일괄고시 대상에 포함된 것을 확인했다. 해당 호의 고시가액에는 대지 지분의 가액도 들어 있다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "지정·고시된 구분소유 상가에는 해당 호의 토지·건물 일괄가액을 쓴다. 고시 대상이 아닌 상가라면 토지분과 건물분의 기준시가를 따로 산정한다."
    source: "2026 양도소득세 · 제5장 오피스텔 및 상업용 건물의 기준시가 · 교재 129쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제6장 부동산의 기준시가 계산시 공통적용 사항"
    statement: "기준시가 조정산식이 적용되는 토지를 취득연도의 다음 해 말 전에 팔았다. 새 고시 없이 취득 시 기준시가가 1억원이고 전기 기준시가는 1억 2천만원이면, 양도 시 기준시가는 1억원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "전기 값이 취득 시 값보다 높으므로 차액을 음수로 반영하지 않는다. 전기 값이 더 낮으면 상승분을 보유월수 비율만큼 가산하는지를 본다."
    source: "2026 양도소득세 · 제6장 부동산의 기준시가 계산시 공통적용 사항 · 교재 134쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제7장 시설물이용권의 기준시가"
    statement: "지수가 보유한 콘도회원권의 지방세 시가표준액은 3,000만원이다. 특수관계가 없는 매수인에게 3,800만원을 받고 팔았고 실가가 확인되어도 양도가액은 3,000만원이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "시가표준액은 이 회원권의 기준시가를 정할 때 쓴다. 실제 3,800만원을 받은 것이 확인되는 통상 매매에서는 그 금액이 양도가액이다."
    source: "2026 양도소득세 · 제7장 시설물이용권의 기준시가 · 교재 137쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제8장 주식 등의 기준시가"
    statement: "양도소득세상 상장주식 기준시가는 원칙적으로 양도일 전후 각 2개월의 종가 평균이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "양도 기준시가는 양도일 이전 1개월간 매일 공표된 최종시세 평균이 원칙이다. 상속·증여 평가기간과 구별한다."
    source: "2026 양도소득세 · 제8장 주식 등의 기준시가 · 교재 145쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제9장 부동산에 관한 권리의 기준시가"
    statement: "분양대금 4억원 중 양도일까지 낸 금액은 모두 합해 8,000만원이다. 양도일 현재 프리미엄이 2,000만원이라면 이 분양권의 기준시가는 1억원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "평가일까지 납부한 8,000만원과 그날의 프리미엄 2,000만원을 합친다. 남은 분양대금은 납부 전이므로 포함하지 않는다."
    source: "2026 양도소득세 · 제9장 부동산에 관한 권리의 기준시가 · 교재 154쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제10장 신주인수권의 기준시가"
    statement: "행사기간이 아직 오지 않은 분리형 신주인수권증권을 법정 할인방식으로 평가했다. 두 현재가치의 차가 −2만원이므로 이 증권의 기준시가도 −2만원이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "행사 전 분리된 신주인수권증권은 두 할인 가액의 차가 음수이면 0원이다. 행사할 수 있는 기간이 되면 주식을 인수해 얻는 가치도 비교한다."
    source: "2026 양도소득세 · 제10장 신주인수권의 기준시가 · 교재 156쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제11장 영업권의 기준시가"
    statement: "사업용 부동산과 함께 넘긴 과세대상 영업권을 평가한다. 연간 자기자본 정상수익 초과이익이 1,000만원이고 지속연수가 5년이면 현재가치 할인 없이 5,000만원이 기준시가다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "각 연도의 초과이익을 현재가치로 할인한 뒤 합산한다. 해마다 1,000만원씩 같아도 5년 뒤의 1,000만원을 첫해와 같은 값으로 합치지 않는다."
    source: "2026 양도소득세 · 제11장 영업권의 기준시가 · 교재 158쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제12장 신탁수익권의 기준시가"
    statement: "원본과 수익의 수익자가 같은 신탁은 해지 일시금이 신탁재산가액보다 커도 항상 신탁재산가액으로 평가한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "신탁재산가액과 평가기준일에 해지 등으로 받을 일시금 중 더 큰 값을 적용한다."
    source: "2026 양도소득세 · 제12장 신탁수익권의 기준시가 · 교재 160쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제1장 양도소득세액 계산흐름"
    statement: "다른 거래가 없는 사람이 토지에서 양도차익 5,000만원을 얻었다. 적용할 장기보유특별공제가 800만원이고 기본공제가 250만원이라면, 이 거래의 양도소득금액은 4,200만원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "양도소득금액은 5,000만원에서 장기보유특별공제 800만원을 뺀 금액이다. 기본공제까지 뺀 3,950만원은 과세표준을 물었을 때의 답이다."
    source: "2026 양도소득세 · 제1장 양도소득세액 계산흐름 · 교재 164쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제2장 양도차익 산정방법"
    statement: "토지의 실제 취득가액을 확인할 수 없어 적법하게 추계한다. 법정 요건을 충족하는 매매사례가액이 있는데도 납세자는 환산취득가액이 크다는 이유로 이를 먼저 적용할 수 있다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "추계 사유가 있어도 가액 선택은 임의가 아니다. 이 토지에 적용 가능한 매매사례가액이 있으면 그 금액이 감정가액이나 환산취득가액보다 앞선다."
