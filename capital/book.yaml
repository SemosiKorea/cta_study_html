cards:
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제1장 양도소득세 납세의무"
    statement: "국외로 주소·거소를 이전하려고 출국하는 거주자는 출국 당일부터 비거주자가 된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "국외 이전을 위한 출국은 그 다음 날이 비거주자로 바뀌는 날이다."
    source: "2026 양도소득세 · 제1장 양도소득세 납세의무 · 교재 4쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제1장 양도소득세 납세의무"
    statement: "호주에 거주하는 비거주자 갑이 서울에 있는 토지를 팔았다. 매매대금을 호주 계좌로 받았으므로 국내원천 양도소득에서 제외된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "부동산은 소재지가 기준입니다. 대금을 국외에서 받아도 국내 토지의 양도소득은 국내원천입니다."
    source: "2026 양도소득세 · 제1편 · 교재 4쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "도시개발법상 환지로 지목이 바뀌면 청산금을 받지 않아도 그 환지 전체를 양도로 본다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "법정 환지로 인해 지목이 바뀐 부분은 양도가 아니다. 권리면적 감소 대가로 청산금을 받는 부분은 별도로 양도를 판단한다."
    source: "2026 양도소득세 · 제2장 양도소득세 과세원인 · 교재 18쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "갑은 시가 6억원인 아파트를 자녀에게 주면서 담보대출 2억원을 자녀가 실제 인수하게 했다. 다른 부인 사유가 없다면 유상으로 보는 부분은 2억원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "수증자가 부담한 증여자의 채무 부분만 양도로 봅니다. 나머지는 무상으로 이전한 부분입니다."
    source: "2026 양도소득세 · 제1편 · 교재 18쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제3장 양도소득세 과세대상 자산"
    statement: "상가 임차인 민수는 영업권이나 시설 권리금 없이, 등기하지 않은 부동산임차권만 유상으로 넘겼다. 이 권리는 양도소득세 과세대상인 부동산임차권에 해당한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "소득세법이 부동산에 관한 권리로 열거한 임차권에는 등기가 필요하다. 같은 임차권이라도 등기 후 양도했다면 이 요건을 충족한다."
    source: "2026 양도소득세 · 제3장 양도소득세 과세대상 자산 · 교재 42쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제3장 양도소득세 과세대상 자산"
    statement: "국내 상장법인의 일반 소액주주가 법정 예외에 해당하지 않는 장외거래로 주식을 양도했다. 소액주주라는 이유만으로 양도세 과세대상에서 제외된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "국내 상장 소액주주의 통상적인 과세 제외는 장내거래를 전제로 합니다. 장외 양도는 과세대상에 들어갑니다."
    source: "2026 양도소득세 · 제1편 · 교재 50쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제4장 취득 또는 양도의 시기"
    statement: "통상적인 토지 매매에서 6월 10일 소유권이전등기를 접수하고 6월 17일 잔금을 모두 받았다. 이 거래의 양도일은 6월 10일이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "잔금 청산 전에 등기를 접수했으므로 접수일을 쓴다. 반대로 잔금을 먼저 받고 그 뒤에 등기했다면 확인된 잔금 청산일을 적용한다."
    source: "2026 양도소득세 · 제4장 취득 또는 양도의 시기 · 교재 72쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제4장 취득 또는 양도의 시기"
    statement: "갑은 직접 지은 건물을 6월 1일부터 실제로 사용했고 사용승인서는 6월 15일 교부됐다. 다른 특례가 없으면 취득일은 6월 1일이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "사용승인 전에 실제 사용하면 그 사실상 사용일을 취득시기로 봅니다."
    source: "2026 양도소득세 · 제1편 · 교재 77쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제1장 기준시가 개요"
    statement: "특수관계가 없는 두 사람이 시가대로 토지를 거래했고 취득·양도의 실제 금액도 계약서와 계좌내역으로 확인된다. 양도인은 세금이 더 적다는 이유로 양쪽 모두 기준시가를 선택할 수 있다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "실제 거래가액이 확인되는 이 거래는 그 금액으로 차익을 계산한다. 실가를 확인하기 어려워 법정 추계요건을 충족하는 경우 등과 구분한다."
    source: "2026 양도소득세 · 제1장 기준시가 개요 · 교재 90쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제1장 기준시가 개요"
    statement: "토지와 건물의 총 실지거래가액은 5억원이고 개별 대가는 구분되지 않는다. 기준시가 안분 대상이고 토지와 건물 기준시가의 비율은 3 대 2라면 토지에 배분할 실가는 3억원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "총 실가는 그대로 사용합니다. 기준시가는 배분 비율이므로 토지분은 5억원 × 3/5입니다."
    source: "2026 양도소득세 · 제2편 · 교재 90쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제2장 토지의 기준시가"
    statement: "10년 전에 산 일반 토지 100㎡를 판다. 양도일 현재 적용되는 개별공시지가는 ㎡당 40만원으로 취득 당시와 다르고, 별도 배율은 없다. 45만원으로 오른 가격은 양도 후 고시됐다. 양도일 기준시가는 4,000만원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "양도일에 이미 고시된 단가를 적용하므로 100㎡ × 40만원이다. 새 가격이 양도일 전에 고시됐다면 적용 단가가 45만원으로 바뀐다."
    source: "2026 양도소득세 · 제2장 토지의 기준시가 · 교재 93쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제2장 토지의 기준시가"
    statement: "분할로 새로 생긴 필지에 개별공시지가가 없다. 해당 필지의 면적이 확인돼도 공시될 때까지 기준시가는 0원이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "관할 세무서장이 지목과 이용상황 등이 비슷한 인근토지를 기준으로 평가합니다."
    source: "2026 양도소득세 · 제2편 · 교재 93쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제3장 건물의 기준시가"
    statement: "일반건물 기준시가의 신축가격·구조 등 지수로 산출한 금액에는 부수토지가 포함된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "그 산식은 일반건물 부분만 평가한다. 부수토지를 별도로 평가하고, 일괄고시 주택·일부 상가는 통합 공시가를 쓴다."
    source: "2026 양도소득세 · 제3장 건물의 기준시가 · 교재 104쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제3장 건물의 기준시가"
    statement: "일괄고시 대상이 아닌 상가에서 일반건물 산식으로 9천만원을 구했고 토지 기준시가는 6천만원이다. 토지·건물 기준시가 합계는 9천만원이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "일반건물 산식은 부수토지를 포함하지 않습니다. 합계는 9천만원 + 6천만원 = 1억5천만원입니다."
    source: "2026 양도소득세 · 제2편 · 교재 104쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제4장 주택(개별·공동)의 기준시가"
    statement: "단독주택 한 채와 그 부수토지 전부를 함께 판다. 양도일 현재 개별주택가격이 4억원이고 부수토지 개별공시지가가 1억원이면, 주택 전체의 기준시가는 5억원이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "공시된 개별주택가격 4억원에 토지 값이 포함되어 있다. 부수토지의 개별공시지가를 다시 더하면 한 번 더 계산하게 된다."
    source: "2026 양도소득세 · 제4장 주택(개별·공동)의 기준시가 · 교재 122쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제4장 주택(개별·공동)의 기준시가"
    statement: "최초 공시가격이 5억원인 주택을 공시 전에 취득했다. 취득 당시 토지·건물 기준시가 합계가 2억원, 최초 공시 당시 합계가 4억원이면 환산한 취득 기준시가는 2억5천만원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "최초 공시가격에 두 시점의 기준시가 합계 비율을 곱합니다. 5억원 × 2/4 = 2억5천만원입니다."
    source: "2026 양도소득세 · 제2편 · 교재 122쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제5장 오피스텔 및 상업용 건물의 기준시가"
    statement: "한 건물 안에서 상가를 구분소유한 지연은 자기 호가 국세청의 토지·건물 일괄고시 대상에 포함된 것을 확인했다. 해당 호의 고시가액에는 대지 지분의 가액도 들어 있다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "지정·고시된 구분소유 상가에는 해당 호의 토지·건물 일괄가액을 쓴다. 고시 대상이 아닌 상가라면 토지분과 건물분의 기준시가를 따로 산정한다."
    source: "2026 양도소득세 · 제5장 오피스텔 및 상업용 건물의 기준시가 · 교재 129쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제5장 오피스텔 및 상업용 건물의 기준시가"
    statement: "같은 상가의 옆 동·호는 일괄고시됐지만 평가 대상 호는 일괄고시 대상이 아니다. 옆 호의 고시 단가를 그대로 가져와 평가한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "대상 호가 고시됐는지를 확인합니다. 일괄고시 대상이 아니면 토지와 일반건물을 구분해 평가합니다."
    source: "2026 양도소득세 · 제2편 · 교재 129쪽"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제6장 부동산의 기준시가 계산시 공통적용 사항"
    statement: "기준시가 조정산식이 적용되는 토지를 취득연도의 다음 해 말 전에 팔았다. 새 고시 없이 취득 시 기준시가가 1억원이고 전기 기준시가는 1억 2천만원이면, 양도 시 기준시가는 1억원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "전기 값이 취득 시 값보다 높으므로 차액을 음수로 반영하지 않는다. 전기 값이 더 낮으면 상승분을 보유월수 비율만큼 가산하는지를 본다."
    source: "2026 양도소득세 · 제6장 부동산의 기준시가 계산시 공통적용 사항 · 교재 134쪽부터 · 2026.11.1. 기준"
