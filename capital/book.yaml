schema: hoedok.cards/v1
cards:
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제1장 양도소득세 납세의무"
    statement: "국외로 주소·거소를 이전하려고 출국하는 거주자는 출국 당일부터 비거주자가 된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "국외 이전을 위한 출국은 그 다음 날이 비거주자로 바뀌는 날이다."
    source: "2026 양도소득세 · 제1장 양도소득세 납세의무 · 교재 4쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "도시개발법상 환지로 지목이 바뀌면 청산금을 받지 않아도 그 환지 전체를 양도로 본다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "법정 환지로 인해 지목이 바뀐 부분은 양도가 아니다. 권리면적 감소 대가로 청산금을 받는 부분은 별도로 양도를 판단한다."
    source: "2026 양도소득세 · 제2장 양도소득세 과세원인 · 교재 18쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제3장 양도소득세 과세대상 자산"
    statement: "사실상 지목의 토지, 건축물 및 부속 시설, 분양권 등 취득권리, 지상권·전세권·등기된 부동산임차권이 열거된다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "임차권은 등기 여부를 본다. 분양권 매각과 준공·잔금 후 취득한 건물 매각은 자산 종류 및 세율이 달라진다."
    source: "2026 양도소득세 · 제3장 양도소득세 과세대상 자산 · 교재 42쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제4장 취득 또는 양도의 시기"
    statement: "원칙은 대금청산일이다. 청산일 불명 또는 청산 전 소유권이전등기이면 등기접수일을 쓴다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "장기할부조건이면 소유권이전등기접수일·인도일·사용수익일 중 빠른 날, 상속은 상속개시일, 증여는 증여취득일이다. 토지거래허가 전 대금청산은 양도시기와 예정신고기산점을 나눠 판단한다."
    source: "2026 양도소득세 · 제4장 취득 또는 양도의 시기 · 교재 72쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제1장 기준시가 개요"
    statement: "실거래액이 원칙이다. 기준시가는 환산취득가액·필요경비 개산공제, 일괄가액 안분, 법정 추계 등에 쓰인다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "토지·건물 별도평가인지, 주택·특정 오피스텔처럼 토지와 건물을 통합한 고시인지 분기한다. 고시일 전후로 평가에 쓸 값이 달라진다."
    source: "2026 양도소득세 · 제1장 기준시가 개요 · 교재 90쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제2장 토지의 기준시가"
    statement: "양도·취득일 현재 고시된 ㎡당 개별공시지가에 면적을 곱한다. 공시지가가 없으면 관할 세무서장이 인근 유사토지와 비교평가한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "국세청장의 배율지정이 있으면 지정 배율을 추가한다. 최초 고시(1990.8.30.) 전 취득분은 당시 토지등급가액으로 소급 환산한다. 1990년 기준 개별공시지가 × 취득 당시 시가표준액 ÷ [(1990.8.30. 당시 값 + 그 직전 값) ÷ 2]"
    source: "2026 양도소득세 · 제2장 토지의 기준시가 · 교재 93쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제3장 건물의 기준시가"
    statement: "일반건물 기준시가의 신축가격·구조 등 지수로 산출한 금액에는 부수토지가 포함된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "그 산식은 일반건물 부분만 평가한다. 부수토지를 별도로 평가하고, 일괄고시 주택·일부 상가는 통합 공시가를 쓴다."
    source: "2026 양도소득세 · 제3장 건물의 기준시가 · 교재 104쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제4장 주택(개별·공동)의 기준시가"
    statement: "개별·공동주택은 부수토지를 포함한 공시가격을 쓴다. 미공시이면 유사주택 및 비교표 등을 이용한 관할 세무서 평가를 적용한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "최초 공시 전 취득은 최초 공시가격을 토지·건물 기준시가 합계 비율로 환산한다. 취득시기가 다르거나 비주거 부분이 있으면 지분·용도별 가액을 나눈다. 취득 기준시가 = 최초 공시가격 × 취득 당시 토지·건물 기준시가 합계 ÷ 최초 공시 당시 합계"
    source: "2026 양도소득세 · 제4장 주택(개별·공동)의 기준시가 · 교재 122쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제5장 오피스텔 및 상업용 건물의 기준시가"
    statement: "국세청장이 지정·고시한 구분소유 상업용건물·오피스텔은 토지와 건물을 일괄평가한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "주소·동·호의 고시 여부와 기준일을 확인한다. 고시되지 않은 건물은 토지 개별공시지가와 일반건물 기준시가를 각각 구한다. 고시된 호별 ㎡당 기준시가 × 해당 고시의 산정면적"
    source: "2026 양도소득세 · 제5장 오피스텔 및 상업용 건물의 기준시가 · 교재 129쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제6장 부동산의 기준시가 계산시 공통적용 사항"
    statement: "취득 후 새 고시가 없어 전후 기준시가가 같으면 법정 조정산식을 검토한다. 적용할 과거값, 보유월수와 조정월수를 구분한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "취득연도 다음 해 말 이전 양도 유형에서 전기값이 취득값 이상이면 상승분을 가산하지 않는다. 수용·공매 등 양도가가 더 낮은 법정 경우는 실제 보상·경매가액 특례를 확인한다. 양도 기준시가 = 취득 기준시가 + (취득 기준시가 − 전기 기준시가) × 보유월수 ÷ 조정월수"
    source: "2026 양도소득세 · 제6장 부동산의 기준시가 계산시 공통적용 사항 · 교재 134쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제7장 시설물이용권의 기준시가"
    statement: "골프·콘도 등의 대상 시설물이용권은 지방세법의 시가표준액을 기준시가로 쓴다. 실가가 있으면 양도차익은 실가로 계산한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "취득 실가가 없으면 매매사례·감정·환산 순서다. 2009.2.4. 전 취득 골프회원권에는 종전 고시의 비율을 쓰는 연결 산식이 있다."
    source: "2026 양도소득세 · 제7장 시설물이용권의 기준시가 · 교재 137쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제8장 주식 등의 기준시가"
    statement: "양도소득세상 상장주식 기준시가는 원칙적으로 양도일 전후 각 2개월의 종가 평균이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "양도 기준시가는 양도일 이전 1개월간 매일 공표된 최종시세 평균이 원칙이다. 상속·증여 평가기간과 구별한다."
    source: "2026 양도소득세 · 제8장 주식 등의 기준시가 · 교재 145쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제9장 부동산에 관한 권리의 기준시가"
    statement: "분양권 등 취득권리는 평가일까지 납부한 금액과 그날의 프리미엄을 합한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "지상권·전세권·등기된 임차권은 해당 권리의 성질과 잔존기간 등을 반영한다. 지상권은 토지가액에 연 2%를 적용한 금액을 잔존기간에 걸쳐 현재가치로 환산한다."
    source: "2026 양도소득세 · 제9장 부동산에 관한 권리의 기준시가 · 교재 154쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제10장 신주인수권의 기준시가"
    statement: "행사 불가능 기간의 분리된 신주인수권은 발행이율로 할인한 만기상환금에서 적정할인율로 할인한 금액을 빼며 하한은 0이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "행사 가능 기간에는 위 평가와 실제 인수할 주식가액에서 배당차액 및 신주인수가액을 뺀 값을 비교하여 큰 쪽을 쓴다. 권리만인지 사채와 결합된 것인지 먼저 가른다."
    source: "2026 양도소득세 · 제10장 신주인수권의 기준시가 · 교재 156쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제11장 영업권의 기준시가"
    statement: "초과이익을 산출해 영업권 지속연수(원칙 5년) 동안 할인한다. 자기자본은 세법상 평가액을 기초로 계산한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "영업권이 과세대상 기타자산인지 먼저 확인한 뒤 기준시가가 필요할 때 평가한다. 기준시가 = 매년 자기자본 정상수익 초과이익의 현재가치 합계(교재 할인율 10%)"
    source: "2026 양도소득세 · 제11장 영업권의 기준시가 · 교재 158쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제2편 제12장 신탁수익권의 기준시가"
    statement: "원본과 수익의 수익자가 같은 신탁은 해지 일시금이 신탁재산가액보다 커도 항상 신탁재산가액으로 평가한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "신탁재산가액과 평가기준일에 해지 등으로 받을 일시금 중 더 큰 값을 적용한다."
    source: "2026 양도소득세 · 제12장 신탁수익권의 기준시가 · 교재 160쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제1장 양도소득세액 계산흐름"
    statement: "거래금액에서 취득원가·경비를 빼면 양도차익, 장기보유특별공제 후 양도소득금액, 기본공제 후 과세표준이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "자산별 계산 → 같은 소득 구분 안 손익 통산 → 기본공제 → 세율·세액감면 순서다. 양도소득금액을 물으면 기본공제를 빼지 않는다."
    source: "2026 양도소득세 · 제1장 양도소득세액 계산흐름 · 교재 164쪽부터 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["양도소득세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제2장 양도차익 산정방법"
    statement: "각 시점에 확인되는 실가를 우선한다. 법정 추계 사유가 있어 실가 확인이 어려우면 인정되는 매매사례가액·감정가액·환산취득가액·기준시가를 해당 시점과 자산에 맞게 적용한다."
    choices: ["O", "X", "?"]
    answer: "O"
