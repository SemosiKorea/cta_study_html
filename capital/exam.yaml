    subject: "세법학개론"
    unit: "양도소득세 제3편 제4장 취득가액 및 필요경비"
    statement: "가업상속공제를 받은 토지를 양도했다. 을의 양도소득금액을 원 단위로 구하라.\n\n부친 갑이 2014년 6월 5일 특수관계 법인으로부터 시가 600,000,000원인 토지를 400,000,000원에 취득·등기했고 차액에 법인세법상 소득처분이 있었다.\n을은 2021년 7월 10일 부친 사망으로 토지를 상속받았다. 당시 시가 1,200,000,000원, 가업상속공제율 60%다.\n을은 2025년 1월 15일 등기된 토지를 비특수관계인에게 1,600,000,000원에 양도했다. 증빙 있는 양도비는 24,000,000원이다. 3년 이상 4년 미만 공제율 6%, 10년 이상 11년 미만 공제율 20%다.\n\n계산 후 판단　일반 상속분에도 부친의 10년 보유 공제율 20%를 적용한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "갑의 세무상 취득가 = 실지 매입가 400,000,000 + 소득처분액 200,000,000 = 600,000,000원.\n가업상속공제 적용분 60%는 부친 취득가와 보유기간을 이어받는다. 차익 = (1,600,000,000 − 600,000,000 − 24,000,000) × 60% = 585,600,000. 장기보유공제 후 585,600,000 × (1 − 20%) = 468,480,000원.\n나머지 40%는 상속 시가 및 상속일부터 보유기간을 쓴다. 차익 = (1,600,000,000 − 1,200,000,000 − 24,000,000) × 40% = 150,400,000. 공제 후 150,400,000 × (1 − 6%) = 141,376,000원.\n양도소득금액 = 468,480,000 + 141,376,000 = 609,856,000원. 물은 것은 과세표준 전 단계이므로 기본공제를 빼지 않는다.\n609,856,000원 (②)"
    source: "세무사 1차 2025년 54번 · 가업상속 토지의 취득가와 보유기간 · 2026.11.1. 기준 · 교재 195~197, 231~237, 315~322쪽 · 소득세법 제95조·제97조의2 제4항, 시행령 제163조·제163조의2"
    referenceYear: 2026
    tags: ["양도소득세", "기출계산", "2025기출"]
