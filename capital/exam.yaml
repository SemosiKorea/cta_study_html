  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제8장 양도소득금액의 계산"
    statement: "한 해에 두 주식을 양도했다. 원 단위로 양도소득세 산출세액을 구하라.\n\n거주자 갑이 보유한 국내 비상장 제조 중소기업 A의 지분은 10%다. A주는 2017년 5월 7일 100,000,000원에 취득하여 2022년 12월 5일 500,000,000원에 양도했다.\n뉴욕증권거래소 상장 미국 비중소기업 B주는 2018년 8월 2일 148,000,000원에 취득하여 2022년 10월 3일 100,000,000원에 양도했다.\nA주 증권거래세 2,150,000원과 신고서 작성비용 3,350,000원, B주 위탁수수료 3,000,000원을 실제 지출했고 증빙이 있다. 두 회사 모두 부동산이 없고 양수인은 비특수관계인이다.\n현행법 연습의 거주기간 전제는 국외주식 양도일까지 계속 5년 이상 국내 주소·거소를 둔 경우다. 원문에는 거주자라고만 제시된다.\n\n계산 후 판단　국내주식과 국외주식에서 기본공제 250만 원씩을 각각 차감한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "A주 양도소득금액 = 500,000,000 − 100,000,000 − 2,150,000 − 3,350,000 = 394,500,000원. 신고서 작성비용도 직접 양도비에 포함한다.\nB주 양도차손 = 100,000,000 − 148,000,000 − 3,000,000 = −51,000,000원. 주식 구분 안에서 국내 이익과 국외 손실을 통산한다.\n과세표준 = 394,500,000 − 51,000,000 − 연간 기본공제 2,500,000 = 341,000,000원.\n비상장 중소기업 지분 10%는 비상장 지분율 기준 4% 이상인 대주주다. 300,000,000 × 20% + 41,000,000 × 25% = 70,250,000원. 이 사례에 중소기업 소액주주 10%를 적용하면 틀린다.\n70,250,000원 (②)"
    source: "세무사 1차 2022년 52번 · 국내 대주주 주식과 국외주식의 손익통산 · 2026.11.1. 기준 · 교재 50~55, 215~216, 323~328, 332~335쪽 · 소득세법 제94조·제97조·제102조~제104조, 시행령 제163조"
    referenceYear: 2026
    tags: ["양도소득세", "기출계산", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "도시개발법상 환지처분으로 토지의 지목이 바뀌면 양도다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "법정 환지로 지번·지목이 바뀌면 양도에서 제외한다. 면적 감소의 대가로 받은 청산금에 상당하는 부분은 별도 유상양도다."
    source: "세무사 1차 2022년 56번 · 유상이전·비과세·필요경비·예정신고 · 2026.11.1. 기준 · 교재 18~26, 70, 195~198, 372~375, 625~626쪽 · 소득세법 제88조·제89조·제97조·제105조, 시행령 제153조·제163조 · ①"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "국가사업으로 농지를 교환하고 두 농지가액의 차이가 큰 쪽 가액의 1/5이면 비과세다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "국가·지방자치단체 사업으로 인한 농지 교환·분합은 차액이 큰 쪽 가액의 1/4 이하면 비과세다. 1/5는 이 한도에 든다."
    source: "세무사 1차 2022년 56번 · 유상이전·비과세·필요경비·예정신고 · 2026.11.1. 기준 · 교재 18~26, 70, 195~198, 372~375, 625~626쪽 · 소득세법 제88조·제89조·제97조·제105조, 시행령 제153조·제163조 · ②"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "파산선고에 따른 처분에서 생긴 소득에 양도소득세를 부과한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "법 제89조가 파산선고로 인한 처분소득을 비과세 대상으로 열거한다."
    source: "세무사 1차 2022년 56번 · 유상이전·비과세·필요경비·예정신고 · 2026.11.1. 기준 · 교재 18~26, 70, 195~198, 372~375, 625~626쪽 · 소득세법 제88조·제89조·제97조·제105조, 시행령 제153조·제163조 · ③"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "소유권을 확보하려 지출한 취득 관련 소송비를 이미 종합소득의 필요경비에 산입했어도 양도차익 계산에서 다시 뺀다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "취득쟁송 관련 비용 중 이미 소득금액 계산에서 필요경비로 반영한 부분은 다시 공제할 수 없다."
    source: "세무사 1차 2022년 56번 · 유상이전·비과세·필요경비·예정신고 · 2026.11.1. 기준 · 교재 18~26, 70, 195~198, 372~375, 625~626쪽 · 소득세법 제88조·제89조·제97조·제105조, 시행령 제153조·제163조 · ④"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제1편 제2장 양도소득세 과세원인"
    statement: "과세대상 신탁수익권 양도의 예정신고기한은 양도일이 속한 반기 말일부터 2개월이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "제94조 제1항 제6호 신탁수익권은 양도월 말일부터 2개월이다. 반기 기준은 예정신고 대상 국내주식에 적용한다."
    source: "세무사 1차 2022년 56번 · 유상이전·비과세·필요경비·예정신고 · 2026.11.1. 기준 · 교재 18~26, 70, 195~198, 372~375, 625~626쪽 · 소득세법 제88조·제89조·제97조·제105조, 시행령 제153조·제163조 · ⑤"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2022기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제4장 취득가액 및 필요경비"
    statement: "미등기주택과 등기된 토지의 양도차익을 각각 구하라. 모든 수치는 원이다.\n\n미등기주택은 2014년 5월 취득, 2023년 7월 양도했다. 취득 시 실가 미상, 매매사례 287,000,000, 감정가 280,000,000, 기준시가 180,000,000이다. 양도 시 실가 500,000,000, 매매사례 410,000,000, 감정가 400,000,000, 기준시가 300,000,000이다. 자본적 지출·양도비는 8,000,000이다.\n토지는 2019년 4월 취득, 2023년 9월 양도했다. 취득 시 실가·사례가·감정가 모두 없고 기준시가는 30,000,000이다. 양도 시 실가와 감정가는 없고 매매사례가는 50,000,000, 기준시가는 60,000,000이다. 자본적 지출·양도비는 3,000,000이다.\n\n계산 후 판단　토지의 환산취득가액 2,500만 원에 실제 양도비 등 300만 원을 더하여 공제할 수 있다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "주택은 확인된 양도 실가 500,000,000과 취득 매매사례가 287,000,000을 쓴다. 감정가와 자본적 지출 실액을 더하지 않는다.\n미등기주택 개산공제 = 180,000,000 × 0.3% = 540,000. 차익 = 500,000,000 − 287,000,000 − 540,000 = 212,460,000.\n토지 양도가액은 매매사례가 50,000,000. 환산취득가액 = 50,000,000 × 30,000,000 ÷ 60,000,000 = 25,000,000.\n필요경비 = 큰 금액(25,000,000 + 30,000,000 × 3%, 실제 자본적 지출·양도비 3,000,000) = 25,900,000. 차익 = 50,000,000 − 25,900,000 = 24,100,000.\n주택 212,460,000원 · 토지 24,100,000원 (⑤)"
    source: "세무사 1차 2023년 55번 · 추계 취득가액과 개산공제 · 2026.11.1. 기준 · 교재 174~175, 191~194, 242, 255~256쪽 · 소득세법 제97조·제114조, 시행령 제163조·제176조의2"
    referenceYear: 2026
    tags: ["양도소득세", "기출계산", "2023기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제5편 제1장 양도소득세 신고·납부"
    statement: "일반적인 건물 매매의 예정신고는 양도월 말일부터 2개월 이내다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "건물은 부동산의 일반기한을 적용한다. 부담부증여에는 다른 기한을 쓴다."
    source: "세무사 1차 2023년 58번 · 예정신고 합산과 기한의 기산점 · 2026.11.1. 기준 · 교재 372~378, 403~406쪽 · 소득세법 제105조·제107조·제110조·제114조 · ①"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2023기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제5편 제1장 양도소득세 신고·납부"
    statement: "토지거래허가구역에서 허가 전에 대금을 청산하고 허가 후 지정이 해제됐다면 허가월 말일부터 2개월 내에 예정신고한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "원문의 순서는 대금 청산 → 허가 → 구역 해제다. 이때 기산점은 허가일이 속한 달의 말일이다. 허가 전 반대로 구역이 먼저 해제되면 해제일 기준이다."
    source: "세무사 1차 2023년 58번 · 예정신고 합산과 기한의 기산점 · 2026.11.1. 기준 · 교재 372~378, 403~406쪽 · 소득세법 제105조·제107조·제110조·제114조 · ②"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2023기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제5편 제1장 양도소득세 신고·납부"
    statement: "같은 해 누진세율 자산을 두 차례 이상 예정신고하면 이전 양도소득을 반드시 합산해야 한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "제107조 제2항상 두 번째 이후 예정신고에서 합산할 수 있다. 합산하지 않아 확정신고 예외에 해당하지 않으면 다음 해 5월에 합산 정산한다."
    source: "세무사 1차 2023년 58번 · 예정신고 합산과 기한의 기산점 · 2026.11.1. 기준 · 교재 372~378, 403~406쪽 · 소득세법 제105조·제107조·제110조·제114조 · ③"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2023기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제5편 제1장 양도소득세 신고·납부"
    statement: "예정신고 의무자가 무신고하면 관할 세무서장 또는 지방국세청장이 과세표준과 세액을 결정한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "무신고는 결정, 이미 신고한 내용에 탈루·오류가 있으면 경정한다."
    source: "세무사 1차 2023년 58번 · 예정신고 합산과 기한의 기산점 · 2026.11.1. 기준 · 교재 372~378, 403~406쪽 · 소득세법 제105조·제107조·제110조·제114조 · ④"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2023기출"]
