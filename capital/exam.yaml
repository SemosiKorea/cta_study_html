  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제9장 과세표준 및 산출세액"
    statement: "국내 자산만 있고 비과세·감면은 고려하지 않는다. 기본세율의 최고 구간 45%가 적용될 수 있다고 가정한다. 원문 양도월은 2025년 4월이다.\n비교 대상은 ① 3년 보유 등기 일반건물, ② 9개월 보유 미등기주택, ③ 1년 6개월 보유 분양권, ④ 3년 보유 비투기지역 비사업용 토지, ⑤ 조정대상지역 중과대상 3주택자가 1년 보유한 등기주택이다. 각 사례는 독립적이다.\n\n3년 보유한 등기 일반건물의 세율이 다섯 사례 중 가장 높다."
