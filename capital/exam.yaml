  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제6장 특수관계인 간의 부당행위계산"
    statement: "갑은 2023년 3월 1일 배우자·직계존비속이 아닌 특수관계인에게 증여했고 수증자가 10년 안에 제3자에게 양도했다.\n\n증여자가 직접 양도한 것으로 보아도 취득가액은 증여일의 평가액이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "증여자 직접 양도로 재구성하면 증여자 본래의 취득가액을 사용한다."
    source: "세무사 1차 2023년 60번 · 특수관계인 증여 후 우회양도 · 2026.11.1. 기준 · 교재 219~224, 268~270쪽 · 소득세법 제2조의2·제97조의2·제101조 · ①"
    referenceYear: 2026
    tags: ["양도소득세", "선지OX", "2023기출"]
  - type: "ox"
    subject: "세법학개론"
    unit: "양도소득세 제3편 제6장 특수관계인 간의 부당행위계산"
    statement: "갑은 2023년 3월 1일 배우자·직계존비속이 아닌 특수관계인에게 증여했고 수증자가 10년 안에 제3자에게 양도했다.\n\n증여자의 직접 양도로 보아 부과하는 양도소득세는 증여자와 수증자가 연대하여 납부한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "제2조의2가 제101조 제2항의 직접양도 의제에 대한 연대납세의무를 둔다."
    source: "세무사 1차 2023년 60번 · 특수관계인 증여 후 우회양도 · 2026.11.1. 기준 · 교재 219~224, 268~270쪽 · 소득세법 제2조의2·제97조의2·제101조 · ②"
