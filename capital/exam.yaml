    rationale: "수증자가 인수한 증여자의 담보채무 부분에 3개월 특례를 적용한다."
    source: "세무사 1차 2023년 58번 · 예정신고 합산과 기한의 기산점 · 2026.11.1. 기준 · 교재 372~378, 403~406쪽 · 소득세법 제105조·제107조·제110조·제114조 · ⑤"
