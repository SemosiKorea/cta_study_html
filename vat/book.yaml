  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제5절 과세기간"
    statement: "일반과세 소매업자가 3월 5일 사업자등록을 신청하고 4월 1일 영업을 시작했다. 첫 과세기간은 4월 1일부터 6월 30일까지다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "사업개시 전에 등록을 신청하면 신청일이 기산일입니다. 이 사례는 3월 5일부터 6월 30일까지입니다."
    source: "2026 부가가치세 · 제2장 · 교재 41쪽 · 부가가치세법 제5조"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제6절 납세지"
    statement: "주사업장 총괄납부 신청을 하면 종된 사업장도 본점의 사업자등록번호를 사용한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "총괄납부는 납부·환급 정산만 통합한다. 하나의 등록번호 사용은 사업자단위과세와 연결되는 효과다."
    source: "2026 부가가치세 교재 45쪽부터 · 제2장 총칙 · 제6절 납세지 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제6절 납세지"
    statement: "한 회사가 별도 창고를 재고의 보관·관리에만 쓰고 법정 하치장 설치신고를 마쳤다. 그 창고에서 판매하지 않는다면 별도 사업장으로 보지 않는다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "판매 기능이 있는 직매장과 보관 목적의 적격 하치장을 구별합니다."
    source: "2026 부가가치세 · 제2장 · 교재 45쪽 · 부가가치세법 제6조 · 부가가치세법 시행령 제8조 · 부가가치세법 시행령 제9조"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제7절 사업자등록"
    statement: "가구 공장이 3월 2일 생산을 시작하고 4월 20일 처음 납품했다. 사업을 시작한 뒤 등록한다면 등록 신청의 20일 기한은 4월 20일부터 계산한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "제조업은 제조를 시작한 3월 2일이 기준이다. 제조업 등의 별도 기준이 없는 업종은 재화나 용역을 공급하기 시작한 날을 본다."
    source: "2026 부가가치세 교재 59쪽부터 · 제2장 총칙 · 제7절 사업자등록 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제7절 사업자등록"
    statement: "공장이 4월 10일 생산을 시작해 5월 1일 제품을 처음 출고했다. 제조업의 사업개시일은 첫 출고일인 5월 1일이다."
    choices: ["O", "X", "?"]
