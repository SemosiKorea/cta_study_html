    unit: "부가가치세 제2장 제6절 납세지"
    statement: "주사업장 총괄납부 신청을 하면 종된 사업장도 본점의 사업자등록번호를 사용한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "총괄납부는 납부·환급 정산만 통합한다. 하나의 등록번호 사용은 사업자단위과세와 연결되는 효과다."
    source: "2026 부가가치세 교재 45쪽부터 · 제2장 총칙 · 제6절 납세지 · 2026.11.1. 기준"
