    subject: "세법학개론"
    unit: "부가가치세 제3장 제1절 재화의 공급"
    statement: "과세사업용 재화를 사적으로 사용해도 대금을 받지 않으면 부가가치세가 생길 수 없다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "매입세액이 공제된 자기생산·취득재화를 개인적으로 소비하는 등 법정 요건을 충족하면 간주공급이 된다."
    source: "2026 부가가치세 교재 81쪽부터 · 제3장 과세거래 · 제1절 재화의 공급 · 2026.11.1. 기준"
    referenceYear: 2026
