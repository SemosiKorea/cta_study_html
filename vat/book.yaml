    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "대가 없는 용역 공급은 원칙적으로 과세하지 않는다. 특수관계인 사업용 부동산 무상임대 등 법정 예외를 따진다."
    source: "2026 부가가치세 교재 106쪽부터 · 제3장 과세거래 · 제2절 용역의 공급 · 2026.11.1. 기준"
    referenceYear: 2026
