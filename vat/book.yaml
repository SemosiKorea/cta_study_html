  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제1장 제1절 부가가치세의 연혁"
    statement: "거래의 전 단계에서 매출 전체에 세율을 곱하고 앞 단계 세액을 공제하지 않아도 거래 단계 수는 총세부담에 영향을 주지 않는다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "매출세에 전단계 공제가 없으면 유통 단계가 늘수록 세액이 누적될 수 있다."
    source: "2026 부가가치세 교재 3쪽부터 · 제1장 총설 · 제1절 부가가치세의 연혁 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제1장 제1절 부가가치세의 연혁"
    statement: "제조사가 매입 없이 100만원에 소매점에 팔고, 소매점이 150만원에 소비자에게 팔았다. 모두 세금 별도 10% 과세이고 매입세액을 전액 공제한다면 두 사업자의 납부세액 합계는 15만원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "제조사 10만원, 소매점은 15만원 − 10만원 = 5만원입니다. 두 단계의 합계는 최종 소비가액 150만원의 10%가 됩니다."
    source: "2026 부가가치세 · 제1장 · 교재 3쪽 · 부가가치세법 제37조"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제1장 제2절 우리나라의 부가가치세 제도"
    statement: "일반과세자인 가구업체가 과세 매출에만 쓸 기계를 사고 적법한 세금계산서를 받았다. 기계값의 매입세액은 감가상각이 끝나기 전에도 취득한 과세기간에 공제할 수 있다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "소비형 부가가치세에서는 사업용 설비의 적격 매입세액을 취득한 때 공제한다. 면세 매출에만 쓰는 기계라면 그 매입세액은 공제할 수 없다."
    source: "2026 부가가치세 교재 5쪽부터 · 제1장 총설 · 제2절 우리나라의 부가가치세 제도 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제1장 제2절 우리나라의 부가가치세 제도"
    statement: "일반과세 공장이 기계를 사서 과세제품 생산에만 쓰고 적격 세금계산서를 받았다. 기계 매입세액은 감가상각기간에 나누어서만 공제한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "소비형 부가가치세에서는 과세사업에 귀속되는 적격 설비 매입세액을 공급받은 기간에 공제합니다."
    source: "2026 부가가치세 · 제1장 · 교재 5쪽 · 부가가치세법 제21조 · 부가가치세법 제38조"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제1장 제3절 부가가치세의 개념"
    statement: "전단계세액공제법은 매입에 관한 증빙과 별개로 이윤과 임금에 세율을 곱해 신고세액을 구한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "일반과세자는 과세 매출세액에서 요건을 갖춘 매입세액을 공제한다. 요소소득 합산은 부가가치 산정의 가산법이다."
    source: "2026 부가가치세 교재 11쪽부터 · 제1장 총설 · 제3절 부가가치세의 개념 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제1장 제3절 부가가치세의 개념"
    statement: "세금 별도 매출 200만원과 적격 원재료 매입 80만원만 있다. 일반세율에서 외부 매입을 차감한 부가가치는 120만원이고 실제 납부세액은 12만원이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "부가가치는 200 − 80 = 120만원입니다. 납부세액은 매출세액 20만원 − 매입세액 8만원 = 12만원입니다."
    source: "2026 부가가치세 · 제1장 · 교재 11쪽 · 부가가치세법 제37조 · 부가가치세법 제39조"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제1절 목적 및 용어의 정의"
    statement: "의류회사가 보유한 상표권 자체를 다른 회사에 유상 양도했다. 실물이 오가지 않았으므로 이 거래는 용역의 공급이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "재산 가치가 있는 권리도 재화다. 상표권 자체를 넘기면 재화의 공급이고, 권리를 보유한 채 일정 기간 사용하게 하면 용역의 공급이다."
    source: "2026 부가가치세 교재 16쪽부터 · 제2장 총칙 · 제1절 목적 및 용어의 정의 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제1절 목적 및 용어의 정의"
    statement: "사업자가 재산 가치가 있는 특허권 자체를 다른 기업에 양도했다. 눈에 보이지 않는 권리이므로 부가가치세법상 재화가 될 수 없다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "재화에는 재산 가치가 있는 물건과 권리가 모두 포함됩니다. 권리를 넘기는 거래와 사용만 허락하는 용역을 구별합니다."
    source: "2026 부가가치세 · 제2장 · 교재 16쪽 · 부가가치세법 제2조 · 부가가치세법 제12조"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제2절 납세의무자"
    statement: "사업자가 아닌 개인은 재화를 수입해도 부가가치세 납세의무자가 될 수 없다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "재화의 수입에서는 수입자가 납세의무자이며 사업자 요건이 없다."
    source: "2026 부가가치세 교재 18쪽부터 · 제2장 총칙 · 제2절 납세의무자 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제2절 납세의무자"
    statement: "하나의 수탁자가 2023년에 설정한 서로 다른 두 신탁의 재화를 공급했다. 위탁자 과세 예외가 없다면 수탁자가 같아도 신탁재산별로 별도의 납세의무를 진다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "수탁자 과세의 단위는 신탁재산입니다. 수탁자의 명의가 같다는 이유로 두 신탁을 한 단위로 묶지 않습니다."
    source: "2026 부가가치세 · 제2장 · 교재 20쪽 · 부가가치세법 제3조 · 부가가치세법 시행령 제5조의2"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제3절 과세대상"
    statement: "사업을 하지 않는 민수가 해외에서 사 온 개인용 카메라를 국내에 수입했다. 여행자 면세 범위를 넘고 다른 면세 사유도 없다면 사업자등록이 없어도 수입 부가가치세의 납세의무가 있다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "국내에서 재화를 공급할 때는 사업자 여부를 보지만, 재화를 수입할 때는 개인도 수입자로서 납세의무를 질 수 있다."
    source: "2026 부가가치세 교재 31쪽부터 · 제2장 총칙 · 제3절 과세대상 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제3절 과세대상"
    statement: "사업을 하지 않는 개인이 국내에서 사용할 과세 물품을 직접 수입했다. 면세 사유가 없으면 부가가치세 과세대상 거래가 성립한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "재화의 수입은 국내에서 사업자가 공급하는 거래와 별도로 열거됩니다. 개인적 사용만으로 수입 면세가 되지 않습니다."
    source: "2026 부가가치세 · 제2장 · 교재 31쪽 · 부가가치세법 제4조 · 부가가치세법 제13조"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독", "조건변경"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제4절 사업의 구분"
    statement: "제1기 중 4월 1일에 한국표준산업분류가 바뀌었다. 별도 적용 특례가 없는 계속사업자는 6월 매출의 업종을 6월 말 분류표로 판정한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "이 경우 제1기 개시일인 1월 1일 현재의 분류표를 적용한다. 기준일은 개별 거래일이나 과세기간 종료일과 다르다."
    source: "2026 부가가치세 교재 35쪽부터 · 제2장 총칙 · 제4절 사업의 구분 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제2장 제4절 사업의 구분"
    statement: "한 과세기간 중 한국표준산업분류가 바뀌었다. 특별 규정이 없어도 그 기간의 업종은 반드시 과세기간 마지막 날의 분류표로 판정한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "시행령은 해당 과세기간 개시일 현재의 분류를 원칙으로 합니다."
    source: "2026 부가가치세 · 제2장 · 교재 35쪽 · 부가가치세법 시행령 제4조"
