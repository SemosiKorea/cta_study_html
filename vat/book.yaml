    statement: "세탁업자가 6월 28일 수선을 마친 옷을 고객에게 건네고 7월 3일에 돈을 받았다. 선발급이나 분할약정이 없는 일회성 용역의 공급시기는 6월이다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "일반적인 일회성 용역은 역무를 마친 때가 기준이므로 입금월로 미루지 않는다. 중간지급조건부 등 법정 분할 거래는 각 대가를 받기로 한 때를 따로 판단한다."
    source: "2026 부가가치세 교재 134쪽부터 · 제4장 공급시기 및 공급장소 · 제2절 용역의 공급시기 · 2026.11.1. 기준"
