  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제3장 제3절 재화의 수입"
    statement: "해외에서 도착한 기계를 보세창고에만 보관 중이고 수입신고도 수리되지 않았다. 항공기에서 내린 날 이미 국내로 수입한 것이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "보세구역을 거치는 물품은 원칙적으로 그 구역에서 국내로 반입하는지를 본다. 외국 물품이 국내 공항의 보세창고에 도착했다는 사실만으로 수입이 성립하지 않는다."
    source: "2026 부가가치세 교재 112쪽부터 · 제3장 과세거래 · 제3절 재화의 수입 · 2026.11.1. 기준"
    referenceYear: 2026
