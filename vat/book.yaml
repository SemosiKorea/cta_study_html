    subject: "세법학개론"
    unit: "부가가치세 제4장 제4절 공급장소"
    statement: "부산 공장에 고정된 설비를 매각하면서 그 자리에서 소유권을 넘겼다. 일본에서 대금을 송금했더라도 재화의 공급장소는 국내다."
    choices: ["O", "X", "?"]
