    unit: "부가가치세 제2장 제5절 과세기간"
    statement: "개인 일반과세자의 제1기 과세기간은 1월부터 3월까지다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "제1기는 1~6월이다. 첫 3개월은 예정신고기간이다."
