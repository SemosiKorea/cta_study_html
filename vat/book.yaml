    subject: "세법학개론"
    unit: "부가가치세 제5장 제1절 영세율 제도의 개요"
    statement: "영세율을 적용받는 수출사업자는 국내 매입에 대해 부담한 적격 부가가치세를 환급받을 수 없다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "영세율은 과세거래다. 관련 매입세액 공제·환급을 받을 수 있다."
    source: "2026 부가가치세 교재 147쪽부터 · 제5장 영세율 · 제1절 영세율 제도의 개요 · 2026.11.1. 기준"
    referenceYear: 2026
    tags: ["부가가치세", "교재회독"]
  - type: "ox"
    subject: "세법학개론"
    unit: "부가가치세 제5장 제2절 재화의 수출"
    statement: "국내 제조업체가 자기 제품을 부산항에서 직접 선적해 해외 구매자에게 보냈다. 구매자가 대금을 원화로 지급해도 직접수출에 영세율을 적용할 수 있다."
    choices: ["O", "X", "?"]
