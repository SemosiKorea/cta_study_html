cards:
  - type: ox
    subject: 세법학개론
    unit: 법인세 2021기출 · 세무조정과 이월결손금을 반영한 과세표준
    choices:
      - O
      - X
      - "?"
    source: 2021년 제58회 세무사 1차 · 세법학개론 61번 · 세무조정과 이월결손금을 반영한 과세표준 | 판단 기준 2026.11.1. | 법 제13조제1항·제16조제1항제1호·제19조의2제2항제2호 · 영 제2조제8항제1호·제26조·제72조제4항제3호·제88조제1항제1호 | https://www.q-net.or.kr/cst003.do?artlSeq=5208510&boardId=Q004&gId=22&gSite=L&id=cst00302&menuType=cst00309
    referenceYear: 2026
    statement: |-
      제조업을 영위하는 영리내국법인 (주)A의 다음 자료에 따른 법인세 과세표준을 구하세요.

      2021년 기출의 사실관계에 2026.11.1. 기준 규정을 적용하는 학습문항입니다. 과거 신고세액을 재산정하는 의미는 아닙니다.

      (주)A는 중소기업 및 회생계획 이행기업이 아니다. 사업연도는 2021.1.1.~12.31.이다.

      전기 이전의 모든 세무조정은 적절하게 이루어졌으며, 주어진 자료 이외에는 고려하지 않는다. 또한 수입배당금액에 대한 익금불산입 규정은 적용하지 않음

      제21기 사업연도 포괄손익계산서상 당기순이익은 300,000,000원이다.

      제21기 말 재무상태표에는 2020.1.1.에 (주)A의 대표이사로부터 현금을 지불하고 취득한 건물(취득가액: 400,000,000원)이 계상되어 있으며, (주)A는 동 건물에 대하여 정액법(매기 상각률: 0.05)에 따른 감가상각비를 제21기 포괄손익계산서에 비용으로 계상하였다. 동 건물의 취득 당시 시가는 350,000,000원, 신고내용연수는 20년이며 감가상각방법은 신고하지 않았다.

      (주)A의 경영에 대해 사실상 영향력을 행사하고 있다고 인정되는 자의 배우자인 甲에게 (주)A의 업무와 관련 없이 대여한 5,000,000원이 회수불능하게 됨에 따라 전액 대손처리하고, 이를 제21기 포괄손익계산서에 비용으로 계상하였다. 단, (주)A는 동 대여금에 대해서 「법인세법」상 시가를 초과하는 이자를 수령하고 있다.

      (주)A는 (주)B가 발행한 주식 20,000주(주당 액면가액 5,000원)를 1주당 6,000원에 취득하여 보유하고 있었는데, 제21기 중 (주)B는 발행주식의 10%를 1주당 10,000원의 현금을 지급하고 일괄 매입하여 소각하였다. (주)A는 (주)B로부터 수취한 20,000,000원에 대하여 아무런 회계처리를 하지 않고 보유주식수만 감소시켰다.

      (주)A는 제20기에 「법인세법」상 결손금 200,000,000원이 발생하였으며, 자산수증이익 및 채무면제이익으로 충당된 결손금은 없다.

      **검산 O·X**　현행법으로 계산한 과세표준은 120,000,000원을 초과한다.
    answer: X
    rationale: |-
      **현행 계산 결과**　③ 115,500,000원

      1. 건물 감가상각: 장부상 상각 400,000,000×5%=20,000,000; 세법상 상각 350,000,000×5%=17,500,000; 손금불산입 2,500,000 — 건물 무신고 방법은 정액법. 특수관계인 고가매입의 시가초과액은 취득가액에서 제외하고 그 부분의 상각비를 손금으로 인정하지 않는다.

      2. 대손금: 손금불산입 5,000,000 — 사실상 경영 영향력 행사자의 배우자는 특수관계인이고, 업무무관 대여금은 법정 대손금 제외채권이다. 시가 이상의 이자를 받았어도 이 채권의 성질은 바뀌지 않는다.

      3. 감자 의제배당: 20,000주×10%×(10,000−6,000)=8,000,000 익금산입 — 수취 대가에서 소각된 주식의 세무상 취득가액만 뺀다. 액면가액이나 전체 보유주식 원가를 빼지 않는다.

      4. 소득·결손금·과세표준: 각 사업연도 소득=300,000,000+2,500,000+5,000,000+8,000,000=315,500,000; 공제=min(200,000,000,315,500,000×80%)=200,000,000; 과세표준=115,500,000

      원문 당시 공식 정답은 ④ 126,200,000원이다. 일반법인 이월결손금 공제한도를 당시 60% 대신 현행 80%로 적용하면 ③ 115,500,000원이다.

      **검산 X**　현행 과세표준은 115,500,000원이므로 120,000,000원을 초과하지 않는다.
    tags:
