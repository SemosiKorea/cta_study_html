    referenceYear: 2026
    statement: |-
      포괄손익계산서 세금과공과 계정의 다음 지출 중 「소득금액조정합계표」의 “익금산입 및 손금불산입”에 포함할 금액의 합계를 구하세요.

      2021년 기출의 사실관계에 2026.11.1. 기준 규정을 적용하는 학습문항입니다. 과거 신고세액을 재산정하는 의미는 아닙니다.

      영리내국법인 (주)A가 다음 지출을 모두 비용으로 계상했다.

      사계약상의 의무불이행으로 인하여 부담한 지체상금(구상권 행사 불가능): 1,000,000원

      업무와 관련하여 발생한 교통사고 벌과금: 1,500,000원

      전기요금의 납부지연으로 인한 연체가산금: 3,500,000원

      「국민건강보험법」에 따라 징수하는 연체금: 4,000,000원

      국유지 사용료의 납부지연으로 인한 연체료: 5,500,000원

      외국의 법률에 따라 국외에서 납부한 벌금: 6,000,000원

      **검산 O·X**　소득금액조정합계표의 익금산입 및 손금불산입 합계는 10,000,000원을 초과한다.
    answer: O
    rationale: |-
      **현행 계산 결과**　③ 11,500,000원

      1. 사계약 지체상금(구상권 없음) 1,000,000원: 손금산입. 사계약 불이행의 배상 성격으로 손금.

      2. 업무 관련 교통사고 벌과금 1,500,000원: 손금불산입. 업무 관련이어도 법령상 제재금.

      3. 전기요금 연체가산금 3,500,000원: 손금산입. 공급요금 납부 지연에 따른 부담.

      4. 국민건강보험 연체금 4,000,000원: 손금불산입. 기본통칙 및 교재가 명시한 손금불산입 항목.

      5. 국유지 사용료 연체료 5,500,000원: 손금산입. 기본통칙 및 교재의 손금산입 항목.

      6. 외국법에 따라 국외에서 낸 벌금 6,000,000원: 손금불산입. 외국 벌금도 손금불산입.

      7. 합계: 1,500,000+4,000,000+6,000,000=11,500,000

      **검산 O**　해당 합계는 11,500,000원이다.
