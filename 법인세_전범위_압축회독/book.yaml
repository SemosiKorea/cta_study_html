schema: hoedok.cards/v1
cards:
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 01.01 법인세의 개요"
    statement: "본점이 국외에 있으면 실질적 관리장소가 국내에 있어도 반드시 외국법인이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "본점·주사무소·실질적 관리장소 중 하나라도 국내라면 내국법인이다. 그다음 설립 근거와 이익분배 가능성 등으로 영리·비영리를 가른다."
    source: "2026 국세공무원교육원 법인세법 제1장 법인세의 개요 인쇄 4쪽부터 (PDF 36쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제1편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 01.02 사업연도"
    statement: "변경으로 생긴 전환기간이 정확히 1개월이라면 새 사업연도에 합친다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "규정된 회계기간 → 신고한 기간 → 법정 기본기간 순으로 살핀다. 1년이 상한이다. 최초 개시일은 내·외국법인과 국내사업장 유무에 따라 달라진다. 변경신고는 직전 종료일부터 3개월 이내, 전환기간 합산은 1개월 미만이다. 일반 해산과 합병·분할해산은 등기일 뒤의 사업연도 유무가 다르다."
    source: "2026 국세공무원교육원 법인세법 제2장 사업연도 인쇄 13쪽부터 (PDF 45쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제1편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 01.03 납세지"
    statement: "납세지를 옮긴 내국법인은 원칙적으로 변경 후 납세지의 관할 세무서장에게 변경 사실을 신고한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "내국법인은 등기부상 본점·주사무소, 외국법인은 국내사업장이 출발점이다. 국내사업장이 없으면 해당 부동산 등의 소재지를 확인한다. 이전 시 변경 후 관할에 15일 이내 신고한다. 원천징수세액은 지급자의 납세지를 별도로 판단한다."
    source: "2026 국세공무원교육원 법인세법 제3장 납세지 인쇄 17쪽부터 (PDF 49쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제1편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.01 각 사업연도소득의 계산"
    statement: "사외유출이 분명하면 실제 귀속자가 확인되는 경우에도 항상 대표자 상여로 처분한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "조정액이 사내에 남고 세무상 자산·부채 차이가 생기면 유보를 추적한다. 사외유출이면 귀속자에 따라 배당·상여·기타소득·기타사외유출을 가르고, 귀속 불분명은 대표자 상여 원칙을 확인한다."
    source: "2026 국세공무원교육원 법인세법 제1장 각 사업연도소득의 계산 인쇄 33쪽부터 (PDF 65쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.02 익금"
    statement: "무상주를 받으면 잉여금의 재원과 무관하게 반드시 그 가액 전부가 의제배당이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "배당 결의가 없어도 감자·해산·합병 등으로 받은 대가가 세법상 투자원가를 초과하면 의제배당을 검토한다. 무상주는 자본전입 재원과 자기주식 몫의 배정 여부를 각각 본다."
    source: "2026 국세공무원교육원 법인세법 제2장 익금 인쇄 61쪽부터 (PDF 93쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.03 익금불산입"
    statement: "내국법인으로부터 받은 배당은 지분율·보유기간과 관계없이 전액 익금불산입한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "자본거래, 이중과세 조정, 채무면제이익 등의 결손금 보전 여부를 나눈다. 수입배당금은 지급법인이 국내인지 국외인지부터 가르고, 지분율·보유기간·제외 배당을 확인한다."
    source: "2026 국세공무원교육원 법인세법 제3장 익금불산입 인쇄 80쪽부터 (PDF 112쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.04 손금"
    statement: "법인세를 결산상 세금과공과로 기록하면 각 사업연도의 손금이 된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "세금이면 세목과 부담 주체를 본다. 법인세·법인지방소득세, 벌금·과태료는 손금 제한을 확인하고, 자산 취득세 등은 취득원가에 포함되는지 판단한다."
    source: "2026 국세공무원교육원 법인세법 제4장 손금 인쇄 115쪽부터 (PDF 147쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.05 손금불산입"
    statement: "업무용승용차 관련비용은 법인 명의의 승용차이기만 하면 전액 손금으로 확정된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "업무무관 비용·과다경비·제재금 등 배제 사유를 먼저 고른다. 업무용승용차는 차량별 비용, 전용보험, 운행기록, 업무사용비율과 감가상각비 한도를 순차 적용한다."
    source: "2026 국세공무원교육원 법인세법 제5장 손금불산입 인쇄 128쪽부터 (PDF 160쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.06 감가상각비"
    statement: "장부상 감가상각비가 세법상 범위액을 넘으면 초과분은 원칙적으로 손금불산입하고 유보로 관리한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "장부상 상각비가 범위액을 넘으면 초과액을 손금불산입·유보한다. 범위액이 남으면 전기 상각부인액이 있는지 보아 남는 범위에서 추인한다."
    source: "2026 국세공무원교육원 법인세법 제6장 감가상각비 인쇄 166쪽부터 (PDF 198쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.07 기부금"
    statement: "특수관계인이 아닌 일반기부금단체에 현물을 기부하면 시가와 장부가액 중 큰 금액으로 평가한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "현물은 지출액 평가가 먼저다. 특례기부금과 비특수관계인에 대한 일반기부금은 장부가액, 교재가 제시한 그 밖의 경우는 시가와 장부가 중 큰 금액을 적용한다. 분류별 한도와 이월액을 그다음 반영한다."
    source: "2026 국세공무원교육원 법인세법 제7장 기부금 인쇄 200쪽부터 (PDF 232쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.08 업무추진비"
    statement: "증빙요건 위반으로 손금에서 제외한 기업업무추진비도 다시 연간 한도 초과액 계산 대상에 넣는다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "먼저 증빙요건 미충족액을 가려낸 뒤 남은 지출을 연간 한도와 비교한다. 한도는 기본금액과 수입금액별 금액을 합하고 적용 가능한 추가한도를 확인한다."
    source: "2026 국세공무원교육원 법인세법 제8장 업무추진비 인쇄 215쪽부터 (PDF 247쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.09 지급이자 손금불산입"
    statement: "사업용 고정자산 건설에 직접 쓴 특정차입금의 건설기간 이자는 원칙적으로 취득원가에 포함한다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "사업용 고정자산 건설과 직접 관련된 특정차입금 이자는 준공 전 취득원가로 처리한다. 일반차입금은 자본화 선택 및 계산 한도가 달라진다."
    source: "2026 국세공무원교육원 법인세법 제9장 지급이자 손금불산입 인쇄 230쪽부터 (PDF 262쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.10 퇴직급여충당금⋅퇴직연금부담금"
    statement: "확정급여형 퇴직연금은 법인이 현금을 납입한 사실만으로 언제나 전액 손금이 된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "확정기여형은 납입 부담금, 확정급여형은 납입액과 퇴직급여 추계액 등으로 산정한 누적 한도를 비교한다. 전기까지 이미 공제한 금액을 뺀다."
    source: "2026 국세공무원교육원 법인세법 제10장 퇴직급여충당금⋅퇴직연금부담금 인쇄 255쪽부터 (PDF 287쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.11 대손금과 대손충당금"
    statement: "대손충당금 설정 대상 채권은 세무상 유보를 조정하지 않고 결산서의 채권 합계액으로 확정한다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "대상채권의 세무상 장부가에 설정률을 곱한다. 일반법인의 설정률은 원칙적으로 1%와 대손실적률 중 큰 비율이다. 회계상 설정액과 세무상 한도를 비교한다."
    source: "2026 국세공무원교육원 법인세법 제11장 대손금과 대손충당금 인쇄 279쪽부터 (PDF 311쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.12 일시상각(압축기장)충당금"
    statement: "국고보조금으로 취득한 자산의 과세이연을 검토할 때에는 그 자산이 상각대상인지부터 나눈다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "보조금 등 법정 재원으로 사업용 자산을 취득했는지 본다. 감가상각자산에는 일시상각충당금, 비상각자산에는 압축기장충당금을 대응시킨다. 상각·처분 시 익금 환입을 추적한다."
    source: "2026 국세공무원교육원 법인세법 제12장 일시상각(압축기장)충당금 인쇄 288쪽부터 (PDF 320쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.13 준비금"
    statement: "목적과 사용기한을 이사회에서 정한 준비금은 별도 법률 근거가 없어도 당기 손금으로 인정된다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "미래 비용을 위해 적립한 사실만으로 손금이 되지는 않는다. 법이 열거한 준비금인지, 설정 한도와 사용 기한이 있는지 확인한다."
    source: "2026 국세공무원교육원 법인세법 제13장 준비금 인쇄 297쪽부터 (PDF 329쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.14 손익의 귀속사업연도"
    statement: "진행기준 공사에서 전기에 인식한 수익이 있어도 당기 말의 누적 진행수익 전액이 당기 수익이다."
    choices: ["O", "X", "?"]
    answer: "X"
    rationale: "상품은 인도, 용역·건설은 진행기준 적용 여부, 이자·배당은 별도 귀속기준을 가른다. 진행기준이면 누적 진행수익에서 전기까지 인식한 수익을 빼 당기액을 계산한다."
    source: "2026 국세공무원교육원 법인세법 제14장 손익의 귀속사업연도 인쇄 302쪽부터 (PDF 334쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.15 자산⋅부채의 평가"
    statement: "다른 조건이 같다면 기말 재고자산 평가액이 높아질수록 해당 연도의 매출원가는 작아진다."
    choices: ["O", "X", "?"]
    answer: "O"
    rationale: "신고한 재고자산 평가방법과 실제 적용법을 비교한다. 무신고와 임의 변경을 구분하고, 기말 재고액이 커지면 같은 조건에서 매출원가는 줄어든다."
    source: "2026 국세공무원교육원 법인세법 제15장 자산⋅부채의 평가 인쇄 328쪽부터 (PDF 360쪽)"
    referenceYear: 2026
    tags: ["법인세", "교재압축", "제2편"]
  - type: "ox"
    subject: "세법학개론"
    unit: "법인세 02.16 부당행위계산의 부인"
    statement: "특수관계인에게 무이자로 업무무관자금을 빌려주어 인정이자를 계산했다면 관련 지급이자의 손금불산입은 검토할 필요가 없다."
    choices: ["O", "X", "?"]
    answer: "X"
