      국내 법인세에서 공제할 직접·간접 외국납부세액의 합계를 구하세요.

      A는 일반 영리내국법인이다. 2024.1.1.부터 배당기준일까지 B의 의결권 있는 주식 30%를 직접 계속 보유했다. 2026년에 B로부터 보통배당 2,000,000원을 받아 원천세 200,000원을 뺀 1,800,000원이 입금됐다.

      A는 배당금수익 2,000,000원과 선급법인세 200,000원을 기록했다. B의 당기 소득은 5,000,000원, 현지 법인세는 1,000,000원이다. A의 세전이익은 150,000,000원이고 이월결손금은 없다. 배당간주·혼성금융상품 등 적용배제 사실이나 차입금 이자는 제시되지 않았다.

      **검산 O·X**　공제액은 이 배당에서 실제 원천징수한 외국세액 이상이다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: |-
      **계산 결과**　국내에서 공제할 세액 0원

      1. 배당총액은 1,800,000 + 200,000 = 2,000,000원이다. A는 의결권주식 10% 이상을 배당기준일 현재 6개월 이상 직접 보유했다.

      2. 2026년 수령분은 조세특례제한법 제23조의2의 100% 특례가 적용된다. 법인세법 일반규정의 비율은 95%다. 이 사례는 차감할 차입금 이자가 없으므로 2,000,000원 전액을 익금불산입한다. 차입금 이자가 주어지면 법정 안분액을 차감한다.

      3. 법인세법 제57조제7항은 해당 배당에 대한 외국납부세액공제를 배제한다. A의 원천세 200,000원에 대한 공제는 0원이고, B의 현지 법인세 중 배당 대응분에 대한 간접공제도 0원이다. 국내에서 공제할 합계는 0원이다.

      **검산 X**　배당에서 원천징수된 세액 20만원은 이 사례에서 국내 공제액이 아니다.
    source: 2022년 제59회 세무사 1차 · 세법학개론 64번 · 외국자회사 배당과 외국납부세액공제 | 판단 기준 2026.11.1. | 법인세법 제18조의4·제21조제1호·제57조제7항, 시행령 제18조, 조세특례제한법 제23조의2제1·3항. 교재 89~91쪽(일반규정)·481~483쪽. 2026년 특례는 2026.4.21. 법률 제21549호 부칙 제2조 참조.
