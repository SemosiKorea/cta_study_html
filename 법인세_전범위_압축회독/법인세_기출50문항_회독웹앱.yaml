    source: 2022년 제59회 세무사 1차 · 세법학개론 69번 ⑤ · 기부금의 지출시기와 기업업무추진비 증명서류 | 판단 기준 2026.11.1. | 교재 190~191쪽, 201쪽, 210~215쪽. 법인세법 제24·25조, 시행령 제35·36·106조, 시행규칙 제18조.
