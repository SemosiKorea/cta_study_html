    subject: 세법학개론
    unit: 법인세 02.02 익금
    statement: |-
      A가 받은 무상주 중 의제배당 금액을 원 단위로 구하세요.

      A는 B의 발행주식 15%를 보유하며 B의 2022.3.15. 잉여금 자본전입으로 무상주를 받았다. 금액 단위는 만원이다. 주식발행초과금 200(그중 출자전환 채무면제익 100), 자기주식소각이익 500(소각 당시 시가가 취득가액을 초과), 자기주식처분이익 150, 주식 포괄적 교환차익 300·이전차익 100이다.

      재평가적립금은 토지 40(재평가세 1%)과 건물 100(재평가세 3%)이다. 이월이익잉여금은 1,000이다. B는 자기주식을 보유하지 않는다. 수입배당금 익금불산입은 고려하지 않는다.

      **검산 O·X**　의제배당 금액은 250만원을 넘는다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: |-
      **계산 결과**　의제배당 2,685,000원

      1. 일반 주식발행초과금 100, 포괄적 교환·이전차익 400, 건물 재평가적립금 100은 이번 무상주의 과세 재원에서 제외한다.

      2. 과세 재원은 출자전환 채무면제익 100 + 소각 당시 시가가 취득가보다 큰 자기주식소각이익 500 + 자기주식처분이익 150 + 토지 재평가적립금 40 + 이월이익잉여금 1,000 = 1,790만원이다.

      3. A의 귀속분은 1,790만원 × 15% = 268만 5천원이다. 자기주식 보유로 인한 다른 주주의 지분 증가분은 없다.

      **검산 O**　268만 5천원은 250만원을 넘는다.
    source: 2022년 제59회 세무사 1차 · 세법학개론 62번 · 자본전입 재원별 의제배당 | 판단 기준 2026.11.1. | 교재 70~72쪽. 법인세법 제16조제1항제2·3호 및 시행령 제12조.
