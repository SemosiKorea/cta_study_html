  - type: ox
    subject: 세법학개론
    unit: 법인세 02.05 손금불산입
    statement: |-
      전용번호판 요건을 충족하거나 부착 대상이 아닌 경우와, 부착 대상이면서 연중 미부착한 경우의 손금불산입 총액을 각각 구하세요.

      2026.1.1.부터 12.31.까지 제조업을 하는 A는 상시근로자 10명이다. 연초에 리스회사로부터 임원용 승용차를 3년간 새로 운용리스했다. 업무전용자동차보험에 가입하고 운행기록을 갖췄다. 연간 총주행거리는 20,000km, 업무용 주행은 15,000km다.

      리스료 30,000,000원에 보험료 3,000,000원, 자동차세 2,000,000원, 수선유지비 1,750,000원이 포함된다. 별도 기타유지비는 3,000,000원이다. 차량 취득가액과 전용번호판 부착 사실은 주어지지 않았다.

      **검산 O·X**　두 경우의 손금불산입 총액 차이는 1,500만원 이하이다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: |-
      **계산 결과**　정상 부착 또는 부착 비대상 17,687,500원 / 부착 대상·연중 미부착 33,000,000원

      1. 먼저 차량 취득가액과 등록·대여 요건으로 법인업무용 전용번호판 부착 대상인지 확인한다. 이 사례의 신규 3년 리스에서 취득가액이 8,000만원 이상인 해당 차량은 부착 대상이다. 리스료 총액이나 연간 리스료만으로 취득가액을 결정할 수 없다.

      2. 비대상이거나 대상 차량에 전용번호판을 부착한 경우 업무사용비율은 15,000÷20,000 = 75%다. 업무 외 비용 = (30,000,000 + 3,000,000) × 25% = 8,250,000원.

      3. 업무용 감가상각비상당액 = (30,000,000 − 3,000,000 − 2,000,000 − 1,750,000) × 75% = 17,437,500원. 연간 한도 8,000,000원을 빼면 9,437,500원이 추가로 부인된다. 합계 8,250,000 + 9,437,500 = 17,687,500원이다.

      4. 부착 대상인데 연중 전용번호판을 부착하지 않은 경우 업무사용금액은 0원이므로 전체 관련비용 33,000,000원을 부인한다. 같은 비용에 상각비 한도초과액을 다시 더하지 않는다.

      **검산 X**　두 금액의 차이는 15,312,500원이다.
    source: 2022년 제59회 세무사 1차 · 세법학개론 65번 · 운용리스 승용차의 업무외 사용과 상각비상당액 | 판단 기준 2026.11.1. | 법인세법 제27조의2, 시행령 제50조의2, 시행규칙 제27조의2, 자동차 등록번호판 등의 기준에 관한 고시. 교재 135~139쪽(특히 136쪽), 144~147쪽.
