    subject: 세법학개론
    unit: 법인세 04.10 퇴직급여충당금⋅퇴직연금부담금
    statement: |-
      퇴직금 상계의 오류를 바로잡고 추가 손금산입할 연금충당금과 소득처분을 구하세요.

      확정급여형 퇴직연금, 결산조정. 금액은 백만원. 운용자산은 기초 750, 당기 예치 430, 지급 250, 기말 930. 연금충당금은 기초 750, 상계 150, 설정 200, 기말 800.

      지급 시 차변에 연금충당금 150, 급여충당금 100, 대변에 운용자산 250을 기록했다. 기말 장부상 급여충당금·퇴직금전환금은 없다. 전기 말 손금불산입 유보는 급여충당금 20, 연금충당금 150. 보험수리 추계 990, 일시퇴직 추계 960.

      **검산 O·X**　상계를 정정한 뒤 추가 손금산입할 연금충당금은 3억원 이하이다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: |-
      **계산 결과**　상계 정정은 연금충당금 100,000,000원 유보 및 급여충당금 100,000,000원 △유보. 연금충당금 추가 손금산입은 360,000,000원(△유보).

      1. 운용자산에서 지급한 250 전부를 연금충당금과 상계해야 한다. 장부상 150만 상계했으므로 차이 100을 연금충당금 손금불산입(유보), 급여충당금 손금산입(△유보)로 정정한다.

      2. 정정 후 급여충당금 세무상 잔액은 0 + 100 − 전기 유보 20 = 80. 연금충당금 세무상 이월잔액 중 지급 후 남은 금액은 (750 − 전기 유보 150) − 250 = 350.

      3. 추계액 max(990, 960) = 990. 연금 인정 누계액은 min(990 − 80, 운용자산 930) = 910. 당기 설정 가능액 910 − 350 = 560.

      4. 이미 장부에 설정한 200을 빼면 추가 손금산입 360백만원(360,000,000원).

      **검산 X**　추가 손금산입액 3억 6천만원은 3억원을 넘는다.
