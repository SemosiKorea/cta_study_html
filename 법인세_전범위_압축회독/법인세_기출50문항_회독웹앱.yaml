  - type: ox
    subject: 세법학개론
    unit: 법인세 03.08 업무추진비
    statement: |-
      기업업무추진비 관련 손금불산입액 중 기타사외유출로 처분할 합계를 구하세요.

      중소 제조법인의 2026년 1~10월 장부에는 기업업무추진비 225,000,000원, 법인인 직원조합의 세금계산서로 지출이 확인된 복리시설비 3,000,000원, 비특수관계 거래처와 관계 유지 목적으로 정당한 사유 없이 약정으로 포기한 채권 10,000,000원이 있다.

      기업업무추진비에는 대표 자녀 결혼식 식사비 15,000,000원이 포함되어 있다. 건당 3만원을 초과하고, 증빙이 없고 귀속도 불분명한 5,000,000원 및 일반 영수증만 받은 4,000,000원 외에는 신용카드로 지출했다.

      매출액 650억원에 중단사업 매출 200억원과 특수관계인 매출 90억원이 포함된다. 문화 등 별도 특례 자료는 없다.

      **검산 O·X**　기타사외유출액은 8,000만원을 넘는다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: |-
      **계산 결과**　기타사외유출 75,930,000원

      1. 한도 대상액 = 225,000,000 + 3,000,000 + 10,000,000 − 15,000,000 − 5,000,000 − 4,000,000 = 214,000,000원. 대표 개인 경조비와 귀속불분명분은 대표자 상여로, 적격증빙 없는 실제 지출 4,000,000원은 기타사외유출로 따로 본다.

      2. 기본한도 = 36,000,000 × 10/12 = 30,000,000원. 중단사업 매출을 포함한 일반매출은 650억 − 90억 = 560억원이다. 일반매출 한도 = 110,000,000 + (560억 − 500억) × 0.03% = 111,800,000원.

      3. 특수관계인 매출은 일반매출에 이어지는 구간의 율을 쓴다. 90억 × 0.03% × 10% = 270,000원. 한도초과 = 214,000,000 − 30,000,000 − 111,800,000 − 270,000 = 71,930,000원.

      4. 기타사외유출 합계 = 한도초과 71,930,000 + 영수증만 받은 실제 지출 4,000,000 = 75,930,000원.

      **검산 X**　귀속불분명분 등 대표자 상여는 기타사외유출 합계에서 빠진다.
    source: 2023년 제60회 세무사 1차 · 세법학개론 64번 · 접대비 지출 구분과 기타사외유출 | 판단 기준 2026.11.1. | 법인세법 제25조·제67조, 시행령 제106조. 교재 208~217쪽.
