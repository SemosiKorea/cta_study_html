  - type: ox
    subject: 세법학개론
    unit: 법인세 2021기출 · 지급이자 손금불산입 순서와 건설자금이자 역산
    choices:
      - O
      - X
      - "?"
    source: 2021년 제58회 세무사 1차 · 세법학개론 64번 · 지급이자 손금불산입 순서와 건설자금이자 역산 | 판단 기준 2026.11.1. | 법 제28조 · 영 제52조·제53조·제55조·제106조 · 교재 39쪽 유보금액의 사후관리 · 교재 230~235쪽 건설자금이자·즉시상각의제 | https://www.q-net.or.kr/cst003.do?artlSeq=5208510&boardId=Q004&gId=22&gSite=L&id=cst00302&menuType=cst00309
    referenceYear: 2026
    statement: |-
      지급이자 세무조정으로 「자본금과 적립금 조정명세서(乙)」의 기말잔액에 영향을 미치는 금액을 구하세요.

      2026.11.1. 기준 학습문항입니다. B 이자 역산과 실제 을표 기말잔액 영향은 구분합니다. 원문에는 완공 여부와 추가 상각조정 자료가 없습니다.

      (주)A는 제조업을 영위하는 영리내국법인으로 중소기업이 아니다. 사업연도는 2021.1.1.~12.31.이다.

      당기의 모든 세무조정은 적절하게 이루어졌으며, 주어진 자료 이외에는 고려하지 않음

      지급이자 A: 3,000,000원, 연 6%. 채권자와의 금전거래 사실 및 거래내용이 불분명한 차입금에서 발생했다.

      지급이자 B: 이자액과 이자율은 미상. 사업용 유형자산 건설에만 전액 소요된 특정차입금의 이자다.

      지급이자 C: 9,600,000원, 연 12%.

      지급이자 D: 이자액과 이자율은 미상. 차입원금은 60,000,000원이다.

      포괄손익계산서상 지급이자 A~D의 합계는 26,600,000원이다.

      2021.1.1.에 대표이사에게 업무와 관련 없이 70,000,000원을 대여하였고, 제21기말까지 상환되지 않았다. 또한 업무무관자산 등에 대한 지급이자 세무조정 결과, 포괄손익계산서 상 지급이자 중에서 동 가지급금과 관련하여 손금불산입된 금액은 9,300,000원이다.

      (주)A의 제21기 말 현재 차입금 총액 252,500,000원은 모두 전기 이전에 차입하였으며, 제21기 중 신규로 차입하거나 상환된 차입금은 없다.

      **검산 O·X**　건설자금이자 B는 9,300,000원보다 작다.
    answer: O
    rationale: |-
      **현행 계산 결과**　B 이자 역산액: 5,000,000원. ②를 을표 기말잔액 영향액으로 확정하려면 건설 중이거나 추가 상각조정이 없다는 전제가 필요하다.

      1. 차입원금: A=3,000,000/6%=50,000,000; C=9,600,000/12%=80,000,000; B=252,500,000−50,000,000−80,000,000−60,000,000=62,500,000

      2. 업무무관 안분 대상: 선순위 A·B를 제외한 차입원금=C+D=140,000,000. 잔액이 1년 내내 같아 일수는 약분된다.

      3. 이자 역산: 9,300,000=(C이자+D이자)×70,000,000/140,000,000 → C이자+D이자=18,600,000. D이자=9,000,000. B이자=26,600,000−3,000,000−18,600,000=5,000,000

      4. 소득처분·명세서 연결: 채권자 불분명 사채이자는 사외유출, 업무무관 지급이자는 기타사외유출이다. B 이자 5,000,000원은 건설 중이거나 추가 상각조정이 없는 경우 유보로 남는다. 당기 완공한 상각자산이면 비용 처리한 건설자금이자를 법인계상 상각비에 포함하여 즉시상각의제 시부인 계산을 해야 하므로, B 이자액과 을표 기말 유보액을 곧바로 동일시하지 않는다.

      원문은 을표 기말잔액에 영향을 미치는 금액을 묻고 공식 당시 정답은 ②이다. 다만 완공 여부와 감가상각 자료가 없어 실제 기말 유보액을 하나로 확정할 수 없다. 이 문항은 B 이자 역산을 연습하되, 원문 전체의 엄격한 충족 집계에서는 제외한다.

      **검산 O**　역산한 B 이자는 5,000,000원으로 9,300,000원보다 작다. 실제 을표 기말 유보액은 완공·추가 상각조정 자료가 없으므로 별도 확정할 수 없다.
