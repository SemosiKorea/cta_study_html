  - type: ox
    subject: 세법학개론
    unit: 법인세 02.02 익금
    statement: |-
      자기주식 몫을 다른 주주에게 교부한 경우와 미교부한 경우의 의제배당 차액을 B·C·D별로 계산하세요.

      제5기에 A가 자본전입 시 비과세되는 주식발행초과금 2억원으로 무상증자를 한다. 사례 1은 자기주식 몫 무상주를 B·C·D에게 종전 보유주식 수에 비례해 교부한다. 사례 2는 자기주식 몫을 발행하지 않는다. 사례 1에서 사례 2를 뺀 금액을 구한다. 원 미만 절사.

      증자 전 총 100,000주, 발행가액 주당 5,000원, 액면가액 주당 500원, 자본금 50,000,000원. A 자기주식 20,000주, B 30,000주, C 40,000주, D 10,000주.

      **검산 O·X**　세 주주의 의제배당 차액 합계는 750만원 이하이다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: |-
      **계산 결과**　의제배당 차액은 B 3,000,000원 / C 4,000,000원 / D 1,000,000원

      1. 무상주 200,000,000원÷500원=400,000주. 자기주식 몫은 80,000주. 각 주주 의제배당=(증자 후 실제 보유주식−증자 후 총주식×종전 지분율)×500원.

      2. 사례1의 총주식은 500,000주. 신주를 B:C:D=3:4:1로 나눠 총보유는 180,000·240,000·60,000주. 증가지분 해당 주식은 30,000·40,000·10,000주다. 의제배당은 각각 15,000,000·20,000,000·5,000,000원.

      3. 사례2는 80,000주를 발행하지 않아 총 420,000주. B·C·D는 150,000·200,000·50,000주를 보유한다. 종전 지분율 대응분 126,000·168,000·42,000주를 빼면 24,000·32,000·8,000주다. 의제배당은 12,000,000·16,000,000·4,000,000원.

      4. 사례1−사례2=3,000,000·4,000,000·1,000,000원.

      **검산 X**　세 차액의 합계는 800만원이다.
    source: 2024년 제61회 세무사 1차 · 세법학개론 64번 · 무상증자와 자기주식 몫 | 판단 기준 2026.11.1. | 법 제16조 제1항 제2·3호. 교재 70~74쪽, 특히 74쪽 무상주 추가배정 예제.
