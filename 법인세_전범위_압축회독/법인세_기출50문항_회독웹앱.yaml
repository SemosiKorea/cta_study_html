  - type: ox
    subject: 세법학개론
    unit: 법인세 06.22 중간예납⋅원천징수⋅수시부과
    statement: |-
      2026년 가결산 의무가 적용될 때의 중간예납세액과, 규모 예외로 방법을 선택할 때의 최소 세액을 각각 구하세요.

      12월 결산 비중소기업. 직전기 말 공시대상기업집단 소속. 금액 단위는 백만원.

      직전 12개월 과세표준 900, 산출세액 151, 원천징수 42, 수시부과 19, 중간예납 10.

      당기 1~6월 순이익 400, 가산조정 150, 차감조정 50, 원천징수 13, 외국납부세액공제 2, 수시부과 10. 다른 공제·감면은 없다.

      현행 일반법인의 세율을 적용한다. 공시대상기업집단 여부와 별도로 업종별 매출액 규모요건의 충족 여부를 나누어 계산한다. 당기 일반 과세표준 2억원 이하분은 10%, 2억원 초과 200억원 이하분은 20%다.

      **검산 O·X**　가결산 의무가 있을 때와 예외로 더 적은 방법을 선택할 때의 세액 차이는 1,500만원을 넘는다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: |-
      **계산 결과**　가결산 의무 시 65,000,000원 / 업종별 매출액 기준에 따른 예외로 선택 가능 시 최소 45,000,000원

      1. 가결산 시 반기 과표 400 + 150 − 50 = 500백만원. 연환산 과표는 500 × 12/6 = 1,000백만원이다.

      2. 현행 일반세율로 200 × 10% + (1,000 − 200) × 20% = 180백만원. 반기 산출세액 180 × 6/12 = 90백만원. 납부할 금액은 90 − 13 − 2 − 10 = 65백만원(65,000,000원)이다.

      3. 업종별 매출액 요건을 충족하여 직전기 기준도 선택할 수 있다면 (151 − 42 − 19) × 6/12 = 45백만원이다. 직전기 중간예납 10은 별도 공제하지 않는다. 두 방법 중 세부담이 적은 쪽은 45백만원이다.

      **검산 O**　두 경우의 차이는 2,000만원이다.
    source: 2025년 제62회 세무사 1차 · 세법학개론 61번 · 공시대상기업집단의 중간예납 | 판단 기준 2026.11.1. | 법인세법 제55조·제63조의2, 시행령 제100조제4항, 조세특례제한법 시행령 제2조제1항제1호. 교재 518~521쪽.
