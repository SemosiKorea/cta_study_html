    subject: 세법학개론
    unit: 법인세 04.14 손익의 귀속사업연도
    statement: |-
      두 도급공사로 증가하는 제25기 소득금액을 공사별로 구한 뒤 합산하세요.

      비중소기업, 두 공사 모두 1년 초과. 원가는 정확히 기장했다. 자료 단위는 백만원.

      甲은 2024년 착공, 2026년 완공. 도급액 75, 총예정원가 52(변동 없음), 제25기 장부 수익 41·원가 28.6, 제26기 예정원가 5.2. 제24기에 익금산입 0.25(유보)했다.

      乙은 2025년 착공, 2026년 완공. 도급액 84, 총예정원가 57.8, 제25기 장부 수익 60·원가 43.35, 제26기 예정원가 14.45.

      **검산 O·X**　두 공사로 증가하는 소득금액 합계는 350만원 미만이다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: |-
      **계산 결과**　증가 소득금액 3,250,000원

      1. 甲 전기 투입원가 52 − 28.6 − 5.2 = 18.2. 전기 세법 누적수익 75 × 18.2/52 = 26.25백만원. 이는 전기 장부 수익 26에 전기 유보 0.25를 이미 포함한 금액이다.

      2. 甲 당기 말 진행률 (18.2 + 28.6)/52 = 90%. 당기 수익은 75 × 90% − 26.25 = 41.25. 장부 41과의 차이 +0.25백만원.

      3. 乙 당기 수익은 84 × 43.35/57.8 = 63. 장부 60과의 차이 +3백만원. 합계 +3.25백만원, 즉 3,250,000원.

      **검산 O**　두 공사의 조정액은 각각 25만원, 300만원이다.
    source: 2025년 제62회 세무사 1차 · 세법학개론 69번 · 공사진행률과 전기 누적 익금 | 판단 기준 2026.11.1. | 법인세법 제40조, 시행령 제69조, 시행규칙 제34조. 교재 306~309쪽.
