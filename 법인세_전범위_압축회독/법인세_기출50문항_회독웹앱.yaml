    subject: 세법학개론
    unit: 법인세 04.11 대손금과 대손충당금
    statement: |-
      당기 말 대손충당금의 세법상 한도초과액을 원 단위로 구하세요.

      A는 12월 결산 비중소기업 제조법인이다. 전기까지의 세무조정은 적정하다.

      장부상 대손충당금(원) 기초 150,000,000 / 당기상계 130,000,000 / 당기설정 200,000,000 / 기말 220,000,000.

      상계① 전기(2023년)에 상법상 소멸시효 완성된 외상매출금 40,000,000원. 전기에 장부상 대손처리하지 않았다.

      상계② 당기 민사소송법상 화해(확정판결과 같은 효력)에 따라 회수불능 확정된 채권 70,000,000원.

      상계③ 당기말 부도 발생 후 9개월 경과한 B 채권 20,000,000원. 외상매출금 15,000,000원과 받을어음 1매 5,000,000원이며 모두 부도 발생일 이전분이다. B 재산에 A의 저당권은 없다.

      전기 한도초과액 20,000,000원. 장부상 설정대상 채권은 제4기말 1,400,000,000원, 제5기말 2,500,000,000원. 대손실적률은 소수점 넷째 자리 이하 절사(0.0328 → 0.032).

      **검산 O·X**　한도초과액은 8,200만원 미만이다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: |-
      **계산 결과**　대손충당금 한도초과액 81,674,945원

      1. 전기에 시효가 완성된 외상매출금 4,000만원은 전기 귀속이다. 전기말 세무상 채권=1,400,000,000−40,000,000=1,360,000,000원.

      2. 당기 화해로 회수불능 확정 70,000,000원은 대손. 비중소기업의 부도 외상매출금 15,000,000원은 부도 후 6개월 사유로 처리할 수 없다. 저당권 없는 부도어음 1매는 5,000,000−1,000=4,999,000원 대손. 당기 세법상 대손금 합계 74,999,000원.

      3. 대손실적률=74,999,000÷1,360,000,000=0.05514… → 지시대로 0.055. 기본 0.01보다 크므로 5.5% 적용.

      4. 당기말 세무상 채권=2,500,000,000+15,000,000+1,000=2,515,001,000원. 한도=2,515,001,000×0.055=138,325,055원.

      5. 장부 기말잔액=150,000,000−130,000,000+200,000,000=220,000,000원. 한도초과=220,000,000−138,325,055=81,674,945원. 전기 한도초과 20,000,000원을 여기서 또 빼지 않는다.

      **검산 O**　8,200만원보다 325,055원 적다.
    source: 2024년 제61회 세무사 1차 · 세법학개론 66번 · 대손충당금 실적률과 한도 | 판단 기준 2026.11.1. | 법 제19조의2·제34조, 영 제19조의2·제61조. 교재 268~280쪽.
