    statement: |-
      네 종류의 세법상 기말 재고자산을 각각 평가하고 합계를 구하세요.

      12월 결산 내국법인, 한국채택국제회계기준 미적용. 다음은 장부 / 선입선출 / 총평균 / 후입선출 평가액 순서이며 단위는 백만원이다.

      상품 55 / 58 / 57 / 55. 제품 89 / 90 / 89 / 85. 재공품 23 / 27 / 23 / 21. 원재료 16 / 16 / 15.5 / 17.

      상품은 전기 10.11. 선입선출→후입선출, 제품은 당기 9.13. 총평균→후입선출로 변경신고했다. 재공품·원재료는 후입선출법을 신고했다.

      **검산 O·X**　세법상 평가액의 합계는 1억 9,000만원 미만이다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: |-
      **계산 결과**　기말 재고자산 합계 189,000,000원

      1. 변경신고는 적용할 사업연도 종료일의 3개월 전까지 한다. 12월 결산 법인은 9월 30일까지다. 임의평가 시 이 문제의 재고는 신고방법과 선입선출법 중 큰 금액을 쓴다.

      2. 상품은 전기 10월 변경신고가 당기부터 유효하다. 장부도 후입선출법이므로 55백만원.

      3. 제품은 당기 9월 13일 신고로 후입선출법이 유효하지만 장부는 총평균법이다. max(선입선출 90, 신고 85) = 90백만원.

      4. 재공품은 장부 23과 신고 21이 다르므로 max(27, 21) = 27백만원. 원재료도 max(16, 17) = 17백만원.

      5. 합계 55 + 90 + 27 + 17 = 189백만원(189,000,000원).

      **검산 O**　1억 9,000만원보다 100만원 적다.
    source: 2025년 제62회 세무사 1차 · 세법학개론 62번 · 재고자산 평가방법 변경과 임의평가 | 판단 기준 2026.11.1. | 법인세법 시행령 제74조. 교재 328~335쪽.
