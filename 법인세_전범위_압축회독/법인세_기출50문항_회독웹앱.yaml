  - type: ox
    subject: 세법학개론
    unit: 법인세 01.01 법인세의 개요
    statement: 국가와 지방자치단체는 그 소득에 대한 법인세를 낼 의무가 없다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: 국가·지방자치단체의 자기 소득에 대한 납세의무는 면제된다. 다른 지급받는 자의 세액을 원천징수할 의무는 별도로 판단한다.
    source: 2022년 제59회 세무사 1차 · 세법학개론 66번 ① · 납세의무자와 과세소득 범위 | 판단 기준 2026.11.1. | 교재 7~10쪽, 582쪽. 법인세법 제3조, 제4조제1·3·4·5항.
    referenceYear: 2026
    tags:
      - 법인세
      - 법인세기출40
