      1. 매각분의 세무상 장부가액 = 62,000,000 + 7,000,000 × 50% = 65,500,000원.

      2. 세무상 양도이익 = 70,000,000 − 65,500,000 = 4,500,000원. 장부상 이익보다 3,500,000원 작으므로 그 차이를 익금불산입한다. 잔여 토지의 유보는 +3,500,000원.

      **검산 O**　세무상 이익은 장부상 이익보다 350만원 적다.
