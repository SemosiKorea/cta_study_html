  - type: ox
    subject: 세법학개론
    unit: 법인세 02.02 익금
    statement: |-
      임대보증금을 실제 수령일부터 계산하는 일별 방식으로, 현행 간주임대료를 구하세요.

      1.1.~12.31. 평년이며 법인은 성실 기장했다. 부동산임대업이 주업이고 차입금적수가 자기자본적수의 2배를 초과한다. 금액 단위는 백만원.

      상가 1은 600㎡, 임대 전기 10.1.~차기 9.30., 보증금 500을 전기 9.10. 수령. 상가 2는 300㎡, 임대 당기 8.8.~차차기 8.7., 보증금 300을 당기 8.10. 수령.

      건물 연면적 900㎡, 토지 1,500㎡. 전전기 7.1. 취득가액 600(토지 200 포함), 감가상각누계액 30. 보증금 운용으로 이자 2.5, 배당 0.5, 유가증권처분손실 1.5. 적용할 현행 연이자율은 3.1%다.

      **검산 O·X**　계산한 간주임대료는 625만원 이상이다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: |-
      **계산 결과**　일별 실제 잔액 기준 간주임대료 약 6,249,041원

      1. 건설비는 토지를 제외한 취득가액 600 − 200 = 400백만원. 감가상각누계액 30은 빼지 않는다. 금융수익은 2.5 + 0.5 + max(−1.5, 0) = 3백만원.

      2. 상가 1은 365일. 상가 2는 8.8.~12.31. 146일, 8.10.~12.31. 144일. 임대면적·기간을 반영한 건설비 적수 K = 400 × (600 × 365 + 300 × 146) / 900 (백만원·일).

      3. 실제 보증금 수령일을 쓰면 [(500 × 365 + 300 × 144) − K] × 3.1% / 365 − 3 ≈ 6.249041백만원, 즉 약 6,249,041원. 토지와 감가상각누계액을 동시에 빼거나 증권처분손실로 배당·이자를 줄이지 않는다.

      4. 만약 상가 2 보증금도 임대개시일에 받았다면 144일이 146일로 바뀐다. 같은 식으로 [(500 × 365 + 300 × 146) − K] × 3.1% / 365 − 3 = 6.3백만원(6,300,000원)이다.

      **검산 X**　625만원에 약 959원 미달한다.
    source: 2025년 제62회 세무사 1차 · 세법학개론 64번 · 임대보증금 적수와 건설비 적수 | 판단 기준 2026.11.1. | 조세특례제한법 제138조, 시행령 제132조제5항, 시행규칙 제59조, 법인세법 시행규칙 제6조(연 3.1%). 교재 65~68쪽.
