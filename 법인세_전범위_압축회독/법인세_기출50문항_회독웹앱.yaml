  - type: ox
    subject: 세법학개론
    unit: 법인세 2021기출 · 기업업무추진비 한도로 특수관계인 수입금액 역산
    choices:
      - O
      - X
      - "?"
    source: 2021년 제58회 세무사 1차 · 세법학개론 63번 · 기업업무추진비 한도로 특수관계인 수입금액 역산 | 판단 기준 2026.11.1. | 법 제25조제4항·제6항 · 영 제42조제1항 | https://www.q-net.or.kr/cst003.do?artlSeq=5208510&boardId=Q004&gId=22&gSite=L&id=cst00302&menuType=cst00309
    referenceYear: 2026
    statement: |-
      제조업을 영위하는 영리내국법인 (주)A의 수입금액 중 특수관계인과의 거래에서 발생한 금액을 구하세요.

      2021년 기출의 사실관계에 2026.11.1. 기준 규정을 적용하는 학습문항입니다. 과거 신고세액을 재산정하는 의미는 아닙니다.

      (주)A는 중소기업이 아니다. 사업연도는 2021.1.1.~9.30.의 9개월이다.

      포괄손익계산서에 계상된 기업업무추진비는 59,000,000원이고, 문화기업업무추진비는 없다. 이 중 법정 한도를 초과하여 손금불산입한 금액은 5,400,000원이다.

      수입금액은 200억원이고, 그중 특수관계인과의 거래에서 발생한 수입금액은 100억원 미만이다.

      모든 기업업무추진비는 신용카드를 사용하여 업무상 적법하게 지출했다. 제시된 자료 외에 추가 특례 지출은 없다.

      **검산 O·X**　특수관계인과의 거래에서 발생한 수입금액은 40억원 이상이다.
    answer: X
    rationale: |-
      **현행 계산 결과**　① 30억원

      1. 역산할 한도: 59,000,000−5,400,000=53,600,000

      2. 기본한도: 12,000,000×9/12=9,000,000

      3. 수입금액 부분: 특수관계 매출을 X라 하면 X<100억원이므로 일반 매출은 100억원 초과. 수입금액 한도=100억원×0.3%+(100억원−X)×0.2%+X×0.2%×10%=50,000,000−0.0018X

      4. X 결정: 9,000,000+50,000,000−0.0018X=53,600,000 → X=3,000,000,000원=30억원

      **검산 X**　한도를 역산하면 특수관계인 수입금액은 30억원이다.
