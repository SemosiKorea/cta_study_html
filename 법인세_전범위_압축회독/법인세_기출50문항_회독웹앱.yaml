      - 2024기출
  - type: ox
    subject: 세법학개론
    unit: 법인세 01.02 사업연도
    statement: 사업연도 변경은 직전 사업연도 종료일부터 2개월 이내에 신고한다. 종전 개시일부터 새 개시일 전날까지의 기간이 3개월 미만이면 그 기간을 새 사업연도에 포함한다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: 변경신고는 직전 사업연도 종료일부터 3개월 이내다. 종전 개시일~새 개시일 전날은 원칙적으로 별도 사업연도이고 1개월 미만일 때 새 사업연도에 포함한다. 정확히 1개월이면 별도 기간이다.
    source: 2024년 제61회 세무사 1차 · 세법학개론 61번 ③ · 사업연도 설정·변경 | 판단 기준 2026.11.1. | 법 제6~8조, 영 제4조. 교재 13~16쪽.
    referenceYear: 2026
    tags:
      - 법인세
      - 법인세기출40
      - 선지OX
      - 2024기출
    correction: 사업연도 변경은 직전 사업연도 종료일부터 3개월 이내 신고하며, 종전 개시일부터 새 개시일 전날까지의 기간이 1개월 미만이면 새 사업연도에 포함한다.
  - type: ox
    subject: 세법학개론
    unit: 법인세 01.02 사업연도
    statement: 내국법인이 사업연도 중 분할로 해산한 경우에는 사업연도 개시일부터 분할등기일까지가 해산한 법인의 1사업연도다.
