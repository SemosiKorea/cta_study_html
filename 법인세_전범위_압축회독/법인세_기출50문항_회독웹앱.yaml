      - 2022기출
  - type: ox
    subject: 세법학개론
    unit: 법인세 01.01 법인세의 개요
    statement: 비영리내국법인은 청산소득에 대해 법인세를 낼 의무가 있다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: 비영리내국법인은 청산소득에 대한 법인세를 납부하지 않는다. 각 사업연도의 수익사업 소득 및 법정 토지등 양도소득은 따로 본다.
    source: 2022년 제59회 세무사 1차 · 세법학개론 66번 ② · 납세의무자와 과세소득 범위 | 판단 기준 2026.11.1. | 교재 7~10쪽, 582쪽. 법인세법 제3조, 제4조제1·3·4·5항.
    referenceYear: 2026
    tags:
      - 법인세
      - 법인세기출40
      - 선지OX
      - 2022기출
    correction: 비영리내국법인의 청산소득은 법인세 과세대상에서 제외된다.
  - type: ox
    subject: 세법학개론
    unit: 법인세 01.01 법인세의 개요
    statement: 국내원천소득이 있는 외국법인은 법인세 납세의무가 있다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: 국내원천소득이 있는 외국법인은 법인세 납세의무자다. 비영리외국법인은 과세되는 사업연도 소득을 수익사업 범위로 더 좁힌다.
    source: 2022년 제59회 세무사 1차 · 세법학개론 66번 ③ · 납세의무자와 과세소득 범위 | 판단 기준 2026.11.1. | 교재 7~10쪽, 582쪽. 법인세법 제3조, 제4조제1·3·4·5항.
