      - O
      - X
      - "?"
    answer: O
    rationale: 법령 또는 정관 등이 정하는 1회계기간이고 1년이 상한이다.
    source: 2024년 제61회 세무사 1차 · 세법학개론 61번 ① · 사업연도 설정·변경 | 판단 기준 2026.11.1. | 법 제6~8조, 영 제4조. 교재 13~16쪽.
