      토지 절반을 판 당기의 세무조정 방향과 금액을 구하세요.

      토지 B의 직전기 자본금과 적립금조정명세서(을) 기말 유보잔액은 +7,000,000원이다. 당기에 토지의 50%를 70,000,000원에 팔아 장부가액 62,000,000원을 제거하고 처분이익 8,000,000원을 계상했다.

      **검산 O·X**　매각분에 관한 조정 후의 세법상 처분이익은 장부 이익보다 300만원 이상 적다.
