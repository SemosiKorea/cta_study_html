  - type: ox
    subject: 세법학개론
    unit: 법인세 2021기출 · 입주권 추가 법인세·장부 불성실가산세·이자 원천징수
    choices:
      - O
      - X
      - "?"
    source: 2021년 제58회 세무사 1차 · 세법학개론 62번 · 입주권 추가 법인세·장부 불성실가산세·이자 원천징수 | 판단 기준 2026.11.1. | 법 제55조의2제1항제4호·제73조제1항·제75조의3 | https://www.q-net.or.kr/cst003.do?artlSeq=5208510&boardId=Q004&gId=22&gSite=L&id=cst00302&menuType=cst00309
    referenceYear: 2026
    statement: |-
      제조업을 영위하는 영리내국법인 (주)A의 다음 독립된 상황에서 ㉠ + ㉡ + ㉢의 합계를 구하세요.

      학습용 재구성: 원문 ㉠의 “차감납부세액 증가”를 토지등 양도소득에 대한 추가 법인세액으로 한정했습니다. 일반 법인세 증감액은 계산에 넣지 않습니다. 2026.11.1. 기준 규정을 적용합니다.

      (주)A는 중소기업이 아니며 사업연도는 2021.1.1.~12.31.이다.

      다음에 제시되는 각 상황은 상호 독립적이라고 가정하고, 주어진 자료 이외에는 고려하지 않는다. 또한 (주)A의 소득 중에 법인세가 부과되지 아니하거나 비과세 또는 면제되는 소득은 없음

      ㉠ (주)A는 토지등 양도소득에 대한 법인세 과세대상인 조합원입주권을 특수관계가 없는 자에게 양도하여 양도소득 150,000,000원이 발생했다. 이 양도에 대한 제55조의2의 추가 법인세액을 구한다.

      ㉡ (주)A는 장부 비치·기장의무를 이행하지 않았다. 산출세액은 30,000,000원, 수입금액은 100억원이다. 장부의 기록·보관 불성실가산세를 구한다.

      ㉢ (주)A가 제조업 법인 (주)B에게 일시적으로 자금을 빌려주고 국내에서 받은 이자수익 5,000,000원이 각 사업연도 소득금액에 포함되어 있다. 원천징수가 적법하게 이루어졌을 때 차감납부세액 계산에서 기납부세액으로 공제할 금액을 구한다.

      **검산 O·X**　학습문장의 ㉠ + ㉡ + ㉢ 합계는 35,000,000원을 초과한다.
    answer: O
    rationale: |-
      **현행 계산 결과**　학습용 재구성 결과 ⑤ 38,250,000원

      1. ㉠ 입주권 추가 법인세: 150,000,000×20%=30,000,000 — 주택 등을 취득할 권리의 추가세액이다. 일반 사업연도 소득에 대한 법인세에 더한다.

      2. ㉡ 장부 기록·보관 불성실가산세: max(30,000,000×20%,10,000,000,000×7/10,000)=max(6,000,000,7,000,000)=7,000,000

      3. ㉢ 원천징수 기납부세액: 5,000,000×25%=1,250,000 — 제조업 법인이 일시적으로 빌려준 자금의 이자는 비영업대금의 이익이다.

      4. 학습문장 합계: 30,000,000+7,000,000+1,250,000=38,250,000

      원문 ㉠은 차감납부세액의 증가 전체를 묻지만, 일반 법인세 증감 계산에 필요한 전체 과세표준 자료가 충분하지 않다. 이 학습형은 추가 법인세액만 계산한다는 전제를 명시한 재구성이며, 공식 당시 정답과 금액이 같아도 원문 전체의 엄격한 충족 집계에는 넣지 않는다.

      **검산 O**　합계는 38,250,000원이다. ㉠은 토지등 양도소득 추가 법인세액만으로 한정한 결과다.
