      연중 차입금은 B은행 5천만원(2022.3.1.부터 1년, 6%), C은행 4천만원(2022.1.1.부터 3년, 3%), 특수관계법인 D 3천만원(2022.10.1.부터 2년, 4%)이다. 당좌대출이자율 4.6%, 가중평균 적용 불능 사유·당좌대출이자율 선택 없음. 1년은 365일, 원 미만 절사.

