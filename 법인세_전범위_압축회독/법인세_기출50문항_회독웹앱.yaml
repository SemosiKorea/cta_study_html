  - type: ox
    subject: 세법학개론
    unit: 법인세 01.02 사업연도
    statement: 법령·정관 등에 사업연도 규정이 없는 내국법인은 따로 사업연도를 정해 법인설립신고와 함께 납세지 관할 세무서장에게 신고할 수 있다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: 따로 정함이 없는 내국법인은 사업연도를 정해 설립신고와 함께 관할 세무서장에게 신고한다. 법은 사업자등록과 함께 신고하는 방법도 인정한다.
    source: 2024년 제61회 세무사 1차 · 세법학개론 61번 ② · 사업연도 설정·변경 | 판단 기준 2026.11.1. | 법 제6~8조, 영 제4조. 교재 13~16쪽.
    referenceYear: 2026
    tags:
