    statement: |-
      잔금을 지급한 제5기의 세무조정과 소득처분을 각각 구하세요.

      제4기는 2022년, 제5기는 2023년, 제6기는 2024년이다.

      2022.4.30. A가 특수관계인인 임원에게서 시가 500,000,000원인 토지를 800,000,000원에 매입해 800,000,000원을 취득가액으로 회계처리했다. 2022.4.30.에 600,000,000원을 지급하고 잔금은 2023.4.30. 지급했다. 2024.5.4. 해당 토지를 900,000,000원에 매도했다.

      **검산 O·X**　제5기 소득금액은 이 토지 거래에 대한 세무조정으로 순증가한다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: |-
      **계산 결과**　제5기 손금불산입 2억원(상여), 손금산입 2억원(△유보) · 순증감 0원

      1. 제4기 고가액=8−5=3억원. 실제 지급 6억원 중 시가 초과액 1억원은 임원 상여. 남은 잔금 2억원은 미지급 상태의 유보. 장부상 토지가액에서 3억원을 손금산입(△유보)해 세무상 가액을 5억원으로 맞춘다.

      2. 제5기 잔금 2억원을 지급하면 임원에게 현실 귀속. 2억원을 가산하여 상여처분하고, 전기에 가산했던 미지급액 유보 2억원은 손금산입(△유보)으로 추인한다. 제5기 소득금액 순증감은 0원.

      3. 제6기 매각 시 양도가 9억원−세무상 원가 5억원=차익 4억원. 회계 차익 1억원과의 차이 3억원은 토지 처분 시의 조정으로, 제5기에는 넣지 않는다.

