      비중소기업 영리내국법인 A의 12개월 사업연도다.

      총지출 56,000,000원. 지출도 귀속도 입증하지 못한 8,000,000원, 지출증빙은 있으나 적격증명서류 없음 6,000,000원(모두 건당 3만원 초과, 영수증 수취). 나머지는 적격증빙 수취분이며 경조금은 없다.

      매출액 12,000,000,000원 중 특수관계인 매출 4,500,000,000원.

      **검산 O·X**　기타사외유출액이 대표자상여액보다 많지만 두 금액의 차이가 500만원에는 못 미친다.
