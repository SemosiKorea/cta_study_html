    answer: O
    rationale: |-
      **계산 결과**　대표자상여 8,000,000원 / 기타사외유출 12,350,000원

      1. 총지출 5,600만원−무증빙 800만원−건당 3만원 초과 적격증빙 미수취 600만원=한도 대조액 4,200만원.

      2. 한도 기본액 1,200만원. 일반 수입 75억원×0.3%=2,250만원. 특수관계 수입에 해당하는 구간은 (25억원×0.3%+20억원×0.2%)×10%=115만원. 합계 3,565만원.

      3. 한도초과 4,200−3,565=635만원. 기타사외유출=600+635=1,235만원. 무증빙 800만원은 귀속불명 대표자상여.

      **검산 O**　차액은 4,350,000원으로 500만원 미만이다.
