    subject: 세법학개론
    unit: 법인세 03.06 감가상각비
    statement: |-
      2022년 감가상각비의 손금불산입액을 원 미만 절사로 구하세요.

      감면을 매년 받아 온 A가 2020.1.1. 기계장치를 5천만원에 취득했다. 장부상 상각비는 2020년 2천만원, 2021년 0원, 2022년 800만원이다.

      상각방법·내용연수를 신고하지 않았다. 기준내용연수는 10년이고 문제에서 제시한 상각률은 정액법 0.100, 정률법 0.259다. 2020년과 2021년 세무조정은 적정했다.

      **검산 O·X**　손금불산입액은 90만원 미만이다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: |-
      **계산 결과**　당기 손금불산입 889,402원

      1. 신고하지 않은 기계장치는 기준내용연수 10년의 정률법을 적용한다. 2020년 한도는 50,000,000 × 0.259 = 12,950,000원. 장부상 20,000,000원 중 7,050,000원을 부인하고 세무상 잔액은 37,050,000원이다.

      2. 2021년 한도는 37,050,000 × 0.259 = 9,595,950원. 장부상 상각비가 없으므로 전기 부인액 7,050,000원을 먼저 추인한다. 감면법인이므로 나머지 2,545,950원도 의제상각한다. 세무상 잔액은 27,454,050원이다.

      3. 2022년 한도는 27,454,050 × 0.259 = 7,110,598.95원 → 원 미만 절사 7,110,598원. 장부상 8,000,000원에서 빼면 889,402원이다.

      **검산 O**　889,402원은 90만원 미만이다.
    source: 2022년 제59회 세무사 1차 · 세법학개론 68번 · 감면법인의 정률법과 감가상각의제 | 판단 기준 2026.11.1. | 교재 166~168쪽, 174~176쪽. 법인세법 제23조, 시행령 제26조·제32조.
