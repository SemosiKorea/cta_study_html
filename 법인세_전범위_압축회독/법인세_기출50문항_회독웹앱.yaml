  - type: ox
    subject: 세법학개론
    unit: 법인세 03.07 기부금
    statement: |-
      직전기 세액 자료의 일관성을 검토하세요. 직전기 일반 산출세액을 그 해의 법정세율로 바로잡고 환급액을 유지할 때 기부금 한도초과액도 구하세요.

      2026년 제조업 중소기업(일반세율 적용)의 결손을 2025년으로 소급하는 변형이다. 기부금 조정 전 당기순이익 4,000,000원, 익금산입 14,000,000원, 손금산입 45,000,000원. 기부금 이월액 손금산입 없음. 당기 결손금 전액에 대해 1,200,000원을 환급 신청했다.

      직전기(2025년 개시·종료) 과세표준 200,000,000원, 총산출세액 35,000,000원(토지등 양도분 15,000,000원 포함). 직전기 일반 과표 2억원 이하 세율은 9%이고, 환급을 제한할 별도 공제·감면은 없다.

      **검산 O·X**　직전기 일반 산출세액을 바로잡더라도 기부금 한도초과액은 1,400만원 이상이다.
    choices:
      - O
      - X
      - "?"
    answer: X
    rationale: |-
      **계산 결과**　제시 자료 그대로는 확정 불가 / 직전기 세액을 바로잡고 환급액을 유지하면 약 13,666,667원

      1. 당기 조정 전 소득은 4,000,000 + 14,000,000 − 45,000,000 = −27,000,000원이다. 소급공제 환급액은 결손이 난 2026년 세율이 아니라 소급 대상인 2025년 세율을 사용한다.

      2. 제시 세액에서 토지등 양도분을 빼면 35,000,000 − 15,000,000 = 20,000,000원이다. 그러나 2025년 개시 일반법인의 과표 2억원에 대한 일반 산출세액은 200,000,000 × 9% = 18,000,000원이다. 두 값은 양립하지 않는다.

      3. 조건부 계산. 원 자료의 총산출세액만 33,000,000원(일반분 18,000,000 + 토지분 15,000,000)으로 고치고 환급액 1,200,000원을 유지한다. 세액공제·감면 등 별도 제한이 없다면 소급공제 결손금은 반올림·절사 전 1,200,000 ÷ 9% ≈ 13,333,333원이다.

      4. 기부금 한도초과액은 27,000,000 − 13,333,333… ≈ 13,666,667원이다. 원 단위 처리 전의 근삿값이다.

      **검산 X**　조건부 한도초과액은 1,400만원 미만이다.
    source: 2023년 제60회 세무사 1차 · 세법학개론 66번 · 결손금 소급공제로 기부금 한도초과액 역산 | 판단 기준 2026.11.1. | 법인세법 제24조·제55조·제72조, 시행령 제110조. 교재 200~204, 461~465쪽. 직전기 세율은 2025년 개시 사업연도의 일반법인 세율.
    referenceYear: 2026
    tags:
      - 법인세
