  - type: ox
    subject: 세법학개론
    unit: 법인세 02.01 각 사업연도소득의 계산
    statement: |-
      잘못된 세무조정을 바로잡아 첫 사업연도 산출세액을 구하세요.

      비중소기업 일반세율 적용 제조법인이 2026년 3월 23일 설립해 12월 31일 결산했다. 수정 전 소득 304,000,000원에는 아래의 잘못되었거나 적정한 세무조정이 모두 들어 있다.

      ① 토지 장부가 24,000,000원, 양도가 20,000,000원. 12월 30일 소유권이전등기를 했지만 잔금 미수라며 손실을 손금불산입했다. ② 11월 1일 부도난 미수금 3,500,000원을 결산상 대손처리하고 손금불산입했다.

      ③ 전기요금 연체가산금 300,000원과 건강보험법상 연체금 700,000원을 모두 손금불산입했다. ④ 장기할부판매의 현재가치할인차금 2,000,000원은 장부에 계상하지 않고 익금불산입했다. ⑤ 지급기간 3년인 창고임대료 중 기간경과분 1,500,000원을 수익으로 기장한 후 현금 미수라며 익금불산입했다. 그 밖의 사항은 없고 원 미만 절사. 당기 일반 과세표준 2억원 이하분은 10%, 2억원 초과 200억원 이하분은 20%다.

      **검산 O·X**　산출세액은 4,400만원에 미달한다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: |-
      **계산 결과**　산출세액 43,973,333원

      1. 토지 양도는 등기가 잔금보다 빠르므로 이 기간의 손실이다. 종전 손금불산입을 취소해 4,000,000원을 뺀다. 미수금은 부도 사실만으로 이 시점에 대손요건을 채우지 못해 3,500,000원 손금불산입을 유지한다.

      2. 계약상 전기요금 연체가산금은 비용이어서 300,000원을 뺀다. 건강보험법상 연체금은 종전 조정을 유지한다.

      3. 결산에 반영하지 않은 현재가치할인차금의 익금불산입을 취소해 2,000,000원을 더한다. 지급기간 1년 초과 임대료는 경과분을 인식하므로 1,500,000원도 더한다.

      4. 수정 소득 = 304,000,000 − 4,000,000 − 300,000 + 2,000,000 + 1,500,000 = 303,200,000원. 1개월 미만 단수를 올려 사업연도는 10개월이다.

      5. 연환산 과표 = 303,200,000 × 12/10 = 363,840,000원. 2026년 개시 일반법인의 하위 두 구간 세율로 연간세액 = 200,000,000 × 10% + 163,840,000 × 20% = 52,768,000원. 단기사업연도 산출세액 = 52,768,000 × 10/12 = 43,973,333원(원 미만 절사).

      **검산 O**　4,400만원에 26,667원 미달한다.
    source: 2023년 제60회 세무사 1차 · 세법학개론 62번 · 세무조정 오류와 10개월 사업연도 | 판단 기준 2026.11.1. | 법인세법 제19조의2·제21조·제40조·제55조, 시행령 제19조의2·제68조·제71조·제92조. 교재 129, 271~272, 302~315, 472~473쪽.
    referenceYear: 2026
    tags:
      - 법인세
      - 법인세기출40
      - 계산검산
      - 2023기출
  - type: ox
    subject: 세법학개론
    unit: 법인세 02.01 각 사업연도소득의 계산
    statement: |-
      세 건을 세무조정한 뒤 소득금액조정합계표의 손금산입·익금불산입 열 합계만 구하세요.

      각 자료는 독립이며, 2022년 소득금액조정합계표의 손금산입·익금불산입 금액을 합산한다. K-IFRS를 적용하는 A의 매출채권 1억 5천만원에는 당기 중 상법상 소멸시효가 완성된 매출채권 200만원이 장부에 남아 있다.

      토지대금 1억원, 취득세 400만원과 그 가산세 100만원을 모두 토지 1억 500만원으로 계상했다.

      B 주식을 3,000만원에 취득했고(지분 30%, B의 순자산 장부가와 시가는 모두 1억원), 현금배당 50만원은 주식 장부금액에서 차감했다. 기말 지분법이익 200만원을 당기수익으로 계상했다. 수입배당금 익금불산입은 무시한다.

      **검산 O·X**　이 열의 합계는 450만원을 넘는다.
    choices:
      - O
      - X
      - "?"
    answer: O
    rationale: |-
      **계산 결과**　손금산입·익금불산입 열 합계 5,000,000원

      1. 상법상 시효완성 매출채권 200만원은 신고조정 대손금이다. 장부에서 비용 처리하지 않아도 당기 손금산입 200만원이다.

      2. 취득세 본세 400만원은 토지 원가에 남긴다. 가산세 100만원은 세무상 토지 원가에서 빼기 위해 손금산입 100만원(△유보)하고, 제재성 가산세 자체는 손금불산입 100만원(기타사외유출)한다. 문제에서 묻는 차감 열에는 100만원만 적는다.

      3. 현금배당 50만원은 장부에 수익이 없어 익금산입하므로 차감 열에 넣지 않는다. 미실현 지분법평가이익 200만원은 익금불산입한다.

      4. 차감 열 합계 = 200 + 100 + 200 = 500만원. 양쪽 조정을 상계한 순효과를 묻는 문항이 아니다.

      **검산 O**　500만원이므로 450만원을 초과한다.
    source: 2022년 제59회 세무사 1차 · 세법학개론 67번 · 소득금액조정합계표의 차감항목 | 판단 기준 2026.11.1. | 교재 25~29쪽, 115~116쪽, 269~270쪽, 326쪽. 법인세법 제19조의2·제21조·제42조, 시행령 제19조의2.
